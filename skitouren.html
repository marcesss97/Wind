    return { elev, slope, aspect };
  }

  // Horn-Neigung (°) am ganzen DEM-Pixel; 0 ohne Daten
  function hornPx(tiles, z, ix, iy, mpp) {
    const h = [];
    for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) { const v = elevPx(tiles, z, ix + i, iy + j); if (v !== v) return 0; h.push(v); }
    const e = (h[2] + 2 * h[5] + h[8] - h[0] - 2 * h[3] - h[6]) / (8 * mpp), s = (h[6] + 2 * h[7] + h[8] - h[0] - 2 * h[1] - h[2]) / (8 * mpp);
    return Math.atan(Math.hypot(e, s)) / rad;
  }

  /* ── Zusammenbau ── */
  const zD = () => CFG.demZoom, zS = () => CFG.slopeZoom;
  const world = (lat, lon, z) => { const t = U.geo.tileXY(lat, lon, z + 16); return [t.x / 256, t.y / 256]; };  // Weltpixel (Kachelindex bei z+16 = 1/256 px)

  async function compute(pts) {
    const dz = zD(), sz = zS(), wanted = new Map(), sc = 2 ** (dz - sz);
    const coords = pts.map((p) => {
      const [dx, dy] = world(p.lat, p.lon, dz), [sx, sy] = world(p.lat, p.lon, sz);
      const o = offsets(U.geo.mPerPx(p.lat, sz));
      const gx = Math.floor(sx), gy = Math.floor(sy), m = Math.ceil(o.half * sc) + 3;
      want(wanted, 'd', dz, Math.floor(dx) - m, Math.floor(dy) - m, Math.floor(dx) + m, Math.floor(dy) + m);
      want(wanted, 's', sz, gx - o.half, gy - o.half, gx + o.half, gy + o.half);
      return { dx, dy, gx, gy, o };
    });
    const tiles = await gather(wanted);
    const demMemo = new Map();   // DEM-Pixel → Neigung (gedeckelt auf 29.9, ohne Daten 0)
    return pts.map((p, i) => {
      const c = coords[i];
      const dem = demAt(tiles, dz, p.lat, c.dx, c.dy);
      const mppD = U.geo.mPerPx(p.lat, dz);
      const demAtPx = (cx, cy) => {
        const ix = Math.floor((cx + 0.5) * sc), iy = Math.floor((cy + 0.5) * sc), k = iy * 8388608 + ix;
        let v = demMemo.get(k);
        if (v === undefined) { v = Math.min(hornPx(tiles, dz, ix, iy, mppD), MAX_UNDER_30); demMemo.set(k, v); }
        return v;
      };
      const st = steepestInCircle(tiles, sz, c.gx, c.gy, c.o, demAtPx);
      const steep = {};
      radii.forEach((m, k) => {
        const fb = dem.slope == null ? null : Math.min(dem.slope, MAX_UNDER_30);   // Rückfall: DEM am Punkt
        steep[m] = !st[k] ? fb : fb == null ? st[k] : Math.max(st[k], fb);
      });
      return { lat: p.lat, lon: p.lon, elev: dem.elev, slope: dem.slope, aspect: dem.aspect, steep };
    });
  }

  const at = async (lat, lon) => (await compute([{ lat, lon }]))[0];
  async function sampleLine(pts, stepM = 25) {
    const dense = U.geo.densify(pts, stepM);
    const out = await compute(dense);
    out.forEach((s, i) => { s.d = dense[i].d; });
    return out;
  }

  return { at, sampleLine, slopeClassColor, slopeClassAt, demTileFor, slopeTileFor, elevOf, hornAt };
})();

/* ── 40-risk.js ── */
/* ══════════════════════════ 40 · Risiko (GRM) und Gehzeit ══════════════════════════
   Grundlage: Grafische Reduktionsmethode, Merkblatt «Achtung Lawinen!» (SLF/KAT 2022).
   Der Risikowert r (0–3) folgt der Skala von Skitourenguru: 0–1 gering, 1–2 erhöht, 2–3 hoch,
   mit r = 1 auf der Grenze grün/orange und r = 2 auf der Grenze orange/rot der GRM-Grafik.
   Das ist eine Planungshilfe. Die Beurteilung vor Ort und am Einzelhang ersetzt sie nicht. */
const Risk = (() => {
  const G = CFG.grm;
  const G_MIN = 1 - 1 / 3; // tiefster Wert («gering −»)

  /* ── Gefahrenwert am Ort ── */
  const sector8 = (deg) => CFG.aspects8[Math.round((((deg % 360) + 360) % 360) / 45) % 8];
  function inCoreZone(p, aspectDeg, elev) {
    const aspOk = !p.aspects?.length || aspectDeg == null || p.aspects.includes(sector8(aspectDeg));
    const elevOk = elev == null || ((p.elevMin == null || elev >= p.elevMin) && (p.elevMax == null || elev <= p.elevMax));
    return aspOk && elevOk;
  }
  // → {g, inCore, problem}; g = null, wenn kein Bulletin gilt
  function levelAt(region, aspectDeg, elev) {
    if (!region || !region.level) return { g: null, inCore: false, problem: null };
    const relevant = (region.problems || []).filter((p) => !CFG.grmIgnore.includes(p.type) && p.level);
    if (!relevant.length) return { g: Math.max(G_MIN, region.g - G.outsideCore), inCore: false, problem: null };
    let best = null;
    for (const p of relevant) {
      const inCore = inCoreZone(p, aspectDeg, elev);
      const g = Math.max(G_MIN, inCore ? p.g : p.g - G.outsideCore);
      if (!best || g > best.g) best = { g, inCore, problem: p };
    }
    return best;
  }

  /* ── GRM ── */
  const limits = (g) => ({ lo: G.orange.a - G.orange.b * g, hi: G.red.a - G.red.b * g });
  // massgebender Umkreis je Gefahrenwert (Spur / ganzer Hang / inkl. Auslauf)
  const radiusFor = (g) => (G.radiusM.find((x) => g <= x.gMax) || G.radiusM[G.radiusM.length - 1]).m;
  const steepFor = (s, g) => (s.steep ? s.steep[radiusFor(g)] ?? s.steep[G.radiusM[0].m] : s.slope);
  function grm(steep, g) {
    if (g == null || steep == null) return { zone: null, r: null };
    const { lo, hi } = limits(g), w = hi - lo;
    const r = U.clamp(steep >= hi ? 2 + (steep - hi) / w : steep >= lo ? 1 + (steep - lo) / w : 1 - (lo - steep) / w, 0, 3);
    return { zone: r < 1 ? 0 : r < 2 ? 1 : 2, r };
  }
  // Gefahrenwert g (Stufe ± ⅓) → {level, sub 'minus'|'neutral'|'plus'}
  const split = (g) => { const level = Math.round(g), d = g - level; return { level, sub: d < -0.1 ? 'minus' : d > 0.1 ? 'plus' : 'neutral' }; };
  const zoneOf = (r) => (r == null ? null : r < 1 ? 0 : r < 2 ? 1 : 2);

  /* ── Route bewerten ──
     samples: aus Terrain.sampleLine; regionAt: (lat, lon) → Region (Bulletin.regionAt) */
  function assess(samples, regionAt) {
    const out = samples.map((s) => {
      if (s.gap) return { ...s, region: null, g: null, inCore: false, problem: null, steepUsed: null, zone: null, r: null };
      const region = regionAt(s.lat, s.lon);
      const lv = levelAt(region, s.aspect, s.elev);
      const used = lv.g == null ? null : steepFor(s, lv.g);
      const { zone, r } = grm(used, lv.g);
      return { ...s, region, g: lv.g, inCore: lv.inCore, problem: lv.problem, steepUsed: used, zone, r };
    });
    const step = out.length > 1 ? out[out.length - 1].d / (out.length - 1) : 1;
    // Routenwert: Mittel über die riskantesten 250 m (nicht zusammenhängend)
    const rs = out.map((s) => s.r).filter((r) => r != null).sort((a, b) => b - a);
    const k = Math.max(1, Math.min(rs.length, Math.round(G.routeWindowM / Math.max(step, 1))));
    const r = rs.length ? rs.slice(0, k).reduce((a, b) => a + b, 0) / k : null;
    // Längenanteile je Zone
    const share = [0, 0, 0];
    for (let i = 1; i < out.length; i++) { const z = out[i].zone; if (z != null) share[z] += out[i].d - out[i - 1].d; }
    const tot = share[0] + share[1] + share[2] || 1;
    return { samples: out, r, cls: zoneOf(r), share: share.map((x) => x / tot), cruxes: cruxes(out), step };
  }

  /* ── Schlüsselstellen: zusammenhängende Abschnitte im Lawinengelände (steilste Stelle im Spurbereich ≥ 30°).
     Klasse nach Steilheit: 1 = 30–35°, 2 = 35–40°, 3 = ab 40°. Abschnitte < 50 m Abstand werden verbunden. */
  function cruxes(samples) {
    const r0 = G.radiusM[0].m, gap = 50, list = [];
    let cur = null;
    samples.forEach((s, i) => {
      const st = s.gap ? null : s.steep ? s.steep[r0] : s.slope;
      if (st != null && st >= 30) {
        if (cur && s.d - samples[cur.i1].d <= gap) cur.i1 = i;
        else list.push((cur = { i0: i, i1: i }));
      }
    });
    return list.map(({ i0, i1 }) => {
      const part = samples.slice(i0, i1 + 1);
      let maxSteep = 0, elev = null, r = null, sx = 0, sy = 0, region = null;
      for (const s of part) {
        const st = s.steep ? s.steep[r0] : s.slope;
        if (st > maxSteep) maxSteep = st;
        if (s.elev != null) elev = Math.max(elev ?? -Infinity, s.elev);
        if (s.r != null && (r == null || s.r > r)) { r = s.r; region = s.region; }
        if (s.aspect != null) { sx += Math.sin((s.aspect * Math.PI) / 180); sy += Math.cos((s.aspect * Math.PI) / 180); }
      }
      const aspect = sx || sy ? ((Math.atan2(sx, sy) * 180) / Math.PI + 360) % 360 : null;
      const cls = maxSteep >= 40 ? 3 : maxSteep >= 35 ? 2 : 1;
      return { i0, i1, d0: samples[i0].d, d1: samples[i1].d, maxSteep, aspect, elev, r, zone: zoneOf(r), cls, region: region ? region.name : null };
    });
  }

  /* ── Gehzeit ──
     Aufstieg: Zeit für Höhenmeter und für Strecke; grösserer Wert + halber kleinerer (DAV).
     Höhenrauschen des Modells: Auf- und Abstieg erst ab 5 m Änderung zählen (Hysterese).
     eta je Sample: verteilt nach Leistungsaufwand (km + Hm/100). Abfahrt: Anteil der Aufstiegszeit. */
  function time(samples, prefs = CFG.time, { roundTrip = true } = {}) {
    const n = samples.length;
    if (!n) return null;
    let up = 0, down = 0, ref = samples[0].elev;
    const effort = [0];
    for (let i = 1; i < n; i++) {
      const s = samples[i], dd = s.d - samples[i - 1].d;
      let dUp = 0;
      if (s.elev != null && ref != null) {
        const dh = s.elev - ref;
        if (dh >= 5) { up += dh; dUp = dh; ref = s.elev; } else if (dh <= -5) { down -= dh; ref = s.elev; }
      } else if (ref == null) ref = s.elev;
      effort.push(effort[i - 1] + dd / 1000 + dUp / 100);
    }
    const distM = samples[n - 1].d;
    const tV = (up / prefs.upHmH) * 60, tH = (distM / 1000 / prefs.flatKmH) * 60;
    const upMin = Math.max(tV, tH) + Math.min(tV, tH) / 2;
    const downMin = roundTrip ? upMin * prefs.downFactor : 0;
    const E = effort[n - 1] || 1;
    return { distM, upM: up, downM: down, upMin, downMin, totalMin: upMin + downMin, eta: effort.map((e) => (e / E) * upMin) };
  }

  // Für Diagramme: Grenzlinien der GRM bei Gefahrenwert g
  return { levelAt, grm, limits, radiusFor, steepFor, assess, time, zoneOf, sector8, split };
})();

/* ── 41-tour.js ── */
/* ══════════════════════════ 41 · Tour (Gelände + Bulletin + Risiko + Gehzeit) ══════════════════════════
   Die einzige Stelle, die eine Linie vollständig auswertet. Tourenliste und Planer benutzen beide Tour.analyze. */
const Tour = (() => {
  const STEP = 25;        // Abstand der Auswertepunkte (m)
  const GAP_M = 500;      // längere Sprünge in einer Routenlinie sind Lücken (Varianten, getrennte Teile)

  // Samples innerhalb einer Lücke markieren (kein Gelände, kein Risiko)
  function markGaps(line, samples) {
    const gaps = [];
    let d = 0;
    for (let i = 1; i < line.length; i++) {
      const seg = U.geo.dist(line[i - 1], line[i]);
      if (seg > GAP_M) gaps.push([d, d + seg]);
      d += seg;
    }
    if (gaps.length) for (const s of samples) s.gap = gaps.some(([a, b]) => s.d > a + 1 && s.d < b - 1);
    return gaps.length;
  }

  /* line: [{lat, lon}] · opts: {orient: Start = tiefster Endpunkt, gaps: Sprünge > 500 m als Lücke markieren
     (false für selbst gezeichnete Routen, deren Punkte weit auseinander liegen dürfen), roundTrip: Abfahrt einrechnen, prefs}
     → {line, samples, assess, time, start, summit, gaps (Anzahl Lücken, bei gaps: false immer 0)} */
  async function analyze(line, { orient = true, gaps: markGapsOn = true, roundTrip = true, prefs = CFG.time } = {}) {
    if (!line || line.length < 2) throw new Error('Die Route braucht mindestens zwei Punkte');
    let samples = await Terrain.sampleLine(line, STEP);
    const e0 = samples[0].elev, e1 = samples[samples.length - 1].elev;
    if (orient && e0 != null && e1 != null && e0 > e1 + 30) {
      line = [...line].reverse();
      samples = await Terrain.sampleLine(line, STEP); // Kacheln sind im Cache
    }
    const gaps = markGapsOn ? markGaps(line, samples) : 0;
    await Bulletin.load();
    const assess = Risk.assess(samples, Bulletin.regionAt);
    const time = Risk.time(assess.samples, prefs, { roundTrip });
    const top = assess.samples.reduce((m, s) => (s.elev != null && (m == null || s.elev > m.elev) ? s : m), null);
    return { line, samples: assess.samples, assess, time, start: assess.samples[0], summit: top, gaps };
  }

  return { analyze, STEP };
})();

/* ── 45-grmlayer.js ── */
/* ══════════════════════════ 45 · Kartenebene «Risiko nach GRM» ══════════════════════════
   Je Pixel ≥ 30° (Hangneigungskarte): Gefahrenwert aus Bulletin-Region (16×16-Block), Exposition und Höhe (Terrarium-DEM)
   → Zone der GRM → grün/orange/rot. Kacheln kommen aus dem Cache von Terrain. */
const GrmLayer = (() => {
  const TILE = 256, BLOCK = 16, ALPHA = 150;
  const rad = U.geo.rad;
  const hex = (c) => [1, 3, 5].map((k) => parseInt(c.slice(k, k + 2), 16));
  const COLORS = CFG.risk.map((r) => hex(r.color));
  const MID = [0, ...CFG.slopeClasses.map((c) => c.mid)]; // Klasse → Klassenmitte

  // Kachelmitte-Block → Breite/Länge (inverse Web-Mercator)
  const tileLat = (y, n) => (Math.atan(Math.sinh(Math.PI * (1 - (2 * y) / n))) / rad);
  const tileLon = (x, n) => (x / n) * 360 - 180;

  async function paint(canvas, z, x, y) {
    const dz = Math.min(z, CFG.demZoom), sz = Math.min(z, CFG.slopeZoom), kd = z - dz, ks = z - sz;
    const [bul, dem, slope] = await Promise.all([
      Bulletin.load(), Terrain.demTileFor(dz, x >> kd, y >> kd), Terrain.slopeTileFor(sz, x >> ks, y >> ks),
    ]);
    if (!dem || !slope || !bul) return;
    const el = Terrain.elevOf(dem), n = 2 ** z, ctx = canvas.getContext('2d'), out = ctx.createImageData(TILE, TILE), o = out.data;
    const offDx = (x - ((x >> kd) << kd)) * TILE, offDy = (y - ((y >> kd) << kd)) * TILE;
    const offSx = (x - ((x >> ks) << ks)) * TILE, offSy = (y - ((y >> ks) << ks)) * TILE;
    const mpp = U.geo.mPerPx(tileLat(y + 0.5, n), dz);
    const regions = [];
    for (let by = 0; by < TILE / BLOCK; by++) for (let bx = 0; bx < TILE / BLOCK; bx++) {
      regions.push(Bulletin.regionAt(tileLat(y + (by + 0.5) / (TILE / BLOCK), n), tileLon(x + (bx + 0.5) / (TILE / BLOCK), n)));
    }
    const memo = new Map();
    for (let py = 0; py < TILE; py++) {
      const dy = (offDy + py) >> kd, sy = (offSy + py) >> ks, bRow = (py / BLOCK | 0) * (TILE / BLOCK);
      for (let px = 0; px < TILE; px++) {
        const cls = Terrain.slopeClassAt(slope, (offSx + px) >> ks, sy);
        if (!cls) continue;
        const bi = bRow + (px / BLOCK | 0), region = regions[bi];
        if (!region || !region.level) continue;
        const dx = (offDx + px) >> kd, asp = Terrain.hornAt(el, dx, dy, mpp).aspect, elev = el[dy * TILE + dx];
        const sector = asp == null ? -1 : Math.round(asp / 45) % 8;
        const key = ((bi * 9 + sector + 1) * 1000 + Math.round(elev / 10) + 300) * 6 + cls;
        let zone = memo.get(key);
        if (zone === undefined) {
          const g = Risk.levelAt(region, sector < 0 ? null : sector * 45, elev).g;
          zone = g == null ? -1 : Risk.grm(MID[cls], g).zone;
          memo.set(key, zone);
        }
        if (zone < 0) continue;
        const c = COLORS[zone], i = (py * TILE + px) * 4;
        o[i] = c[0]; o[i + 1] = c[1]; o[i + 2] = c[2]; o[i + 3] = ALPHA;
      }
    }
    ctx.putImageData(out, 0, 0);
  }

  // → Leaflet-GridLayer (erst ab CFG.grmLayerMinZoom; darunter leer); pane: Name einer vorhandenen Karten-Pane
  function create({ pane } = {}) {
    const Layer = L.GridLayer.extend({
      createTile(c, done) {
        const tile = document.createElement('canvas');
        tile.width = tile.height = TILE;
        if (c.z < CFG.grmLayerMinZoom) { setTimeout(() => done(null, tile)); return tile; }
        paint(tile, c.z, c.x, c.y).catch(() => { /* Kachel fehlt oder Netz: bleibt leer */ }).finally(() => done(null, tile));
        return tile;
      },
    });
    return new Layer({ minZoom: CFG.grmLayerMinZoom, tileSize: TILE, keepBuffer: 1, ...(pane ? { pane } : {}) });
  }

  return { create };
})();

/* ── 50-ui-icons.js ── */
/* ══════════════════════════ 50 · Icons (alle selbst gezeichnet, SVG-Strings) ══════════════════════════
   Farben kommen aus CSS-Klassen/Variablen (styles.css), nicht aus dem Code. */
const Icons = (() => {
  let uid = 0;
  const f1 = (v) => Math.round(v * 100) / 100;
  const rad = U.geo.rad;

  /* ── Gefahrenstufe: Zahl-Badge (Farben über .lv-N der umgebenden Karte) ── */
  const SUB_MARK = { minus: '-', neutral: '=', plus: '+' };
  const subMark = (sub) => SUB_MARK[sub] || '';   // Unterstufe → «-», «=», «+»
  function danger(level, sub) {
    const t = level ? level + subMark(sub) : '–';
    return `<svg class="ic-danger" viewBox="0 0 40 40" role="img" aria-label="Gefahrenstufe ${U.esc(t)}"><rect width="40" height="40" rx="8"/><text x="20" y="21" text-anchor="middle" dominant-baseline="central">${U.esc(t)}</text></svg>`;
  }
  // «Erheblich», «Sehr gross»
  const levelName = (level) => U.cap((CFG.levels[level] || CFG.levels[0]).name);
  // «Erheblich (3-)»
  const levelLabel = (level, sub) => (level ? `${levelName(level)} (${level}${subMark(sub)})` : levelName(0));

  /* ── Expositionsrose: 8 Sektoren, aussen leicht gerundete Spitzen ── */
  const pol = (a, r) => [64 + r * Math.sin(a * rad), 64 - r * Math.cos(a * rad)];
  const pt = (p) => `${f1(p[0])} ${f1(p[1])}`;
  function sectorPath(i) {
    const a = i * 45, c = [64, 64];
    const p1 = pol(a - 22.5, 50), p2 = pol(a + 22.5, 50), tip = pol(a, 64);
    // Kanten laufen geradlinig zur Spitze und enden kurz davor in einer Rundung (Q-Kurve durch die Spitze)
    const k = 0.1;
    const q1 = [p1[0] + (tip[0] - p1[0]) * (1 - k), p1[1] + (tip[1] - p1[1]) * (1 - k)];
    const q2 = [p2[0] + (tip[0] - p2[0]) * (1 - k), p2[1] + (tip[1] - p2[1]) * (1 - k)];
    return `M${pt(c)}L${pt(p1)}L${pt(q1)}Q${pt(tip)} ${pt(q2)}L${pt(p2)}Z`;
  }
  const ROSE_LABEL = { 0: 'N', 2: 'O', 4: 'S', 6: 'W' }; // Sektor-Index → deutsche Beschriftung
  function rose(aspects = [], size = 64) {
    const on = new Set(aspects);
    let sectors = '', labels = '';
    CFG.aspects8.forEach((k, i) => {
      const act = on.has(k);
      sectors += `<path class="rose-sector${act ? ' on' : ''}" vector-effect="non-scaling-stroke" d="${sectorPath(i)}"/>`;
      if (ROSE_LABEL[i]) { const [x, y] = pol(i * 45, 38); labels += `<text class="rose-label${act ? ' on' : ''}" x="${f1(x)}" y="${f1(y)}">${ROSE_LABEL[i]}</text>`; }
    });
    const txt = on.size ? 'Expositionen: ' + CFG.aspects8.filter((k) => on.has(k)).map((k) => CFG.aspectDe[k]).join(', ') : 'Alle Expositionen';
    return `<svg class="ic-rose" viewBox="0 0 128 128" width="${size}" height="${size}" role="img" aria-label="${U.esc(txt)}">${sectors}${labels}</svg>`;
  }

  /* ── Höhenpiktogramm: Berg mit Trennlinie, betroffener Teil gefüllt ──
     min = untere Grenze (Gefahr ab dort aufwärts), max = obere Grenze; beide null: ganz gefüllt. */
  function roundedPoly(pts, r) {
    let d = '';
    pts.forEach((p, i) => {
      const a = pts[(i + pts.length - 1) % pts.length], b = pts[(i + 1) % pts.length];
      const la = Math.hypot(p[0] - a[0], p[1] - a[1]), lb = Math.hypot(b[0] - p[0], b[1] - p[1]);
      const ka = Math.min(r, la / 2) / la, kb = Math.min(r, lb / 2) / lb;
      const s = [p[0] + (a[0] - p[0]) * ka, p[1] + (a[1] - p[1]) * ka], e = [p[0] + (b[0] - p[0]) * kb, p[1] + (b[1] - p[1]) * kb];
      d += `${i ? 'L' : 'M'}${pt(s)}Q${pt(p)} ${pt(e)}`;
    });
    return d + 'Z';
  }
  const MOUNTAIN = roundedPoly([[2, 57], [21, 19], [29, 22], [41, 8], [62, 57]], 3.5);
  function elev(min, max, size = 64) {
    const id = 'ev' + ++uid, has = (v) => v != null;
    let y0 = 0, y1 = 64, lines = [];
    if (has(min) && has(max)) { y0 = 28; y1 = 44; lines = [28, 44]; }
    else if (has(min)) { y0 = 36; lines = [36]; }
    else if (has(max)) { y1 = 36; lines = [36]; }
    const txt = has(min) && has(max) ? `${U.fmt.m(min)} bis ${U.fmt.m(max)}` : has(min) ? `ab ${U.fmt.m(min)}` : has(max) ? `bis ${U.fmt.m(max)}` : 'alle Höhenlagen';
    return `<svg class="ic-elev" viewBox="-.6 -.6 65.2 65.2" width="${size}" height="${size}" role="img" aria-label="${U.esc(txt)}">
      <defs><clipPath id="${id}"><path d="${MOUNTAIN}"/></clipPath></defs>
      <rect class="elev-fill" x="0" y="${y0}" width="64" height="${y1 - y0}" clip-path="url(#${id})"/>
      ${lines.map((y) => `<line class="elev-line" x1="0" x2="64" y1="${y}" y2="${y}" clip-path="url(#${id})"/>`).join('')}
      <path class="elev-shape" d="${MOUNTAIN}"/></svg>`;
  }

  /* ── Lawinenproblem-Piktogramme 48×48: grau (Gelände/Schnee) + blau (das Problem) ── */
  const P_BG = '<rect class="pb" x=".5" y=".5" width="47" height="47" rx="8"/>';
  const flake = (x, y, r) => {
    let d = '';
    for (let k = 0; k < 3; k++) { const a = k * 60 * rad, dx = r * Math.sin(a), dy = r * Math.cos(a); d += `M${f1(x - dx)} ${f1(y - dy)}L${f1(x + dx)} ${f1(y + dy)}`; }
    return `<path class="b" d="${d}"/>`;
  };
  const PROBLEMS = {
    // Neuschnee: Flocken fallen auf einen Hang
    new_snow: `<path class="gf" d="M5 41 43 25v16z"/>${flake(14, 14, 4.5)}${flake(27, 10, 3.5)}${flake(33, 21, 4)}${flake(17, 28, 3.5)}`,
    // Triebschnee: Wind (Wellenlinien) und angewehte Schneeplatte auf der Leeseite
    wind_slab: `<path class="gf" d="M5 41 24 15l19 26z"/><path class="bs" d="M24 15l7.6 10.4L24 28.6 19 22z"/><path class="b" d="M4 11q4-3 8 0t8 0M2 19q4-3 8 0t8 0"/>`,
    // Altschnee: Schichtung der Schneedecke, eine eingelagerte schwache Schicht
    persistent_weak_layers: `<rect class="gf" x="7" y="9" width="34" height="8" rx="2"/><path class="b" stroke-dasharray="1 4.5" stroke-width="3.2" d="M8 23.5h32"/><rect class="gf" x="7" y="29" width="34" height="11" rx="2"/>`,
    // Nassschnee: durchfeuchtete Decke, Tropfen
    wet_snow: `<path class="gf" d="M5 42 43 26v16z"/><path class="bs" d="M16 9c3 4.5 5 7.2 5 10a5 5 0 0 1-10 0c0-2.8 2-5.5 5-10z"/><path class="bs" d="M33 14c2.2 3.2 3.6 5.2 3.6 7.2a3.6 3.6 0 0 1-7.2 0c0-2 1.4-4 3.6-7.2z"/>`,
    // Gleitschnee: Schneedecke rutscht als Ganzes über den glatten Untergrund
    gliding_snow: `<path class="gf" d="M4 42 44 22v20z"/><path class="bs" d="M7 29 28 18.5l4 2.2-21 10.8z"/><path class="b" d="M27 36l9-4.5M33 32.5l3.2-1.6-1.2 3.4"/>`,
    // Kein ausgeprägtes Problem: ruhiger Hang, Haken
    no_distinct_avalanche_problem: `<path class="gf" d="M5 41 43 29v12z"/><circle class="b" cx="24" cy="17" r="9"/><path class="b" d="m19.5 17 3.3 3.3 6-6.6"/>`,
  };
  PROBLEMS.favourable_situation = PROBLEMS.no_distinct_avalanche_problem;
  function problem(type) {
    const body = PROBLEMS[type] || PROBLEMS.no_distinct_avalanche_problem;
    return `<svg class="ic-problem" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="${U.esc(CFG.problems[type] || type || '')}">${P_BG}${body}</svg>`;
  }

  /* ── Risiko 0–3: Ring in der Zonenfarbe, Wert in der Mitte ── */
  function risk(r, size = 24) {
    if (r == null || !Number.isFinite(r)) return `<svg class="ic-risk" viewBox="0 0 24 24" width="${size}" height="${size}" aria-label="Risiko unbekannt"><circle class="rk-ring" cx="12" cy="12" r="9.5" stroke="var(--nolevel)"/></svg>`;
    const z = Risk.zoneOf(r), c = CFG.risk[z];
    return `<svg class="ic-risk" viewBox="0 0 24 24" width="${size}" height="${size}" role="img" aria-label="${U.esc(c.name)}, Wert ${U.fmt.num(r, 1)}"><circle cx="12" cy="12" r="12" fill="${c.color}"/><text x="12" y="12.5">${U.fmt.num(r, 1)}</text></svg>`;
  }
  // Zonenfarbe (0 grün, 1 orange, 2 rot) bzw. Risikowert → CSS-Farbe aus CFG
  const zoneColor = (z) => (z == null ? 'var(--nolevel)' : CFG.risk[Math.min(2, z)].color);

  /* ── Schlüsselstelle: 1–3 Ringe ── */
  function crux(cls) {
    const n = U.clamp(Math.round(cls) || 1, 1, 3);
    return `<svg class="ic-crux" viewBox="0 0 20 20" width="20" height="20" role="img" aria-label="Schlüsselstelle Klasse ${n}">${[9.25, 6, 2.75].slice(0, n).map((r) => `<circle class="cx" cx="10" cy="10" r="${r}"/>`).join('')}</svg>`;
  }

  /* ── Strich-Icons 16 px (24 → viewBox 16, Strich currentColor) ── */
  const I = {
    layers: '<path d="M8 2 14 5 8 8 2 5z"/><path d="m2 8 6 3 6-3M2 11l6 3 6-3"/>',
    search: '<circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3.5 3.5"/>',
    locate: '<path d="M14 2 2 7.3l5 1.7 1.7 5z"/>',
    plus: '<path d="M8 3v10M3 8h10"/>',
    minus: '<path d="M3 8h10"/>',
    close: '<path d="m3.5 3.5 9 9M12.5 3.5l-9 9"/>',
    chevron: '<path d="m4 10 4-4 4 4"/>',
    info: '<circle cx="8" cy="8" r="6"/><path d="M8 7.5V11M8 5v.01"/>',
    route: '<circle cx="3.5" cy="12.5" r="1.5"/><circle cx="12.5" cy="3.5" r="1.5"/><path d="M5 12.5h5a2.5 2.5 0 0 0 0-5H6a2.5 2.5 0 0 1 0-4h4.5"/>',
    mountain: '<path d="m1.5 13 4.5-8 2.5 4 2-3 4 7z"/>',
    clock: '<circle cx="8" cy="8" r="6"/><path d="M8 4.5V8l2.5 1.5"/>',
    'arrow-up': '<path d="M8 13V3M4 7l4-4 4 4"/>',
    'arrow-down': '<path d="M8 3v10M4 9l4 4 4-4"/>',
    camera: '<rect x="2" y="4.5" width="12" height="8.5" rx="1.5"/><circle cx="8" cy="8.7" r="2.2"/><path d="m5.5 4.5 1-2h3l1 2"/>',
    station: '<path d="M8 2v12M5 4.5h3M5 8h3M5 11.5h3M4 14h8"/>',
    warning: '<path d="M8 2 14.5 13.5h-13z"/><path d="M8 6.5v3M8 11.5v.01"/>',
    download: '<path d="M8 2v8M4.5 7 8 10.5 11.5 7M3 13.5h10"/>',
    upload: '<path d="M8 10V2M4.5 5 8 1.5 11.5 5M3 13.5h10"/>',
    trash: '<path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.7 9h5.6l.7-9M7 7v4M9 7v4"/>',
    edit: '<path d="m2.5 13.5.7-3L11 2.7 13.3 5 5.5 12.8z"/><path d="m9.5 4.2 2.3 2.3"/>',
    gps: '<circle cx="8" cy="8" r="3.2"/><path d="M8 1.5v2.3M8 12.2v2.3M1.5 8h2.3M12.2 8h2.3"/>',
  };
  function icon(name, size) {
    const s = size ? ` width="${size}" height="${size}"` : '';
    return `<svg class="icon" viewBox="0 0 16 16"${s} aria-hidden="true" focusable="false">${I[name] || ''}</svg>`;
  }
  // Alle Elemente mit data-icon="name" in root füllen
  const hydrate = (root = document) => U.$$('[data-icon]', root).forEach((el) => { if (!el.firstChild) el.innerHTML = icon(el.dataset.icon); });

  return { danger, rose, elev, problem, risk, crux, icon, hydrate, levelName, levelLabel, subMark, zoneColor };
})();

/* ── 51-ui-charts.js ── */
/* ══════════════════════════ 51 · Diagramme (SVG, ohne Bibliothek) ══════════════════════════ */
const Charts = (() => {
  const f1 = (v) => Math.round(v * 10) / 10;
  const observers = new WeakMap();

  // el neu zeichnen, wenn sich die Breite ändert
  function responsive(el, draw) {
    const old = observers.get(el);
    if (old) old.disconnect();
    let w = 0;
    draw(w = el.clientWidth);
    if (typeof ResizeObserver === 'undefined') return;
    const ro = new ResizeObserver(() => { const nw = el.clientWidth; if (nw && Math.abs(nw - w) > 1) draw((w = nw)); });
    ro.observe(el);
    observers.set(el, ro);
  }

  const niceStep = (range, n) => {
    const raw = range / n, pow = 10 ** Math.floor(Math.log10(raw)), f = raw / pow;
    return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * pow;
  };
  const rgb = (c) => `rgb(${c[0]},${c[1]},${c[2]})`;
  // Hangneigungsklasse (0 = unter 30°) nach Klassenmitte − 2.5°
  const slopeCls = (deg) => { let c = 0; CFG.slopeClasses.forEach((k) => { if (deg >= k.mid - 2.5) c = k.cls; }); return c; };
  const steepest = (s) => {
    if (s.gap) return null;
    const v = s.steep ? Object.values(s.steep).filter((x) => x != null) : [];
    const m = v.length ? Math.max(...v) : s.slope;
    return m == null ? null : m;
  };

  /* ── Messwert-Farbskalen (CFG.scales) → {color, dark} ── */
  function scale(name, v) {
    const sc = CFG.scales[name];
    if (v == null || !Number.isFinite(+v)) return { color: CFG.scales.none, dark: true, none: true };
    let i = sc.stops.filter((s) => v >= s).length;
    if (sc.colors.length === sc.stops.length) i -= 1;
    const color = sc.colors[U.clamp(i, 0, sc.colors.length - 1)];
    const [r, g, b] = [1, 3, 5].map((k) => parseInt(color.slice(k, k + 2), 16));
    return { color, dark: 0.299 * r + 0.587 * g + 0.114 * b < 140 };
  }

  /* ── Höhenprofil ──
     samples: Terrain/Risk-Samples {d, elev, slope, aspect, steep, zone, gap}
     opts.onHover(sample|null, index), opts.marks [{d0, d1}] hinterlegte Abschnitte, opts.eta [min je Sample] */
  function profile(el, samples, { onHover, marks = [], eta } = {}) {
    el.classList.add('chart');
    if (!samples || samples.length < 2) { el.innerHTML = ''; return; }
    const total = samples[samples.length - 1].d || 1;
    const els = samples.map((s) => s.elev).filter((v) => v != null);
    if (!els.length) { el.innerHTML = '<div class="state">Für diese Linie liegen keine Höhendaten vor.</div>'; return; }
    const step = niceStep(Math.max(...els) - Math.min(...els) || 100, 3);
    const lo = Math.floor(Math.min(...els) / step) * step, hi = Math.max(Math.ceil(Math.max(...els) / step) * step, lo + step);
    const hasZone = samples.some((s) => s.zone != null);

    responsive(el, (W) => {
      W = W || 360;
      const M = { l: 48, r: 8, t: 8 }, H = 132, BH = 10, BG = 3, pw = W - M.l - M.r;
      const bandsTop = M.t + H + 10;
      const nb = hasZone ? 2 : 1;
      const axisY = bandsTop + nb * (BH + BG) + 12;
      const SH = axisY + 8;
      const X = (d) => M.l + (d / total) * pw, Y = (e) => M.t + H - ((e - lo) / (hi - lo)) * H;
      // y-Gitter
      let grid = '';
      for (let e = lo; e <= hi + 0.1; e += step) grid += `<line class="ch-grid" x1="${M.l}" x2="${W - M.r}" y1="${f1(Y(e))}" y2="${f1(Y(e))}"/><text x="${M.l - 6}" y="${f1(Y(e))}" text-anchor="end" dominant-baseline="central">${U.fmt.num(e)}</text>`;
      // x-Achse (km)
      const xs = niceStep(total / 1000, Math.max(2, Math.floor(pw / 80))) * 1000;
      let xl = '';
      for (let d = 0; d <= total + 1; d += xs) xl += `<text x="${f1(X(d))}" y="${axisY}" text-anchor="${d === 0 ? 'start' : 'middle'}">${U.fmt.num(d / 1000, xs < 1000 ? 1 : 0)} km</text>`;
      // Fläche und Linie (Lücken/fehlende Höhen unterbrechen)
      let line = '', area = '', run = [];
      const flush = () => {
        if (run.length > 1) {
          const pts = run.map((s) => `${f1(X(s.d))} ${f1(Y(s.elev))}`);
          line += `M${pts.join('L')}`;
          area += `M${f1(X(run[0].d))} ${f1(Y(lo))}L${pts.join('L')}L${f1(X(run[run.length - 1].d))} ${f1(Y(lo))}Z`;
        }
        run = [];
      };
      samples.forEach((s) => { if (s.gap || s.elev == null) flush(); else run.push(s); });
      flush();
      const markRects = marks.map((m) => `<rect class="ch-mark" x="${f1(X(m.d0))}" y="${M.t}" width="${Math.max(2, f1(X(m.d1 ?? m.d0) - X(m.d0)))}" height="${H}"/>`).join('');
      // Bänder: je Sample ein Streifen von Mitte zu Mitte
      const half = (i) => ({ a: i ? (samples[i].d + samples[i - 1].d) / 2 : 0, b: i < samples.length - 1 ? (samples[i].d + samples[i + 1].d) / 2 : total });
      let zb = '', sb = '';
      samples.forEach((s, i) => {
        const { a, b } = half(i), x = f1(X(a)), w = Math.max(0.6, f1(X(b) - X(a)) + 0.4);
        const zc = s.zone != null ? Icons.zoneColor(s.zone) : 'var(--chart-none)';
        if (hasZone) zb += `<rect x="${x}" y="${bandsTop}" width="${w}" height="${BH}" fill="${zc}"/>`;
        const st = steepest(s), c = st == null ? 0 : slopeCls(st);
        sb += `<rect x="${x}" y="${bandsTop + (hasZone ? BH + BG : 0)}" width="${w}" height="${BH}" fill="${c ? rgb(CFG.slopeClasses[c - 1].rgb) : 'var(--chart-none)'}"/>`;
      });
      const lab = (i, t) => `<text x="0" y="${bandsTop + i * (BH + BG) + BH / 2}" dominant-baseline="central">${t}</text>`;
      el.innerHTML = `<svg viewBox="0 0 ${W} ${SH}" width="${W}" height="${SH}" role="img" aria-label="Höhenprofil">
        ${grid}${markRects}<path class="ch-area" d="${area}"/><path class="ch-line" d="${line}"/>
        ${hasZone ? lab(0, 'GRM') : ''}${lab(hasZone ? 1 : 0, 'Hang')}${zb}${sb}${xl}
        <line class="ch-cursor" y1="${M.t}" y2="${bandsTop + nb * (BH + BG) - BG}" style="display:none"/><circle class="ch-dot" r="4" style="display:none"/>
        <rect class="ch-hit" x="${M.l}" y="${M.t}" width="${pw}" height="${axisY - M.t}" fill="transparent"/></svg>
        <div class="ch-tip" hidden></div>
        <div class="ch-legend">${hasZone ? riskLegend() : ''}${CFG.slopeClasses.map((c) => `<span><i style="--c:${rgb(c.rgb)}"></i>${c.name}</span>`).join('')}</div>`;

      const svg = el.firstElementChild, cur = U.$('.ch-cursor', svg), dot = U.$('.ch-dot', svg), tip = U.$('.ch-tip', el), hit = U.$('.ch-hit', svg);
      const hide = () => { cur.style.display = dot.style.display = 'none'; tip.hidden = true; if (onHover) onHover(null, -1); };
      hit.addEventListener('pointerleave', hide);
      hit.addEventListener('pointermove', (ev) => {
        const r = svg.getBoundingClientRect(), k = W / r.width, d = ((ev.clientX - r.left) * k - M.l) / pw * total;
        let i = 0, best = Infinity;
        for (let j = 0; j < samples.length; j++) { const dd = Math.abs(samples[j].d - d); if (dd < best) { best = dd; i = j; } }
        const s = samples[i], x = X(s.d);
        cur.setAttribute('x1', f1(x)); cur.setAttribute('x2', f1(x)); cur.style.display = '';
        if (s.elev != null && !s.gap) { dot.setAttribute('cx', f1(x)); dot.setAttribute('cy', f1(Y(s.elev))); dot.style.display = ''; } else dot.style.display = 'none';
        const st = steepest(s), bits = [`Distanz ${U.fmt.km(s.d)}`];
        if (st != null) bits.push(`Neigung ${U.fmt.deg(st)}`);
        if (s.aspect != null) bits.push(`Exposition ${U.fmt.aspect(s.aspect)}`);
        if (eta && eta[i] != null) bits.push(`Zeit ${U.fmt.dur(eta[i])}`);
        if (s.r != null) bits.push(`Risiko ${U.fmt.num(s.r, 1)}`);
        tip.innerHTML = `<b>${s.elev != null ? U.fmt.m(s.elev) : '–'}</b>${bits.join('<br>')}`;
        tip.hidden = false;
        const px = x / k, tw = tip.offsetWidth;
        tip.style.left = Math.round(U.clamp(px - tw / 2, 0, r.width - tw)) + 'px';
        tip.style.top = '4px';
        if (onHover) onHover(s, i);
      });
    });
  }

  /* ── GRM-Grafik: Gefahrenstufe (x) gegen Neigung (y) ── */
  function grm(el, points = []) {
    el.classList.add('chart');
    const GMIN = 0.67, GMAX = 4.33, YMIN = 25, YMAX = 50, COLS = 60;
    responsive(el, (W) => {
      W = W || 360;
      const M = { l: 36, r: 8, t: 8, b: 28 }, H = Math.round(Math.min(280, Math.max(200, W * 0.62))), pw = W - M.l - M.r;
      const X = (g) => M.l + ((g - GMIN) / (GMAX - GMIN)) * pw, Y = (a) => M.t + ((YMAX - a) / (YMAX - YMIN)) * H;
      const E = 0.25; // Rand über den Ausschnitt hinaus (für den weichen Übergang)
      const cols = [];
      for (let i = 0; i <= COLS; i++) { const g = GMIN - E + ((GMAX - GMIN + 2 * E) * i) / COLS; cols.push({ g, ...Risk.limits(g) }); }
      const cl = (v) => U.clamp(v, YMIN - 6, YMAX + 6);
      const band = (a, b) => `M${cols.map((c) => `${f1(X(c.g))} ${f1(Y(cl(a(c))))}`).join('L')}L${[...cols].reverse().map((c) => `${f1(X(c.g))} ${f1(Y(cl(b(c))))}`).join('L')}Z`;
      const zones = [
        [0, band(() => YMIN - 6, (c) => c.lo)],
        [1, band((c) => c.lo, (c) => c.hi)],
        [2, band((c) => c.hi, () => YMAX + 6)],
      ].map(([z, d]) => `<path d="${d}" fill="${Icons.zoneColor(z)}"/>`).join('');
      let grid = '', xl = '';
      for (let a = YMIN; a <= YMAX; a += 5) grid += `<text x="${M.l - 6}" y="${f1(Y(a))}" text-anchor="end" dominant-baseline="central">${a}°</text>`;
      [30, 35, 40].forEach((a) => { grid += `<line class="ch-dash" x1="${M.l}" x2="${W - M.r}" y1="${f1(Y(a))}" y2="${f1(Y(a))}"/>`; });
      for (let g = 1; g <= 4; g++) {
        grid += `<line class="ch-grid" x1="${f1(X(g))}" x2="${f1(X(g))}" y1="${M.t}" y2="${M.t + H}"/>`;
        xl += `<text x="${f1(X(g))}" y="${M.t + H + 18}" text-anchor="middle">${Icons.levelName(g)}</text>`;
      }
      const pts = points.filter((p) => p.g != null && p.steep != null).map((p) => {
        const x = X(U.clamp(p.g, GMIN, GMAX)), y = Y(U.clamp(p.steep, YMIN, YMAX)), left = x > W - 80;
        return `<circle class="ch-pt" cx="${f1(x)}" cy="${f1(y)}" r="5"/>${p.label ? `<text class="ch-pt-label" x="${f1(x + (left ? -9 : 9))}" y="${f1(y)}" text-anchor="${left ? 'end' : 'start'}" dominant-baseline="central">${U.esc(p.label)}</text>` : ''}`;
      }).join('');
      const id = 'gc' + Math.random().toString(36).slice(2, 8);
      el.innerHTML = `<svg viewBox="0 0 ${W} ${H + M.t + M.b}" width="${W}" height="${H + M.t + M.b}" role="img" aria-label="Grafische Reduktionsmethode: Neigung gegen Gefahrenstufe">
        <defs><clipPath id="${id}"><rect x="${M.l}" y="${M.t}" width="${pw}" height="${H}"/></clipPath><filter id="${id}b" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="2.5"/></filter></defs>
        <g clip-path="url(#${id})"><g filter="url(#${id}b)" opacity=".6">${zones}</g></g>
        ${grid}${xl}${pts}</svg>
        <div class="ch-legend">${riskLegend()}</div>`;
    });
  }

  /* ── Mini-Linie als SVG-String; null-Werte unterbrechen ── */
  // Legende der Risikozonen (grün/orange/rot) als <span>-Reihe für .ch-legend
  const riskLegend = () => CFG.risk.map((r) => `<span><i style="--c:${r.color}"></i>${U.esc(r.name)}</span>`).join('');
  function spark(values, { w = 96, h = 28, cls = '' } = {}) {
    const v = (values || []).map((x) => (x == null || !Number.isFinite(+x) ? null : +x));
    const ok = v.filter((x) => x != null);
    if (ok.length < 2) return `<svg class="spark ${cls}" width="${w}" height="${h}" aria-hidden="true"></svg>`;
    const lo = Math.min(...ok), hi = Math.max(...ok), rg = hi - lo || 1, p = 2;
    const X = (i) => p + (i / (v.length - 1)) * (w - 2 * p), Y = (x) => (hi === lo ? h / 2 : h - p - ((x - lo) / rg) * (h - 2 * p));
    let d = '', run = false;
    v.forEach((x, i) => { if (x == null) run = false; else { d += `${run ? 'L' : 'M'}${f1(X(i))} ${f1(Y(x))}`; run = true; } });
    return `<svg class="spark ${cls}" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true"><path d="${d}"/></svg>`;
  }

  return { profile, grm, spark, scale, riskLegend };
})();

/* ── 52-ui-map.js ── */
/* ══════════════════════════ 52 · Karte (Leaflet) ══════════════════════════ */
const MapView = (() => {
  const BLANK = 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
  const BADGE_ZOOM = 9, STATION_ZOOM = 8, STATION_LABEL_ZOOM = 11, CAM_ZOOM = 9, ACC_ZOOM = 8, MAX_MARKERS = 300;
  const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const ll = (p) => [p.lat, p.lon];

  let map = null, base = null, baseId = null;
  const tileLayers = new Map();   // id → L.TileLayer (Ebenen aus CFG.overlays)
  const routes = new Map();       // id → L.LayerGroup
  const markers = new Map();      // id → L.Marker
  const clickFns = [];
  let clickMode = null;           // Klick-Modus (z. B. Zeichnen): übernimmt Kartenklicks statt Pin und 'point'
  const on = {};                  // Ebene → ein
  let stationList = [], accList = [], grmLayer = null, webcamSeq = 0;

  /* ── Hinweis (Toast) ── */
  let toastTimer = 0;
  function toast(msg, { error = false } = {}) {
    const t = U.$('#toast');
    t.textContent = msg;
    t.className = 'toast' + (error ? ' err' : '');
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 5000);
  }

  /* ── Zustand der Ebenen ── */
  const SPECIAL = [
    { id: 'bulletin', name: 'Lawinenbulletin', dflt: true },
    { id: 'stations', name: 'Messstationen' },
    { id: 'webcams', name: 'Webcams' },
    { id: 'accidents', name: 'Lawinenunfälle' },
    { id: 'grm', name: 'Risiko nach GRM', note: `ab Zoomstufe ${CFG.grmLayerMinZoom}` },
  ];
  function loadState() {
    const s = U.store.get('layers', {}) || {};
    baseId = CFG.base.some((b) => b.id === s.base) ? s.base : CFG.base[0].id;
    CFG.overlays.forEach((o) => { on[o.id] = s.on && o.id in s.on ? !!s.on[o.id] : !!o.on; });
    SPECIAL.forEach((o) => { on[o.id] = s.on && o.id in s.on ? !!s.on[o.id] : !!o.dflt; });
  }
  const saveState = () => U.store.set('layers', { base: baseId, on });

  /* ── Grundkarte und Kachel-Ebenen ── */
  const tiles = (url, extra) => L.tileLayer(url, { errorTileUrl: BLANK, maxNativeZoom: 18, crossOrigin: true, ...extra });
  function setBase(id) {
    baseId = id;
    if (base) map.removeLayer(base);
    base = tiles(CFG.base.find((b) => b.id === id).url, { zIndex: 1 }).addTo(map);
    saveState();
  }

  /* ── Bulletin: Flächen + Zahl-Badges ── */
  let bulGroup = null, badgeGroup = null;
  const polys = [];
  const BULLETIN_FILL = 0.3, BULLETIN_FILL_UNDER_GRM = 0.12;
  // Bei eingeschalteter GRM-Ebene (ab ihrer Zoomstufe) treten die Bulletin-Flächen zurück
  const bulletinFill = () => (on.grm && map.getZoom() >= CFG.grmLayerMinZoom ? BULLETIN_FILL_UNDER_GRM : BULLETIN_FILL);
  const syncFill = () => polys.forEach((p) => p.setStyle({ fillOpacity: bulletinFill() }));
  function centroid(region) {
    let best = null;
    for (const poly of region.rings) {
      const ring = poly[0], pts = ring.length;
      let a = 0, cx = 0, cy = 0;
      for (let i = 0, j = pts - 1; i < pts; j = i++) { const f = ring[j][0] * ring[i][1] - ring[i][0] * ring[j][1]; a += f; cx += (ring[j][0] + ring[i][0]) * f; cy += (ring[j][1] + ring[i][1]) * f; }
      if (!best || Math.abs(a) > Math.abs(best.a)) best = { a, c: a ? [cx / (3 * a), cy / (3 * a)] : ring[0], poly };
    }
    if (!best) return null;
    const [lon, lat] = best.c;
    if (U.geo.pointInRings(lat, lon, best.poly)) return { lat, lon };
    const r = best.poly[0], m = r.reduce((s, p) => [s[0] + p[0] / r.length, s[1] + p[1] / r.length], [0, 0]);
    return { lat: m[1], lon: m[0] };
  }
  async function buildBulletin() {
    const data = await Bulletin.load();
    bulGroup = L.layerGroup();
    badgeGroup = L.layerGroup();
    const border = cssVar('--text');
    for (const r of data.regions) {
      const color = (CFG.levels[r.level] || CFG.levels[0]).color;
      polys.push(L.polygon(r.rings.map((poly) => poly.map((ring) => ring.map(([lon, lat]) => [lat, lon]))), {
        fillColor: color, fillOpacity: bulletinFill(), color: border, weight: 0.7, opacity: 0.55, interactive: false, smoothFactor: 1.5,
      }).addTo(bulGroup));
      const c = r.level ? centroid(r) : null;
      if (c) L.marker(ll(c), {
        interactive: false, keyboard: false,
        icon: L.divIcon({ className: 'mk', iconSize: [0, 0], html: `<div class="mk-badge lv-${r.level}">${r.level}${Icons.subMark(r.sub)}</div>` }),
      }).addTo(badgeGroup);
    }
    const nm = (l) => Icons.levelName(l);
    U.$('#legend-bar').innerHTML = [1, 2, 3, 4, 5].map((l) => `<div class="legend-seg lv-${l}">${nm(l)}</div>`).join('');
    U.$('#legend-valid').textContent = `Gültig ab ${U.fmt.dt(data.validFrom)} bis ${U.fmt.dt(data.validTo)}`;
  }
  function syncBadges() {
    if (!bulGroup) return;
    const show = on.bulletin && map.getZoom() >= BADGE_ZOOM;
    if (show && !map.hasLayer(badgeGroup)) badgeGroup.addTo(map);
    if (!show && map.hasLayer(badgeGroup)) map.removeLayer(badgeGroup);
  }

  /* ── Marker-Ebenen (nur sichtbarer Ausschnitt) ── */
  const bounds = () => map.getBounds().pad(0.15);
  const inB = (b, p) => b.contains([p.lat, p.lon]);
  const icon = (cls, html, size = [28, 28]) => L.divIcon({ className: 'mk ' + cls, html, iconSize: size });

  const layers = {};
  const group = (id) => layers[id] || (layers[id] = L.layerGroup());

  function renderStations() {
    const g = group('stations');
    g.clearLayers();
    if (!on.stations || map.getZoom() < STATION_ZOOM) return;
    const b = bounds(), z = map.getZoom();
    (stationList).filter((s) => inB(b, s)).slice(0, MAX_MARKERS).forEach((s) => {
      const hs = s.last.HS, sc = Charts.scale('snow', hs);
      const label = z >= STATION_LABEL_ZOOM ? `<div class="mk-label">${U.esc(s.name)}<small>${U.fmt.m(s.ele)}</small></div>` : '';
      const html = `<div class="mk-station"><div class="mk-circle${hs == null ? ' none' : sc.dark ? ' dark' : ''}" style="--c:${hs == null ? CFG.scales.none : sc.color}">${hs == null ? '' : U.fmt.num(hs)}</div>${label}</div>`;
      L.marker(ll(s), { icon: icon('', html, [0, 0]), title: s.name, riseOnHover: true })
        .bindPopup(() => `<b>${U.esc(s.name)}</b><br>${U.fmt.m(s.ele)}<br>Schneehöhe ${U.fmt.num(s.last.HS)} cm · Neuschnee 24 h ${U.fmt.num(s.hn1 && s.hn1.HN)} cm<br>Lufttemperatur ${U.fmt.num(s.last.TA, 1)} °C · Wind ${U.fmt.num(Stations.windKmh(s))} km/h<br><a href="${U.esc(s.url)}" target="_blank" rel="noopener">Zur Station</a>`)
        .addTo(g);
    });
  }
  function renderWebcams() {
    const g = group('webcams'), my = ++webcamSeq;
    if (!on.webcams || map.getZoom() < CAM_ZOOM) { g.clearLayers(); return; }
    const c = map.getCenter(), km = Math.min(200, U.geo.dist({ lat: c.lat, lon: c.lng }, { lat: map.getBounds().getNorth(), lon: map.getBounds().getEast() }) / 1000);
    Webcams.near(c.lat, c.lng, { km, n: MAX_MARKERS }).then((list) => {
      if (my !== webcamSeq || !on.webcams) return;
      g.clearLayers();
      list.forEach((w) => L.marker(ll(w), { icon: icon('mk-icon', Icons.icon('camera', 16)), title: w.name })
        .bindPopup(`<b>${U.esc(w.name)}</b><br><a href="${U.esc(w.url)}" target="_blank" rel="noopener">Webcam öffnen</a>`).addTo(g));
    }).catch((e) => { if (my === webcamSeq) toast(e.message, { error: true }); });
  }
    function renderAccidents() {
    const g = group('accidents');
    g.clearLayers();
    if (!on.accidents || map.getZoom() < ACC_ZOOM) return;
    const b = bounds();
    (accList).filter((a) => inB(b, a)).slice(0, MAX_MARKERS).forEach((a) => {
      L.marker(ll(a), { icon: icon(`mk-icon danger${a.dead ? ' dead' : ''}`, Icons.icon('warning', 16)), title: 'Lawinenunfall' })
        .bindPopup(`<b>Lawinenunfall ${U.fmt.date(a.date)}</b><br>${U.esc(a.activity)}${a.ele ? ' · ' + U.fmt.m(a.ele) : ''}<br>Erfasst ${a.caught} · Verschüttet ${a.buried} · Tote ${a.dead}`).addTo(g);
    });
  }
  const refreshMarkers = () => { renderStations(); renderAccidents(); renderWebcams(); syncBadges(); };

  /* ── Ebenen ein-/ausschalten ── */
  const addTo = (l) => { if (!map.hasLayer(l)) l.addTo(map); };
  async function apply(id) {
    try {
      if (id === 'bulletin') {
        if (on.bulletin) { if (!bulGroup) await buildBulletin(); if (on.bulletin) { addTo(bulGroup); syncBadges(); } }
        else { if (bulGroup) map.removeLayer(bulGroup); syncBadges(); }
        U.$('#legend').hidden = !on.bulletin;
      } else if (id === 'stations') {
        if (on.stations && !stationList.length) stationList = await Stations.load();
        addTo(group('stations')); renderStations();
      } else if (id === 'accidents') {
        if (on.accidents && !accList.length) accList = await Accidents.load();
        addTo(group('accidents')); renderAccidents();
      } else if (id === 'webcams') { addTo(group('webcams')); renderWebcams(); }
      else if (id === 'grm') {
        if (on.grm) { grmLayer = grmLayer || GrmLayer.create({ pane: 'grm' }); addTo(grmLayer); } else if (grmLayer) map.removeLayer(grmLayer);
        syncFill();
      } else {
        const o = CFG.overlays.find((x) => x.id === id);
        if (!o) return;
        let l = tileLayers.get(id);
        if (!l) { l = tiles(o.url, { opacity: o.opacity, zIndex: 10 + CFG.overlays.indexOf(o), maxNativeZoom: 17, minZoom: o.minZoom ?? 0 }); tileLayers.set(id, l); }
        if (on[id]) addTo(l); else map.removeLayer(l);
      }
    } catch (e) {
      toast(e.message || 'Ebene konnte nicht geladen werden', { error: true });
      if (id === 'bulletin') U.$('#legend-valid').textContent = e.message || 'Bulletin nicht verfügbar';
    }
  }

  /* ── Ebenen-Card ── */
  function buildLayersCard() {
    const row = (type, name, id, checked, note) => `<label class="layers-opt"><input type="${type}" name="${type === 'radio' ? 'base' : id}" value="${id}"${checked ? ' checked' : ''}><span>${U.esc(name)}${note ? `<small>${U.esc(note)}</small>` : ''}</span></label>`;
    U.$('#layers-base').innerHTML = CFG.base.map((b) => row('radio', b.name, b.id, b.id === baseId)).join('');
    U.$('#layers-over').innerHTML = [...CFG.overlays, ...SPECIAL].map((o) => row('checkbox', o.name, o.id, on[o.id], o.note)).join('');
    U.$('#layers-base').addEventListener('change', (e) => setBase(e.target.value));
    U.$('#layers-over').addEventListener('change', (e) => { on[e.target.value] = e.target.checked; saveState(); apply(e.target.value); });
    const btn = U.$('#layers-btn'), card = U.$('#layers-card');
    const toggle = (open) => { card.hidden = !open; btn.setAttribute('aria-expanded', String(open)); };
    btn.addEventListener('click', () => toggle(card.hidden));
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !card.hidden) { toggle(false); btn.focus(); } });
    map.on('click', () => toggle(false));
  }

  /* ── Suche ── */
  function initSearch() {
    const input = U.$('#search-input'), list = U.$('#search-results'), clear = U.$('#search-clear');
    let timer = 0, seq = 0, items = [], sel = -1;
    const close = () => { list.hidden = true; sel = -1; input.removeAttribute('aria-activedescendant'); };
    const render = () => {
      list.innerHTML = items.length ? items.map((p, i) => `<li role="option" id="sr${i}" data-i="${i}"${i === sel ? ' aria-selected="true"' : ''}>${U.esc(p.label)}</li>`).join('') : '<li class="empty">Kein Ort gefunden</li>';
      list.hidden = false;
    };
    const pick = (p) => { close(); input.value = p.label; clear.hidden = false; flyTo(p.lat, p.lon, 13); U.bus.emit('point', { lat: p.lat, lon: p.lon }); };
    input.addEventListener('input', () => {
      clear.hidden = !input.value;
      clearTimeout(timer);
      if (input.value.trim().length < 2) { close(); return; }
      timer = setTimeout(async () => {
        const my = ++seq;
        try { items = await Places.search(input.value); } catch (e) { items = []; if (my === seq) { list.innerHTML = `<li class="empty">${U.esc(e.message)}</li>`; list.hidden = false; } return; }
        if (my === seq) { sel = -1; render(); }
      }, 300);
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { close(); return; }
      if (list.hidden || !items.length) return;
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length; render(); input.setAttribute('aria-activedescendant', 'sr' + sel); }
      if (e.key === 'Enter') { e.preventDefault(); pick(items[Math.max(0, sel)]); }
    });
    list.addEventListener('pointerdown', (e) => { const li = e.target.closest('li[data-i]'); if (li) { e.preventDefault(); pick(items[+li.dataset.i]); } });
    clear.addEventListener('click', () => { input.value = ''; clear.hidden = true; close(); input.focus(); });
    document.addEventListener('pointerdown', (e) => { if (!e.target.closest('.search')) close(); });
  }

  /* ── Öffentliche Funktionen ── */
  function flyTo(lat, lon, zoom) { map.flyTo([lat, lon], zoom ?? Math.max(map.getZoom(), 12), { duration: 0.8 }); }

  function locate() {
    if (!navigator.geolocation) { toast('Standort wird von diesem Gerät nicht unterstützt', { error: true }); return; }
    navigator.geolocation.getCurrentPosition((pos) => {
      const p = { lat: pos.coords.latitude, lon: pos.coords.longitude };
      marker('gps', p, '<div class="mk-gps"></div>', { size: [16, 16] });
      flyTo(p.lat, p.lon, 13);
      U.bus.emit('point', p);
    }, (err) => toast(err.code === 1 ? 'Der Zugriff auf den Standort wurde nicht erlaubt' : 'Standort ist gerade nicht verfügbar', { error: true }), { enableHighAccuracy: true, timeout: 15000 });
  }

  const lineStyle = () => ({ pane: 'routes', lineCap: 'round', lineJoin: 'round', interactive: false });
  // samples: [{lat, lon, zone?, gap?}] oder reine Punkte; byRisk färbt nach Zone (CFG.risk), sonst Primärfarbe; weight = Linienstärke (px)
  function drawRoute(id, pts, { byRisk = false, weight = 4 } = {}) {
    clear(id);
    const g = L.layerGroup().addTo(map);
    const runs = [];
    let cur = null;
    pts.forEach((p, i) => {
      if (p.gap) { cur = null; return; }
      const z = byRisk ? (p.zone ?? -1) : 0;
      if (!cur || (byRisk && cur.z !== z)) { cur = { z, pts: cur && i ? [ll(pts[i - 1])] : [] }; runs.push(cur); }
      cur.pts.push(ll(p));
    });
    const white = cssVar('--surface'), primary = cssVar('--primary');
    const all = runs.filter((r) => r.pts.length > 1);
    all.forEach((r) => L.polyline(r.pts, { ...lineStyle(), color: white, weight: weight + 4, opacity: 1 }).addTo(g));
    all.forEach((r) => L.polyline(r.pts, { ...lineStyle(), color: byRisk && r.z >= 0 ? CFG.risk[r.z].color : byRisk ? cssVar('--nolevel') : primary, weight, opacity: 1 }).addTo(g));
    routes.set(id, g);
  }
  function clear(id) {
    const g = routes.get(id);
    if (g) { map.removeLayer(g); routes.delete(id); }
    const m = markers.get(id);
    if (m) { map.removeLayer(m); markers.delete(id); }
  }
  function fit(pts, opts = {}) {
    if (!pts || !pts.length) return;
    const b = U.geo.bbox(pts);
    map.fitBounds([[b.s, b.w], [b.n, b.e]], { padding: [40, 40], maxZoom: 15, ...opts });
  }
  // Eigenes HTML an einem Punkt (Mittelpunkt des Symbols = Punkt). draggable: ziehbar, onMove({lat, lon}, final) während (false) und nach dem Ziehen (true)
  function marker(id, p, html, { size = [28, 28], onClick, draggable = false, onMove } = {}) {
    clear(id);
    const m = L.marker(ll(p), { icon: L.divIcon({ className: 'mk', html, iconSize: size }), keyboard: !!onClick, interactive: !!onClick || draggable, draggable, zIndexOffset: 500 }).addTo(map);
    if (onClick) m.on('click', onClick);
    if (draggable && onMove) {
      const at = () => { const c = m.getLatLng(); return { lat: c.lat, lon: c.lng }; };
      m.on('drag', () => onMove(at(), false));
      m.on('dragend', () => onMove(at(), true));
    }
    markers.set(id, m);
    return m;
  }
  const onClick = (fn) => { clickFns.push(fn); };
  // Klick-Modus: fn({lat, lon}) erhält alle Kartenklicks; es gibt dann weder Pin noch 'point'. null beendet den Modus.
  function setClickMode(fn) {
    clickMode = fn || null;
    map.getContainer().classList.toggle('click-mode', !!clickMode);
  }

  function init(el) {
    loadState();
    const saved = U.store.get('view', null);
    const v = saved && Number.isFinite(saved.lat) ? saved : CFG.view;
    map = L.map(el, { zoomControl: false, attributionControl: false, center: [v.lat, v.lon], zoom: v.zoom, minZoom: 6, maxZoom: 18, zoomSnap: 1, worldCopyJump: false });
    map.createPane('grm').style.zIndex = 410;   // über den Bulletin-Flächen (400), unter Linien und Markern
    map.createPane('routes');
    L.control.attribution({ position: 'bottomleft', prefix: false }).addAttribution(CFG.attribution).addTo(map);
    setBase(baseId);
    buildLayersCard();
    initSearch();
    U.$('#btn-zoom-in').addEventListener('click', () => map.zoomIn());
    U.$('#btn-zoom-out').addEventListener('click', () => map.zoomOut());
    U.$('#btn-locate').addEventListener('click', locate);
    const lg = U.$('#legend');
    U.$('#legend-toggle').addEventListener('click', () => { const c = lg.classList.toggle('collapsed'); U.$('#legend-toggle').setAttribute('aria-expanded', String(!c)); });
    if (window.matchMedia('(max-width: 760px)').matches) { lg.classList.add('collapsed'); U.$('#legend-toggle').setAttribute('aria-expanded', 'false'); }

    map.on('click', (e) => {
      const p = { lat: e.latlng.lat, lon: e.latlng.lng };
      if (clickMode) { clickMode(p); return; }
      marker('sel', p, '<div class="mk-pin"></div>', { size: [20, 20] });
      clickFns.forEach((fn) => fn(p));
      U.bus.emit('point', p);
    });
    map.on('moveend', () => { const c = map.getCenter(); U.store.set('view', { lat: c.lat, lon: c.lng, zoom: map.getZoom() }); refreshMarkers(); });
    map.on('zoomend', () => { syncBadges(); syncFill(); });
    U.bus.on('point', (p) => { if (!markers.has('sel') || markers.get('sel').getLatLng().distanceTo([p.lat, p.lon]) > 1) marker('sel', p, '<div class="mk-pin"></div>', { size: [20, 20] }); });

    Object.keys(on).forEach((id) => { if (on[id]) apply(id); });
    return map;
  }

  return { init, flyTo, locate, drawRoute, clear, fit, marker, onClick, setClickMode, toast, get map() { return map; } };
})();

/* ── 54-ui-blocks.js ── */
/* ══════════════════════════ 54 · Bausteine für Panels (HTML-Strings) ══════════════════════════
   Gemeinsame Kleinteile aller Panels: Karte und Abschnitt, aufklappbare Karte, Aufzählung, Hinweisfeld,
   Lade-/Leer-/Fehlerzustand (fill), Kennzahlen, Messstationen, Webcams, Bulletin-Text. Texte werden hier escaped,
   `html`-Parameter nicht. */
const Blocks = (() => {
  const esc = U.esc;

  /* ── Rahmen ── */
  const card = (html, cls = '') => `<div class="card ${cls}">${html}</div>`;
  const section = (title, inner) => `<h3 class="section-title">${esc(title)}</h3>${inner}`;

  // Aufzählung; title optional (kleine Überschrift)
  const bullets = (items, { title = '', cls = '' } = {}) =>
    `<div class="prose ${cls}">${title ? `<h4>${esc(title)}</h4>` : ''}<ul>${items.map((i) => `<li>${esc(i)}</li>`).join('')}</ul></div>`;

  // Aufklappbare Karte (details/summary). sub = Zusatzzeile, aux = HTML rechts neben dem Titel (z. B. Badge)
  const fold = (title, inner, { open = false, sub = '', aux = '' } = {}) =>
    `<details class="card fold"${open ? ' open' : ''}><summary><span class="grow"><span class="fold-title">${esc(title)}</span>${sub ? `<span class="fold-sub">${esc(sub)}</span>` : ''}</span>${aux}<span class="ic">${Icons.icon('chevron')}</span></summary><div class="fold-body">${inner}</div></details>`;

  // Hinweisfeld: kind = '' | 'info' | 'warn' | 'err'
  const callout = (kind, title, html, icon = kind === 'info' ? 'info' : 'warning') =>
    `<div class="callout ${kind}" role="${kind === 'err' ? 'alert' : 'note'}"><span class="ic">${Icons.icon(icon)}</span><div class="grow">${title ? `<div class="callout-title">${esc(title)}</div>` : ''}${html}</div></div>`;

  // Kennzahl: Beschriftung (escaped) und Wert (html bzw. bei meta escaped)
  const stat = (label, valueHtml) => `<div class="meta-item"><div class="l">${esc(label)}</div><div class="v">${valueHtml}</div></div>`;
  const meta = (label, value) => stat(label, esc(value));

  /* ── Zustände ── */
  const skel = (n = 3) => `<div class="stack-sm" aria-busy="true" aria-label="Wird geladen">${Array.from({ length: n }, (_, i) => `<div class="skel" style="height:${i ? 16 : 24}px;width:${i === n - 1 ? 60 : 100}%"></div>`).join('')}</div>`;
  // Zustandsfeld mit Icon, optionalem Titel und Zusatz-HTML (z. B. Knopf)
  const state = (icon, title, text, extra = '', err = false) =>
    `<div class="state${err ? ' err' : ''}"><span class="ic">${Icons.icon(icon)}</span>${title ? `<div class="state-title">${esc(title)}</div>` : ''}<div>${esc(text)}</div>${extra}</div>`;
  const empty = (msg) => state('info', '', msg);
  const retryBtn = '<button class="btn btn-outlined btn-sm" type="button" data-act="retry">Erneut versuchen</button>';
  const failure = (msg, retry = true) => state('warning', 'Nicht verfügbar', msg, retry ? retryBtn : '', true);
  // Fehlertext einer Ausnahme (Wetterdienst-Limit verständlich)
  const errText = (e) => (/429/.test(e && e.message) ? 'Der Wetterdienst ist gerade überlastet (zu viele Anfragen). Bitte in einer Minute noch einmal versuchen.' : (e && e.message) || 'Unbekannter Fehler');
  // «Erneut versuchen» in box mit fn verdrahten
  const onRetry = (box, fn) => { const b = U.$('[data-act="retry"]', box); if (b) b.addEventListener('click', fn); };

  // Abschnitt füllen: Ladezustand → Inhalt (run() → html) oder Fehler mit «Erneut versuchen».
  // isCurrent() → false: Ergebnis veraltet, nichts mehr schreiben.
  async function fill(box, title, run, isCurrent = () => true) {
    box.innerHTML = section(title, card(skel()));
    try {
      const html = await run();
      if (isCurrent()) box.innerHTML = section(title, card(html));
    } catch (e) {
      if (!isCurrent()) return;
      box.innerHTML = section(title, card(failure(errText(e))));
      onRetry(box, () => fill(box, title, run, isCurrent));
    }
  }

  /* ── Messwerte, Stationen, Webcams ── */
  // Farbpunkt der Messwert-Skala (Charts.scale); name: snow newSnow wind temp
  const dot = (name, v) => `<span class="dot" style="--c:${Charts.scale(name, v).color}"></span>`;
  const dotted = (name, v, text) => (v == null ? '–' : dot(name, v) + text);

  // Station als Karte mit vier Werten und Schneehöhen-Verlauf (Lage)
  function stationCard(s) {
    const hn = s.hn1 && s.hn1.HN, wind = Stations.windKmh(s);
    const n = s.ser && s.ser.dt ? Math.round(24 * 3600e3 / s.ser.dt) : 0;
    const val = (l, name, v, text) => `<div class="st-val"><div class="l">${l}</div><div class="v">${dotted(name, v, text)}</div></div>`;
    return `<div class="st">
      <div class="st-head"><a class="li-title" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a><span class="muted t-xs">${U.fmt.m(s.ele)} · ${U.fmt.km(s.dist)}</span></div>
      <div class="st-grid">
        ${val('Schneehöhe', 'snow', s.last.HS, `${U.fmt.num(s.last.HS)} cm`)}
        ${val('Neuschnee 24 h', 'newSnow', hn, `${U.fmt.num(hn)} cm`)}
        ${val('Temperatur', 'temp', s.last.TA, `${U.fmt.num(s.last.TA, 1)} °C`)}
        ${val('Wind', 'wind', wind, `${U.fmt.num(wind)} km/h`)}
      </div>
      <div class="st-foot"><span class="muted t-xs">${s.last.t ? 'Messung ' + U.fmt.ago(s.last.t) : 'Keine aktuelle Messung'}</span>${n && s.ser.HS ? `<span class="row" title="Schneehöhe der letzten 24 Stunden"><span class="muted t-xs">HS 24 h</span>${Charts.spark(s.ser.HS.slice(-n), { w: 88, h: 24 })}</span>` : ''}</div>
    </div>`;
  }
  // Stationen als Tabelle (Planen)
  const stationTable = (list) => `<table class="tbl"><thead><tr><th>Station</th><th class="num">Schnee</th><th class="num">Temp.</th><th class="num">Wind</th></tr></thead><tbody>${list.map((s) => {
    const wind = Stations.windKmh(s);
    return `<tr><td><a class="tbl-link" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a><div class="muted t-xs">${U.fmt.m(s.ele)} · ${U.fmt.km(s.dist)}</div></td>
        <td class="num">${dotted('snow', s.last.HS, U.fmt.num(s.last.HS) + ' cm')}</td><td class="num">${dotted('temp', s.last.TA, U.fmt.num(s.last.TA, 1) + ' °C')}</td><td class="num">${dotted('wind', wind, U.fmt.num(wind) + ' km/h')}</td></tr>`;
  }).join('')}</tbody></table>`;

  // Webcam-Liste; distLabel: «entfernt», «vom Gipfel»; leer → Hinweis emptyMsg
  const webcams = (list, distLabel, emptyMsg) => (list.length
    ? `<ul class="list">${list.map((c) => `<li><span class="ic">${Icons.icon('camera')}</span><div class="li-main"><a class="li-title" href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.name)}</a><div class="li-sub">${U.fmt.km(c.dist)} ${distLabel}</div></div></li>`).join('')}</ul>`
    : empty(emptyMsg));

  /* ── Bulletin-Text ── */
  // Text → nur p, ul, li, br; Überschriften werden h4; reiner Text wird in Absätze geteilt
  function sanitize(src) {
    if (!src) return '';
    if (!/<[a-z][\s\S]*>/i.test(src)) return src.split(/\n+/).map((t) => t.trim()).filter(Boolean).map((t) => `<p>${esc(t)}</p>`).join('');
    const walk = (node) => {
      let out = '';
      for (const n of node.childNodes) {
        if (n.nodeType === 3) { out += esc(n.textContent); continue; }
        if (n.nodeType !== 1 || /^(SCRIPT|STYLE)$/.test(n.tagName)) continue;
        const t = n.tagName, inner = walk(n);
        if (t === 'BR') out += '<br>';
        else if (/^H[1-3]$/.test(t)) out += `<h4>${inner}</h4>`;
        else if (t === 'P' || t === 'UL' || t === 'LI') out += `<${t.toLowerCase()}>${inner}</${t.toLowerCase()}>`;
        else out += inner;
      }
      return out;
    };
    return walk(new DOMParser().parseFromString(src, 'text/html').body);
  }

  return { card, section, bullets, fold, callout, stat, meta, skel, state, empty, retryBtn, failure, errText, onRetry, fill, dot, dotted, stationCard, stationTable, webcams, sanitize };
})();

/* ── 60-panel-lage.js ── */
/* ══════════════════════════ 60 · Panel «Lage» (Referenz für weitere Panels) ══════════════════════════
   Gewählter Punkt → Bulletin-Region, Gefahrenstufe, Lawinenprobleme, Texte, Messwerte, Wetter, Webcams, Unfälle.
   Gerüst für Panels: mount(el) einmal, show() bei jedem Aktivieren; gemeinsame Bausteine in Blocks (card, section, fill, …). */
const PanelLage = (() => {
  const { card, section, skel, empty, failure, meta, fill } = Blocks;
  const NEAR_KM = 25, STEP_H = 6, SPAN_H = 36;
  let root = null, point = null, seq = 0, dirty = true, visible = false;

  /* ── Bulletin ── */
  // Probleme mit gleicher Stufe, Expositionen und Höhenlage teilen sich eine Karte (wie im SLF-Bulletin)
  function groupProblems(problems) {
    const groups = new Map();
    for (const p of problems.filter((x) => x.type)) {
      const k = [p.level, p.sub, p.aspects.join(','), p.elevMin, p.elevMax].join('|');
      (groups.get(k) || groups.set(k, []).get(k)).push(p);
    }
    return [...groups.values()];
  }
  function problemCard(ps) {
    const p = ps[0], lv = p.level || 0, where = p.aspects.length || p.elevMin != null || p.elevMax != null;
    const texts = [...new Set(ps.map((x) => x.comment || x.coreText).filter(Boolean))];
    const icons = ps.map((x) => Icons.problem(x.type)).join('');
    return `<div class="problem-card lv-${lv}">
      <div class="pc-head">${U.esc(lv ? Icons.levelLabel(p.level, p.sub) : p.label)}</div>
      ${where ? `<div class="pc-where">${Icons.rose(p.aspects)}${Icons.elev(p.elevMin, p.elevMax)}<span class="val">${U.esc(U.fmt.elevRange(p.elevMin, p.elevMax))}</span></div>` : ''}
      <div class="pc-body"><div class="pc-icons">${icons}</div><div class="grow"><div class="pc-name">${U.esc(ps.map((x) => x.label).join(', '))}</div>${texts.map((t) => `<div class="pc-text prose">${Blocks.sanitize(t)}</div>`).join('')}</div></div>
    </div>`;
  }
  function bulletinHtml(b, region) {
    if (!region) return card(empty('Für diesen Ort gibt es kein Lawinenbulletin. Der Punkt liegt ausserhalb der Bulletin-Regionen.'));
    const lv = region.level;
    let h = `<div class="danger-card lv-${lv}"><div class="danger-head">${Icons.danger(lv, region.sub)}<span class="danger-word">${U.esc(Icons.levelName(lv))}</span></div></div>`;
    h += groupProblems(region.problems).map(problemCard).join('');
    const t = region.texts;
    const text = (title, html) => (html ? section(title, card(`<div class="prose">${html}</div>`)) : '');
    const weather = [t.weather && Blocks.sanitize(t.weather), t.review && `<h4>Rückblick</h4>${Blocks.sanitize(t.review)}`].filter(Boolean).join('');
    return h + text('Schneedecke', Blocks.sanitize(t.snowpack)) + text('Tendenz', Blocks.sanitize(t.tendency)) + text('Wetter', weather);
  }
  // Gefahr am Punkt (Kernzone des Problems berücksichtigt)
  function pointLevel(region, terrain) {
    if (!region || !region.level || !terrain || terrain.elev == null) return '';
    const lv = Risk.levelAt(region, terrain.aspect, terrain.elev);
    if (lv.g == null) return '';
    const { level, sub } = Risk.split(lv.g);
    return `Gefahr am Punkt: <b>${U.esc(Icons.levelLabel(level, sub))}</b>${lv.inCore ? '' : ' (ausserhalb der Kernzone)'}`;
  }

  /* ── Messwerte in der Nähe ── */
  async function stationsHtml(p) {
    await Stations.load();
    const list = Stations.near(p.lat, p.lon, { n: 5, km: NEAR_KM });
    return list.length ? list.map(Blocks.stationCard).join('') : empty(`Keine Messstation im Umkreis von ${NEAR_KM} km.`);
  }

  /* ── Wetter am Punkt: nächste 36 h in 6-h-Blöcken ── */
  async function weatherHtml(p, ele) {
    const w = await Weather.forecast(p.lat, p.lon, ele);
    const h0 = Math.floor(Date.now() / 3600e3) * 3600e3, rows = [];
    for (let t = h0; t < h0 + SPAN_H * 3600e3; t += STEP_H * 3600e3) {
      const part = w.hours.filter((x) => x.t >= t && x.t < t + STEP_H * 3600e3);
      if (!part.length) continue;
      const avg = (k) => { const v = part.map((x) => x[k]).filter((x) => x != null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
      const max = (k) => { const v = part.map((x) => x[k]).filter((x) => x != null); return v.length ? Math.max(...v) : null; };
      rows.push({ t, temp: avg('temp'), fzl: avg('fzl'), wind: avg('wind'), gust: max('gust'), snow: part.reduce((a, x) => a + (x.snow || 0), 0) });
    }
    if (!rows.length) return empty('Keine Prognosedaten für diesen Zeitraum.');
    let prevDay = '';
    const body = rows.map((r) => {
      const day = U.fmt.date(r.t), first = day !== prevDay;
      prevDay = day;
      return `<tr><td><b>${U.fmt.time(r.t)}</b>${first ? `<div class="muted t-xs">${U.esc(day)}</div>` : ''}</td>
        <td class="num">${Blocks.dot('temp', r.temp)}${U.fmt.num(r.temp, 1)} °C</td>
        <td class="num">${U.fmt.m(r.fzl)}</td>
        <td class="num">${Blocks.dot('wind', r.wind)}${U.fmt.num(r.wind)}</td>
        <td class="num">${U.fmt.num(r.gust)}</td>
        <td class="num">${r.snow >= 0.05 ? U.fmt.num(r.snow, 1) + ' cm' : '–'}</td></tr>`;
    }).join('');
    return `<div class="card-sub">Prognose für ${U.fmt.m(ele)} · ${U.esc(Weather.modelName(w.model))}, Stundenwerte über je ${STEP_H} h gemittelt</div>
      <table class="tbl tbl-spaced"><thead><tr><th>Zeit</th><th class="num">Temp.</th><th class="num">0°-Grenze</th><th class="num">Wind</th><th class="num">Böen</th><th class="num">Schnee</th></tr></thead><tbody>${body}</tbody></table>
      <div class="muted t-xs tbl-spaced">Wind und Böen in km/h, Neuschnee je Block.</div>`;
  }

  async function webcamsHtml(p) {
    return Blocks.webcams(await Webcams.near(p.lat, p.lon, { km: NEAR_KM, n: 6 }), 'entfernt', `Keine Webcam im Umkreis von ${NEAR_KM} km.`);
  }

  async function accidentsHtml(p) {
    const list = (await Accidents.load()).map((a) => ({ ...a, dist: U.geo.dist(p, a) })).filter((a) => a.dist <= NEAR_KM * 1000).sort((a, b) => b.date - a.date).slice(0, 6);
    return list.length
      ? `<ul class="list">${list.map((a) => `<li><span class="ic">${Icons.icon('warning')}</span><div class="li-main"><div class="li-title">${U.fmt.date(a.date)}${a.activity ? ' · ' + U.esc(a.activity) : ''}</div><div class="li-sub">${a.caught} erfasst · ${a.buried} verschüttet · ${a.dead} tot · ${U.fmt.km(a.dist)} entfernt${a.ele ? ' · ' + U.fmt.m(a.ele) : ''}</div></div></li>`).join('')}</ul>`
      : empty(`Keine gemeldeten Unfälle der Saison${Accidents.season ? ' ' + Accidents.season : ''} im Umkreis von ${NEAR_KM} km.`);
  }

  /* ── Aufbau ── */
  async function render() {
    if (!root) return;
    dirty = false;
    const my = ++seq, p = point;
    root.innerHTML = `<div class="stack-sm"><h2 class="panel-title" data-s="title">Wird geladen …</h2><div class="coord" data-s="coord">${U.fmt.num(p.lat, 3)}° N, ${U.fmt.num(p.lon, 3)}° O</div><div class="coord" data-s="here"></div></div>
      <div class="meta" data-s="meta"></div>
      <div class="stack" data-s="bulletin">${skel(4)}</div>
      <div data-s="stations"></div><div data-s="weather"></div><div data-s="webcams"></div><div data-s="accidents"></div>`;
    const q = (k) => U.$(`[data-s="${k}"]`, root);

    // Gelände (Höhe für das Wetter) und Bulletin parallel
    const terrainP = Terrain.at(p.lat, p.lon).catch(() => null);
    const bulP = Bulletin.load().then((b) => ({ b, region: Bulletin.regionAt(p.lat, p.lon) }));
    bulP.then(({ b, region }) => {
      if (my !== seq) return;
      q('title').textContent = region ? region.name : 'Ausserhalb des Bulletins';
      q('meta').innerHTML = meta('Gültig ab', U.fmt.dt(b.validFrom)) + meta('Gültig bis', U.fmt.dt(b.validTo)) + meta('Nächstes Update', U.fmt.dt(b.nextUpdate));
      q('bulletin').innerHTML = bulletinHtml(b, region);
    }).catch((e) => {
      if (my !== seq) return;
      q('title').textContent = 'Lawinenbulletin';
      q('bulletin').innerHTML = card(failure(e.message));
      Blocks.onRetry(q('bulletin'), render);
    });
    Promise.all([terrainP, bulP.catch(() => null)]).then(([t, r]) => {
      if (my !== seq) return;
      const bits = [];
      if (t && t.elev != null) { bits.push(U.fmt.m(t.elev)); if (t.slope != null) bits.push(`Hang ${U.fmt.deg(t.slope)}`); if (t.aspect != null) bits.push(U.fmt.aspect(t.aspect)); }
      q('coord').textContent = `${U.fmt.num(p.lat, 3)}° N, ${U.fmt.num(p.lon, 3)}° O` + (bits.length ? ' · ' + bits.join(' · ') : '');
      q('here').innerHTML = r ? pointLevel(r.region, t) : '';
    });
    const current = () => my === seq;
    fill(q('stations'), 'Messwerte in der Nähe', () => stationsHtml(p), current);
    fill(q('webcams'), 'Webcams', () => webcamsHtml(p), current);
    fill(q('accidents'), 'Lawinenunfälle der Saison in der Nähe', () => accidentsHtml(p), current);
    fill(q('weather'), 'Wetter am Punkt', async () => { const t = await terrainP; return weatherHtml(p, t && t.elev != null ? t.elev : NaN); }, current);
  }

  function setPoint(p) {
    point = { lat: p.lat, lon: p.lon };
    U.store.set('point', point);
    dirty = true;
    if (visible) render();
  }

  function mount(el) {
    root = el;
    const saved = U.store.get('point', null);
    if (saved && Number.isFinite(saved.lat)) point = saved;
    else { const c = MapView.map.getCenter(); point = { lat: c.lat, lon: c.lng }; }
    U.bus.on('point', setPoint);
  }
  function show() {
    visible = true;
    if (dirty && point) render();
  }
  const hide = () => { visible = false; };

  return { mount, show, hide };
})();

/* ── 61-panel-touren.js ── */
/* ══════════════════════════ 61 · Panel «Touren» (Tourenauswahl mit Routenrisiko) ══════════════════════════
   SAC-Skirouten im Kartenausschnitt → je Route Tour.analyze (max. 3 gleichzeitig, Ergebnis je Route-ID gemerkt)
   → Liste (Risiko, Ziel, Schwierigkeit, Aufstieg, Zeit, Schlüsselstellen) und Linien auf der Karte.
   Karte: eine Farbe je Route (Routenrisiko, CFG.risk); noch nicht ausgewertet = grau. Das passt zur Liste, die
   dieselbe Zahl zeigt; Abschnittsfarben zeigt das Panel «Planen» für die gewählte Route. */
const PanelTouren = (() => {
  const MIN_ZOOM = 11, PARALLEL = 3, MOVE_MS = 500, RENDER_MS = 300;
  const HIGHLIGHT = 'tour-hl', layerId = (id) => 'tour:' + id;
  const SORTS = [{ id: 'risk', label: 'Risiko' }, { id: 'hm', label: 'Höhenmeter' }, { id: 'name', label: 'Name' }];
  // Risiko und Aufstieg: ein Chip, ein zweiter Klick hebt ihn auf («all» = kein Filter)
  const RISKS = [{ id: 'all', max: 2 }, { id: 'green', label: 'Nur grün', max: 0 }, { id: 'orange', label: 'Bis orange', max: 1 }];
  const DIFFS = ['L', 'WS', 'ZS', 'S+'];
  const ASCENTS = [
    { id: 'all' },
    { id: 'low', label: '≤ 800', test: (h) => h <= 800 },
    { id: 'mid', label: '800–1200', test: (h) => h > 800 && h <= 1200 },
    { id: 'high', label: '> 1200', test: (h) => h > 1200 },
  ];
  const DEFAULTS = { sort: 'risk', risk: 'all', diff: [], asc: 'all' };

  let root = null, visible = false, loadSeq = 0, moveTimer = 0, renderTimer = 0;
  let routes = [], status = 'idle', errorMsg = '', hoverId = null, selectedId = null;
  const results = new Map();    // Route-ID → {a: Tour.analyze-Ergebnis} | {error}
  const inflight = new Set();
  const drawn = new Set();      // IDs der gezeichneten Linien
  let queue = [];
  let prefs = { ...DEFAULTS, ...(U.store.get('touren', null) || {}) };
  if (!Array.isArray(prefs.diff)) prefs.diff = [];

  const q = (k) => U.$(`[data-s="${k}"]`, root);
  const savePrefs = () => U.store.set('touren', prefs);

  /* ── Eigenschaften einer Route ── */
  // SAC-Schwierigkeit → Gruppe (WS+ → WS, ZS- → ZS, S, SS, AS, EX → S+)
  function diffGroup(diff) {
    const m = /^\s*(L|WS|ZS|SS|AS|EX|S)/i.exec(diff || '');
    if (!m) return null;
    const k = m[1].toUpperCase();
    return k === 'L' || k === 'WS' || k === 'ZS' ? k : 'S+';
  }
  const result = (r) => results.get(r.id);
  const analysis = (r) => (result(r) && result(r).a) || null;
  // SAC-Angaben, sonst Wert aus der Auswertung
  const ascentHm = (r) => r.ascentHm ?? (analysis(r) ? Math.round(analysis(r).time.upM) : null);
  const ascentMin = (r) => r.ascentMin ?? (analysis(r) ? analysis(r).time.upMin : null);
  const routeCls = (r) => (analysis(r) ? analysis(r).assess.cls : null);
  // kritischste Schlüsselstelle: höchster Risikowert, dann steilste
  const criticalCrux = (a) => a.assess.cruxes.reduce((b, c) => (!b || (c.r ?? -1) > (b.r ?? -1) || ((c.r ?? -1) === (b.r ?? -1) && c.maxSteep > b.maxSteep) ? c : b), null);

  /* ── Sichtbare Liste: Filter und Sortierung ── */
  function visibleRoutes() {
    const risk = RISKS.find((x) => x.id === prefs.risk), asc = ASCENTS.find((x) => x.id === prefs.asc);
    const list = routes.filter((r) => {
      if (prefs.risk !== 'all') { const c = routeCls(r); if (c == null || c > risk.max) return false; }
      if (prefs.diff.length && !prefs.diff.includes(diffGroup(r.diff))) return false;
      if (asc.test) { const h = ascentHm(r); if (h == null || !asc.test(h)) return false; }
      return true;
    });
    const num = (v) => (v == null ? Infinity : v); // unbekannt ans Ende
    const byName = (a, b) => a.target.localeCompare(b.target, 'de') || a.name.localeCompare(b.name, 'de');
    const key = { risk: (r) => { const a = analysis(r); return num(a ? a.assess.r : null); }, hm: (r) => num(ascentHm(r)) };
    return list.sort(prefs.sort === 'name' ? byName : (a, b) => key[prefs.sort](a) - key[prefs.sort](b) || byName(a, b));
  }
  const filtered = () => prefs.risk !== 'all' || prefs.diff.length > 0 || prefs.asc !== 'all';

  /* ── Liste ── */
  function itemHtml(r) {
    const res = result(r), a = res && res.a;
    const risk = a ? Icons.risk(a.assess.r, 32) : res ? Icons.risk(null, 32) : '<span class="skel tl-risk"></span>';
    const hm = ascentHm(r), min = ascentMin(r), bits = [];
    if (r.diff) bits.push(`<span class="badge info" title="SAC-Schwierigkeit">${U.esc(r.diff)}</span>`);
    if (hm != null) bits.push(`<span title="Aufstieg">${Icons.icon('arrow-up')}${U.fmt.m(hm)}</span>`);
    if (min != null) bits.push(`<span title="Aufstiegszeit">${Icons.icon('clock')}${U.fmt.dur(min)}</span>`);
    if (a) {
      const cx = a.assess.cruxes;
      for (const cls of [1, 2, 3]) {
        const n = cx.filter((c) => c.cls === cls).length;
        if (n) bits.push(`<span class="tl-crux" title="${n} Schlüsselstelle${n > 1 ? 'n' : ''} der Klasse ${cls}">${Icons.crux(cls)}<b>${n}</b></span>`);
      }
      const c = criticalCrux(a);
      if (c) bits.push(`<span title="Steilste Stelle der kritischsten Schlüsselstelle">${U.fmt.deg(c.maxSteep)} ${U.fmt.aspect(c.aspect)}</span>`);
      else bits.push('<span>Keine Schlüsselstellen</span>');
    } else if (res) bits.push('<span>Auswertung nicht möglich</span>');
    else bits.push('<span class="skel tl-skel"></span>');
    return `<li><button class="pick-row" type="button" data-id="${U.esc(r.id)}"${r.id === selectedId ? ' aria-current="true"' : ''}>
      <span class="tl-risk-col">${risk}</span>
      <span class="grow">
        <span class="pick-title">${U.esc(r.target)}${r.targetAlt ? ` <span class="tl-alt">${U.fmt.m(r.targetAlt)}</span>` : ''}</span>
        ${r.name && r.name !== r.target ? `<span class="pick-sub">${U.esc(r.name)}</span>` : ''}
        <span class="tl-meta">${bits.join('')}</span>
      </span></button></li>`;
  }

  function listHtml() {
    if (status === 'zoom') return `<div class="card">${Blocks.state('info', 'Näher zoomen', `Skirouten werden ab Zoomstufe ${MIN_ZOOM} geladen.`, '<button class="btn btn-secondary btn-sm" type="button" data-zoom>Hineinzoomen</button>')}</div>`;
    if (status === 'error') return `<div class="card">${Blocks.state('warning', 'Routen nicht verfügbar', errorMsg, '<button class="btn btn-outlined btn-sm" type="button" data-reload>Erneut versuchen</button>')}</div>`;
    if (status === 'loading' && !routes.length) return `<div class="card stack-sm" aria-busy="true" aria-label="Wird geladen">${[0, 1, 2, 3].map(() => '<div class="skel" style="height:56px"></div>').join('')}</div>`;
