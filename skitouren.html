    if (!routes.length) return `<div class="card">${Blocks.state('info', 'Keine Skirouten', 'In diesem Kartenausschnitt sind keine SAC-Skirouten verzeichnet.')}</div>`;
    const list = visibleRoutes();
    if (!list.length) return `<div class="card">${Blocks.state('info', 'Keine passende Route', 'Mit diesen Filtern bleibt keine Route übrig.', '<button class="btn btn-outlined btn-sm" type="button" data-reset>Filter zurücksetzen</button>')}</div>`;
    return `<div class="card flat-pad pick-card"><ul class="pick-list" data-list>${list.map(itemHtml).join('')}</ul></div>`;
  }

  function statusHtml() {
    if (status === 'zoom' || status === 'idle') return '';
    if (status === 'loading' && !routes.length) return 'Routen werden geladen …';
    if (status === 'error' || !routes.length) return '';
    const total = routes.length, done = routes.filter((r) => analysis(r)).length, failed = routes.filter((r) => result(r) && result(r).error).length;
    const open = total - done - failed;
    let t = `${U.fmt.num(total)} Routen im Ausschnitt`;
    if (filtered()) t += ` · ${U.fmt.num(visibleRoutes().length)} angezeigt <button class="btn btn-link" type="button" data-reset>Filter zurücksetzen</button>`;
    const p = open > 0 ? `${U.fmt.num(done)} von ${U.fmt.num(total)} ausgewertet` : failed ? `${U.fmt.num(done)} von ${U.fmt.num(total)} ausgewertet` : 'Alle Routen ausgewertet';
    return `${t}<br>${p}${failed ? ` · ${failed} nicht auswertbar <button class="btn btn-link" type="button" data-retry>Erneut versuchen</button>` : ''}`;
  }

  // Liste neu aufbauen (Fokus auf den Eintrag bleibt erhalten)
  function render() {
    clearTimeout(renderTimer);
    renderTimer = 0;
    if (!root) return;
    const focused = document.activeElement && document.activeElement.closest ? document.activeElement.closest('[data-id]') : null;
    const fid = focused && root.contains(focused) ? focused.dataset.id : null;
    q('status').innerHTML = statusHtml();
    q('list').innerHTML = listHtml();
    if (fid) { const el = U.$$('[data-id]', root).find((x) => x.dataset.id === fid); if (el) el.focus({ preventScroll: true }); }
  }
  const renderSoon = () => { if (!renderTimer) renderTimer = setTimeout(render, RENDER_MS); };

  /* ── Filterleiste (einmal aufgebaut, nur Zustände werden nachgeführt) ── */
  const chip = (group, id, label, on) => `<button class="chip" type="button" data-f="${group}" data-v="${id}" aria-pressed="${on}">${U.esc(label)}</button>`;
  function filtersHtml() {
    const row = (id, label, chips) => `<div class="tl-row"><span class="field-label" id="tl-l-${id}">${label}</span>${chips}</div>`;
    const chips = (id, group, items, on) => `<div class="row-wrap" role="group" aria-labelledby="tl-l-${id}">${items.map((x) => chip(group, x.id, x.label, on(x.id))).join('')}</div>`;
    return row('sort', 'Sortierung', `<div class="seg" role="group" aria-labelledby="tl-l-sort">${SORTS.map((x) => `<button type="button" data-f="sort" data-v="${x.id}" aria-pressed="${prefs.sort === x.id}">${x.label}</button>`).join('')}</div>`)
      + row('risk', 'Risiko', chips('risk', 'risk', RISKS.filter((x) => x.label), (v) => prefs.risk === v))
      + row('diff', 'Schwierigkeit', chips('diff', 'diff', DIFFS.map((d) => ({ id: d, label: d })), (v) => prefs.diff.includes(v)))
      + row('asc', 'Aufstieg (Hm)', chips('asc', 'asc', ASCENTS.filter((x) => x.label), (v) => prefs.asc === v))
      + `<div class="ch-legend">${Charts.riskLegend()}<span><i style="--c:var(--nolevel)"></i>noch nicht ausgewertet</span></div>`;
  }
  function syncFilters() {
    U.$$('[data-f]', q('filters')).forEach((b) => {
      const g = b.dataset.f, v = b.dataset.v;
      b.setAttribute('aria-pressed', String(g === 'diff' ? prefs.diff.includes(v) : prefs[g] === v));
    });
  }
  function onFilter(e) {
    const b = e.target.closest('[data-f]');
    if (!b) return;
    const g = b.dataset.f, v = b.dataset.v;
    if (g === 'diff') prefs.diff = prefs.diff.includes(v) ? prefs.diff.filter((x) => x !== v) : [...prefs.diff, v];
    else prefs[g] = prefs[g] === v ? 'all' : v;
    savePrefs(); syncFilters(); render();
  }

  /* ── Karte ── */
  // Linie einer Route: ausgewertet mit Lücken und einer Zone für die ganze Route, sonst grau
  function linePoints(r) {
    const a = analysis(r), zone = a ? a.assess.cls : undefined;
    return a ? a.samples.map((s) => ({ lat: s.lat, lon: s.lon, gap: s.gap, zone })) : r.line;
  }
  function drawRoute(r) {
    if (!visible) return;
    MapView.drawRoute(layerId(r.id), linePoints(r), { byRisk: true });
    drawn.add(r.id);
  }
  function clearMap() {
    drawn.forEach((id) => MapView.clear(layerId(id)));
    drawn.clear();
    MapView.clear(HIGHLIGHT);
  }
  function syncMap() {
    const ids = new Set(routes.map((r) => r.id));
    drawn.forEach((id) => { if (!ids.has(id)) { MapView.clear(layerId(id)); drawn.delete(id); } });
    routes.forEach(drawRoute);
  }
  function highlight(id) {
    if (id === hoverId) return;
    hoverId = id;
    const r = routes.find((x) => x.id === id);
    if (r) MapView.drawRoute(HIGHLIGHT, linePoints(r), { weight: 7 }); else MapView.clear(HIGHLIGHT);
  }

  /* ── Auswertung: Warteschlange, nächste Routen zur Kartenmitte zuerst ── */
  function enqueue() {
    const c = MapView.map.getCenter(), mid = { lat: c.lat, lon: c.lng };
    const near = (r) => U.geo.dist(mid, r.line[Math.floor(r.line.length / 2)]);
    queue = routes.filter((r) => !results.has(r.id) && !inflight.has(r.id)).sort((a, b) => near(a) - near(b));
    pump();
  }
  function pump() {
    while (visible && inflight.size < PARALLEL && queue.length) {
      const r = queue.shift();
      inflight.add(r.id);
      Tour.analyze(r.line, { orient: true })
        .then((a) => results.set(r.id, { a }), (e) => results.set(r.id, { error: e.message || 'Fehler' }))
        .finally(() => {
          inflight.delete(r.id);
          if (routes.includes(r)) { drawRoute(r); renderSoon(); }
          pump();
        });
    }
  }
  function retryFailed() {
    [...results].forEach(([id, v]) => { if (v.error) results.delete(id); });
    render(); enqueue();
  }

  /* ── Routen laden ── */
  async function load() {
    const my = ++loadSeq, map = MapView.map;
    if (map.getZoom() < MIN_ZOOM) { routes = []; queue = []; status = 'zoom'; clearMap(); render(); return; }
    status = 'loading';
    render();
    try {
      const b = map.getBounds();
      const list = await Routes.inBBox({ s: b.getSouth(), w: b.getWest(), n: b.getNorth(), e: b.getEast() });
      if (my !== loadSeq) return;
      routes = list;
      status = 'ok';
      syncMap(); enqueue(); render();
    } catch (e) {
      if (my !== loadSeq) return;
      status = 'error'; errorMsg = e.message || 'Unbekannter Fehler';
      render();
    }
  }
  function onMove() {
    if (!visible) return;
    clearTimeout(moveTimer);
    moveTimer = setTimeout(load, MOVE_MS);
  }

  function select(id) {
    const route = routes.find((r) => r.id === id);
    if (!route) return;
    U.bus.emit('route:select', { route, analysis: analysis(route) });
    U.bus.emit('tab', 'planen');
  }

  /* ── Aufbau ── */
  function mount(el) {
    root = el;
    root.innerHTML = `<div class="stack-sm"><h2 class="panel-title">Tourenauswahl</h2>
        <div class="coord" data-s="status" role="status" aria-live="polite"></div>
        <p class="coord">Risiko nach GRM aus Bulletin und Gelände – keine Garantie, Beurteilung vor Ort nötig.</p></div>
      <div class="card stack-sm" data-s="filters">${filtersHtml()}</div>
      <div data-s="list"></div>`;
    q('filters').addEventListener('click', onFilter);
    const list = q('list');
    list.addEventListener('click', (e) => {
      const item = e.target.closest('[data-id]');
      if (item) select(item.dataset.id);
    });
    root.addEventListener('click', (e) => {
      if (e.target.closest('[data-retry]')) retryFailed();
      else if (e.target.closest('[data-zoom]')) MapView.map.setZoom(MIN_ZOOM);
      else if (e.target.closest('[data-reload]')) load();
      else if (e.target.closest('[data-reset]')) { prefs = { ...prefs, ...DEFAULTS, sort: prefs.sort }; savePrefs(); syncFilters(); render(); }
    });
    list.addEventListener('mouseover', (e) => { const i = e.target.closest('[data-id]'); highlight(i ? i.dataset.id : null); });
    list.addEventListener('mouseleave', () => highlight(null));
    list.addEventListener('focusin', (e) => { const i = e.target.closest('[data-id]'); if (i) highlight(i.dataset.id); });
    list.addEventListener('focusout', () => highlight(null));
    MapView.map.on('moveend', onMove);
    U.bus.on('route:select', ({ route }) => { selectedId = route.id; });
  }
  function show() {
    visible = true;
    load();
  }
  function hide() {
    visible = false;
    clearTimeout(moveTimer);
    hoverId = null;
    clearMap();
  }

  return { mount, show, hide };
})();

/* ── 62-panel-plan.js ── */
/* ══════════════════════════ 62 · Panel «Planen» (Tourenplanung) ══════════════════════════
   Route aus «Touren» (Ereignis 'route:select'), selbst gezeichnet oder aus GPX → Tour.analyze → Kennzahlen,
   Höhenprofil, Schlüsselstellen, GRM-Grafik, Zeitplan mit Wetter am Gipfel, Verhältnisse, Speichern und GPX.
   Eine Route = {id, name, note, source: 'sac'|'draw'|'gpx', url, diff, line:[{lat, lon}]}.
   Nur gezeichnete Routen (draw) haben ziehbare Punkte; SAC-Routen werden immer von unten nach oben ausgewertet. */
const PanelPlan = (() => {
  const { card, section, skel, empty, failure, stat, fill } = Blocks;
  const NEAR_KM = 15, ANALYZE_MS = 500, MAX_SAVED = 50, MIN_SPACING_M = 10;
  const MAP = { line: 'plan', hover: 'plan-hover', crux: 'plan-crux', summit: 'plan-summit', wp: 'plan-wp' };
  const DEFAULTS = { upHmH: CFG.time.upHmH, flatKmH: CFG.time.flatKmH, start: `${String(CFG.time.startHour).padStart(2, '0')}:00`, day: 0, roundTrip: true };
  const NEW_NAME = 'Eigene Tour';

  let root = null, visible = false, drawing = false, needFit = false;
  let route = null, an = null, pending = false, error = null, preset = null;
  let seq = 0, view = 0, schedSeq = 0, timer = 0, cruxOn = -1, wpCount = 0;
  let prefs = { ...DEFAULTS, ...(U.store.get('plan.prefs', null) || {}) };
  let saved = U.store.get('plan.saved', []);
  if (!Array.isArray(saved)) saved = [];

  const q = (k) => U.$(`[data-s="${k}"]`, root);
  const isStandard = () => prefs.upHmH === DEFAULTS.upHmH && prefs.flatKmH === DEFAULTS.flatKmH && prefs.roundTrip;
  const round5 = (line) => line.map((p) => ({ lat: U.geo.round5(p.lat), lon: U.geo.round5(p.lon) }));
  const toast = (msg, error = false) => MapView.toast(msg, { error });

  /* ── Hinweis (Plan-Stil) ── */
  const note = (kind, text) => `<div class="pl-note ${kind}"><span class="ic">${Icons.icon(kind === 'info' ? 'info' : 'warning')}</span><div>${U.esc(text)}</div></div>`;

  /* ── Zeit: Tag und Uhrzeit in Zürcher Zeit → ms ── */
  const startMs = () => U.zurichMs(U.zurichDay(prefs.day), /^\d{1,2}:\d{2}$/.test(prefs.start) ? prefs.start : DEFAULTS.start);

  /* ── Karte ── */
  function clearMap() {
    [MAP.line, MAP.hover, MAP.crux, MAP.summit].forEach(MapView.clear);
    for (let i = 0; i < wpCount; i++) MapView.clear(MAP.wp + i);
    wpCount = 0;
  }
  function syncWaypoints() {
    const pts = route && route.source === 'draw' ? route.line : [];
    pts.forEach((p, i) => MapView.marker(MAP.wp + i, p, `<div class="mk-wp">${i + 1}</div>`, {
      size: [24, 24], draggable: true,
      onMove: (np, final) => { route.line[i] = np; if (final) changed(); else drawLine(); },
    }));
    for (let i = pts.length; i < wpCount; i++) MapView.clear(MAP.wp + i);
    wpCount = pts.length;
  }
  // Linie: nach der Auswertung in Zonenfarben, bis dahin in Primärfarbe
  function drawLine() {
    if (!route || route.line.length < 2) { MapView.clear(MAP.line); return; }
    if (an && !pending) MapView.drawRoute(MAP.line, an.samples, { byRisk: true });
    else MapView.drawRoute(MAP.line, route.line);
  }
  function drawMap() {
    if (!visible) return;
    if (!route || !route.line.length) { clearMap(); return; }
    drawLine();
    syncWaypoints();
    if (an && !pending) MapView.marker(MAP.summit, an.summit, `<div class="mk mk-icon" title="Höchster Punkt">${Icons.icon('mountain', 16)}</div>`, { size: [28, 28] });
    else MapView.clear(MAP.summit);
    if (needFit) { MapView.fit(route.line); needFit = false; }
  }
  function setDrawing(on) {
    drawing = on;
    MapView.setClickMode(on && visible ? addPoint : null);
    syncToolbar();
  }

  /* ── Route ändern ── */
  const persist = () => U.store.set('plan.current', route ? { ...route, line: round5(route.line) } : null);
  function changed() {            // Geometrie geändert → neu auswerten (alte Anzeige bleibt abgeblendet stehen)
    persist();
    pending = route.line.length > 1; error = null; preset = null; cruxOn = -1;
    if (!pending) an = null;
    ++seq;
    MapView.clear(MAP.crux);
    drawMap(); syncToolbar(); layout();
    clearTimeout(timer);
    timer = setTimeout(analyze, ANALYZE_MS);
  }
  function setRoute(r, { analysis = null } = {}) {
    route = r;
    an = null; pending = !!r && r.line.length > 1; error = null; preset = analysis; cruxOn = -1; needFit = !!r;
    ++seq;
    if (r && r.source !== 'draw') setDrawing(false);
    clearMap();
    persist();
    U.$('[data-s="name"]', root).value = r ? r.name : '';
    drawMap(); syncToolbar(); layout();
    clearTimeout(timer);
    if (pending) timer = setTimeout(analyze, 0);
    else U.bus.emit('plan:changed', { route, analysis: null });
  }
  function addPoint(p) {
    if (!route || route.source !== 'draw') { route = { id: null, name: NEW_NAME, note: '', source: 'draw', url: null, diff: null, line: [] }; an = null; U.$('[data-s="name"]', root).value = route.name; }
    route.line.push({ lat: p.lat, lon: p.lon });
    changed();
  }

  async function analyze() {
    clearTimeout(timer);
    timer = 0;
    if (!route || route.line.length < 2) { an = null; pending = false; layout(); U.bus.emit('plan:changed', { route, analysis: null }); return; }
    const my = ++seq;
    if (preset && isStandard()) { finish(preset); preset = null; return; }
    preset = null;
    pending = true;
    layout();
    try {
      const sac = route.source === 'sac';   // SAC: von unten nach oben, Lücken markieren; gezeichnet/GPX: Punkte dürfen weit auseinander liegen
      finish(await Tour.analyze([...route.line], { orient: sac, gaps: sac, roundTrip: prefs.roundTrip, prefs: { ...CFG.time, upHmH: prefs.upHmH, flatKmH: prefs.flatKmH } }), my);
    } catch (e) {
      if (my !== seq) return;
      an = null; pending = false; error = Blocks.errText(e);
      layout();
    }
  }
  function finish(a, my = seq) {
    if (my !== seq) return;
    pending = false;
    if (!a.summit) { an = null; error = 'Für diese Route liegen keine Höhendaten vor.'; layout(); return; }
    an = a; error = null;
    if (route.source === 'sac') route.line = a.line;
    persist();
    layout();
    drawMap();
    U.bus.emit('plan:changed', { route, analysis: an });
  }

  /* ── Werkzeugleiste ── */
  function syncToolbar() {
    if (!root) return;
    const btn = (a) => U.$(`[data-a="${a}"]`, root), draw = btn('draw'), n = route ? route.line.length : 0;
    draw.setAttribute('aria-pressed', String(drawing));
    draw.className = `btn btn-sm ${drawing ? 'btn-primary' : 'btn-secondary'}`;
    btn('undo').disabled = !(route && route.source === 'draw' && n);
    btn('reverse').disabled = !(route && route.source !== 'sac' && n > 1);
    btn('clear').disabled = !n;
    q('hint').hidden = !drawing;
    syncSaveButtons();
  }
  function syncSaveButtons() {
    const ok = !!(route && an && !pending);
    ['save', 'export'].forEach((a) => { U.$(`[data-a="${a}"]`, root).disabled = !ok; });
  }
  function onAction(a) {
    if (a === 'draw') {
      if (!drawing && (!route || route.source !== 'draw')) setRoute(null);
      setDrawing(!drawing);
    } else if (a === 'undo') { route.line.pop(); route.line.length ? changed() : setRoute(null); }
    else if (a === 'reverse') { route.line.reverse(); changed(); }
    else if (a === 'clear') setRoute(null);
    else if (a === 'save') save();
    else if (a === 'export') exportGpx();
    else if (a === 'import') U.$('[data-s="file"]', root).click();
    else if (a === 'touren') U.bus.emit('tab', 'touren');
  }

  /* ── Kopf ── */
  function headHtml() {
    const r = an.assess.r, z = Risk.zoneOf(r), t = an.time;
    const meta = [route.note && U.esc(route.note), route.diff && `<span class="badge info" title="SAC-Schwierigkeit">${U.esc(route.diff)}</span>`, route.url && `<a href="${U.esc(route.url)}" target="_blank" rel="noopener">SAC-Beschreibung</a>`].filter(Boolean);
    const gaps = an.gaps ? note('info', `Die Linie enthält ${an.gaps} Lücke${an.gaps > 1 ? 'n' : ''} von mehr als 500 m. Diese Abschnitte sind nicht bewertet.`) : '';
    return `${meta.length ? `<div class="pl-meta card-sub">${meta.join('')}</div>` : ''}
      <div class="pl-risk">${Icons.risk(r, 40)}<div class="grow"><div class="card-title">${z == null ? 'Risiko nicht bestimmbar' : U.esc(U.cap(CFG.risk[z].name))}</div>
        <div class="card-sub">${z == null ? 'Für diese Route liegt kein Lawinenbulletin vor.' : `Wert ${U.fmt.num(r, 1)} von 3 · riskanteste ${CFG.grm.routeWindowM} m (GRM)`}</div></div></div>
      <div class="pl-stats">${stat('Distanz', U.fmt.km(t.distM))}${stat('Aufstieg', U.fmt.m(t.upM))}${stat('Abfahrt', U.fmt.m(t.downM))}${stat('Höchster Punkt', U.fmt.m(an.summit && an.summit.elev))}
        ${stat('Aufstiegszeit', U.fmt.dur(t.upMin))}${stat('Abfahrtszeit', prefs.roundTrip ? U.fmt.dur(t.downMin) : '–')}${stat('Gesamtzeit', U.fmt.dur(t.totalMin))}${stat('Start', U.fmt.m(an.start && an.start.elev))}</div>${gaps}`;
  }

  /* ── Profil ── */
  function renderProfile() {
    q('profile').innerHTML = section('Höhenprofil', card('<div data-chart="profile"></div>'));
    Charts.profile(U.$('[data-chart="profile"]', root), an.samples, {
      marks: an.assess.cruxes.map((c) => ({ d0: c.d0, d1: c.d1 })), eta: an.time.eta,
      onHover: (s) => { if (s && !s.gap) MapView.marker(MAP.hover, s, '<div class="mk-dot"></div>', { size: [14, 14] }); else MapView.clear(MAP.hover); },
    });
  }

  /* ── Schlüsselstellen ── */
  // Stelle mit dem höchsten Risikowert im Abschnitt (liefert g, massgebende Neigung, Kernzone)
  const worst = (c) => an.samples.slice(c.i0, c.i1 + 1).reduce((b, s) => (s.r != null && (!b || s.r > b.r) ? s : b), null);
  function coreText(s) {
    if (!s || !s.problem) return 'ohne Lawinenproblem im Bulletin';
    return s.inCore ? `in der Kernzone (${s.problem.label})` : `ausserhalb der Kernzone (${s.problem.label})`;
  }
  function cruxHtml(c, i) {
    const s = worst(c), zone = c.zone == null ? '' : `<span class="dot" style="--c:${Icons.zoneColor(c.zone)}"></span>${U.esc(CFG.risk[c.zone].name)} heute`;
    return `<li><button class="pick-row" type="button" data-crux="${i}" aria-pressed="${cruxOn === i}">
      <span class="pl-crux-ic">${Icons.crux(c.cls)}</span>
      <span class="grow">
        <span class="pick-title">${i + 1} · ${U.fmt.km(c.d0)} – ${U.fmt.km(c.d1)}</span>
        <span class="pick-sub">Steilste Stelle ${U.fmt.deg(c.maxSteep)} · ${U.fmt.aspect(c.aspect)} · ${U.fmt.m(c.elev)}</span>
        <span class="pick-sub">${zone}${zone && ' · '}${U.esc(coreText(s))}${c.region ? ` · ${U.esc(c.region)}` : ''}</span>
      </span>${Icons.risk(c.r, 28)}</button></li>`;
  }
  function renderCruxes() {
    const cx = an.assess.cruxes;
    if (!cx.length) { q('cruxes').innerHTML = `<div>${section('Schlüsselstellen', card(empty('Keine Abschnitte über 30° Neigung im Spurbereich. Die Beurteilung vor Ort bleibt nötig.')))}</div>`; return; }
    q('cruxes').innerHTML = `<div>${section('Schlüsselstellen', `<div class="card flat-pad pick-card"><ul class="pick-list">${cx.map(cruxHtml).join('')}</ul></div>`)}</div>`
      + `<div class="card"><div class="card-title">Gefahr und Neigung (GRM)</div><div class="card-sub">Jeder Punkt ist eine Schlüsselstelle: Gefahrenwert dort und massgebende Neigung.</div><div data-chart="grm" class="pl-grm"></div></div>`;
    Charts.grm(U.$('[data-chart="grm"]', root), cx.map((c, i) => { const s = worst(c); return { g: s && s.g, steep: s && s.steepUsed, label: String(i + 1) }; }));
  }
  function focusCrux(i) {
    cruxOn = cruxOn === i ? -1 : i;
    U.$$('[data-crux]', root).forEach((b) => b.setAttribute('aria-pressed', String(+b.dataset.crux === cruxOn)));
    if (cruxOn < 0) { MapView.clear(MAP.crux); return; }
    const c = an.assess.cruxes[i], part = an.samples.slice(c.i0, c.i1 + 1);
    MapView.drawRoute(MAP.crux, part, { weight: 8 });
    MapView.fit(part, { maxZoom: 16 });
  }

  /* ── Zeitplan ── */
  const hourAt = (w, ms) => w.hours.find((h) => ms >= h.t && ms < h.t + 3600e3) || null;
  const regionsOf = () => {
    const seen = new Map();
    an.samples.forEach((s) => { if (s.region && !seen.has(s.region.id)) seen.set(s.region.id, { region: s.region, at: s }); });
    return [...seen.values()];
  };
  async function renderSchedule() {
    const my = ++schedSeq, t = an.time, sm = an.summit, i = an.samples.indexOf(sm);
    const start = startMs(), arrive = start + (t.eta[i] ?? t.upMin) * 60e3, back = start + t.totalMin * 60e3;
    const times = (sun) => `<div class="pl-stats">${stat('Start', U.fmt.time(start))}${stat('Gipfel', U.fmt.time(arrive))}${stat(prefs.roundTrip ? 'Rückkehr' : 'Ende', U.fmt.time(back))}${stat('Sonnenuntergang', sun)}</div>`;
    q('times').innerHTML = times('…');
    q('weather').innerHTML = skel(2);
    try {
      const [w, b] = await Promise.all([Weather.forecast(sm.lat, sm.lon, sm.elev), Bulletin.load()]);
      if (my !== schedSeq) return;
      const day = w.days.find((d) => d.sunset && U.fmt.date(d.sunset) === U.fmt.date(start)), sun = day && day.sunset, h = hourAt(w, arrive), notes = [];
      q('times').innerHTML = times(sun ? U.fmt.time(sun) : '–');
      if (sun) {
        const reserve = (sun - back) / 60e3;
        if (reserve < 0) notes.push(note('err', `Die Rückkehr um ${U.fmt.time(back)} liegt nach Sonnenuntergang (${U.fmt.time(sun)}).`));
        else if (reserve < 60) notes.push(note('warn', `Zwischen Rückkehr (${U.fmt.time(back)}) und Sonnenuntergang (${U.fmt.time(sun)}) bleiben ${U.fmt.dur(reserve)}.`));
      }
      if (h && h.fzl != null && h.fzl > sm.elev && regionsOf().some(({ region }) => region.problems.some((p) => p.type === 'wet_snow'))) {
        notes.push(note('warn', `Nassschnee: Das Bulletin nennt ein Nassschnee-Problem, und die Nullgradgrenze liegt zur Ankunft um ${U.fmt.time(arrive)} mit ${U.fmt.m(h.fzl)} über dem Gipfel (${U.fmt.m(sm.elev)}). Mit durchfeuchtetem Schnee ist zu rechnen; früher starten oder die Route anpassen.`));
      }
      if (b.validTo && start > b.validTo) notes.push(note('info', `Der Zeitplan liegt nach dem Ende des aktuellen Bulletins (${U.fmt.date(b.validTo)}, ${U.fmt.time(b.validTo)}). Das Risiko mit dem neuen Bulletin erneut prüfen.`));
      const dot = (name, v) => (v == null ? '' : Blocks.dot(name, v));
      q('weather').innerHTML = (h
        ? `<div class="card-sub">Prognose am Gipfel (${U.fmt.m(sm.elev)}) um ${U.fmt.time(arrive)} · ${U.esc(Weather.modelName(w.model))}</div>
          <div class="pl-stats">${stat('Temperatur', `${dot('temp', h.temp)}${U.fmt.num(h.temp, 1)} °C`)}${stat('Nullgradgrenze', U.fmt.m(h.fzl))}${stat('Wind', `${dot('wind', h.wind)}${U.fmt.num(h.wind)} km/h`)}${stat('Böen', `${U.fmt.num(h.gust)} km/h`)}</div>`
        : `<div class="card-sub">Für ${U.fmt.time(arrive)} liegt keine Prognose vor (Prognosezeitraum: 3 Tage).</div>`) + notes.join('');
    } catch (e) {
      if (my !== schedSeq) return;
      q('times').innerHTML = times('–');
      q('weather').innerHTML = failure(Blocks.errText(e));
      Blocks.onRetry(q('weather'), renderSchedule);
    }
  }
  function syncPrefs() {
    q('prefs').querySelectorAll('[data-day]').forEach((b) => b.setAttribute('aria-pressed', String(+b.dataset.day === prefs.day)));
    U.$('[data-s="start"]', root).value = prefs.start;
    U.$('[data-s="round"]', root).checked = prefs.roundTrip;
    [['upHmH', 'Hm/h', 0], ['flatKmH', 'km/h', 1]].forEach(([k, unit, d]) => {
      U.$(`[data-p="${k}"]`, root).value = prefs[k];
      U.$(`[data-v="${k}"]`, root).textContent = `${U.fmt.num(prefs[k], d)} ${unit}`;
    });
  }
  function onPrefs(e) {
    const el = e.target;
    if (el.dataset.p) {                                   // Schieberegler
      prefs[el.dataset.p] = +el.value;
      syncPrefs();
      if (e.type === 'change') { U.store.set('plan.prefs', prefs); regrade(); }
    } else if (e.type !== 'change') return;
    else if (el.dataset.s === 'round') { prefs.roundTrip = el.checked; U.store.set('plan.prefs', prefs); regrade(); }
    else if (el.dataset.s === 'start' && /^\d{1,2}:\d{2}$/.test(el.value)) { prefs.start = el.value; U.store.set('plan.prefs', prefs); if (an) renderSchedule(); }
  }
  // Zeiten neu rechnen (Geländedaten sind gecacht); die bisherige Anzeige bleibt bis dahin sichtbar
  function regrade() { if (route && route.line.length > 1) { pending = true; preset = null; layout(); analyze(); } }

  /* ── Verhältnisse ── */
  function bulletinHtml() {
    const list = regionsOf();
    if (!list.length) return empty('Für diese Route liegt kein Lawinenbulletin vor.');
    return `<ul class="list">${list.map(({ region: r, at }) => {
      const probs = [...new Set(r.problems.filter((p) => p.type && p.level).map((p) => p.label))];
      return `<li><span class="pl-lv lv-${r.level}">${Icons.danger(r.level, r.sub)}</span>
        <div class="li-main"><div class="li-title">${U.esc(r.name)}</div><div class="li-sub">${U.esc(Icons.levelLabel(r.level, r.sub))}${probs.length ? ' · ' + U.esc(probs.join(', ')) : ''}</div></div>
        <button class="btn btn-link btn-sm" type="button" data-bulletin="${at.lat},${at.lon}">Bulletin</button></li>`;
    }).join('')}</ul>`;
  }
  async function stationsHtml() {
    await Stations.load();
    const list = Stations.near(an.summit.lat, an.summit.lon, { n: 4, km: NEAR_KM });
    return list.length ? Blocks.stationTable(list) : empty(`Keine Messstation im Umkreis von ${NEAR_KM} km um den Gipfel.`);
  }
  async function webcamsHtml() {
    return Blocks.webcams(await Webcams.near(an.summit.lat, an.summit.lon, { km: NEAR_KM, n: 4 }), 'vom Gipfel', `Keine Webcam im Umkreis von ${NEAR_KM} km um den Gipfel.`);
  }
  function renderConditions(my) {
    q('cond').innerHTML = '<div data-s="c-bulletin"></div><div data-s="c-stations"></div><div data-s="c-webcams"></div>';
    const current = () => my === view;
    fill(q('c-bulletin'), 'Lawinenbulletin entlang der Route', async () => bulletinHtml(), current);
    fill(q('c-stations'), 'Messwerte in der Nähe des Gipfels', stationsHtml, current);
    fill(q('c-webcams'), 'Webcams in der Nähe', webcamsHtml, current);
  }

  /* ── Darstellung nach Zustand ── */
  function layout() {
    if (!root) return;
    const n = route ? route.line.length : 0, ready = n > 1 && !!an, loading = n > 1 && !an && !error;
    root.classList.toggle('busy', pending && ready);
    const on = (k, v) => { q(k).hidden = !v; };
    on('empty', n < 2); on('head', n > 1); on('profile', ready || loading); on('cruxes', ready); on('schedule', ready); on('cond', ready);
    syncSaveButtons();
    if (n < 2) {
      q('empty').innerHTML = card(n === 0
        ? `<div class="state"><span class="ic">${Icons.icon('route')}</span><div class="state-title">Noch keine Route</div><div>Eine Route in «Touren» wählen oder mit «Zeichnen» Punkte auf der Karte setzen. GPX-Dateien lassen sich unten laden.</div><button class="btn btn-secondary btn-sm" type="button" data-a="touren">Zur Tourenauswahl</button></div>`
        : empty('Noch ein Punkt: Ab zwei Punkten wird die Route ausgewertet.'));
      return;
    }
    if (!ready) {
      q('risk').innerHTML = error ? failure(error) : skel(4);
      if (error) Blocks.onRetry(q('risk'), () => { error = null; layout(); analyze(); });
      q('profile').innerHTML = loading ? section('Höhenprofil', card(skel(5))) : '';
      return;
    }
    if (pending) return;            // alte Anzeige bleibt abgeblendet stehen, bis die neue da ist
    const my = ++view;
    q('risk').innerHTML = headHtml();
    renderProfile(); renderCruxes(); renderSchedule(); renderConditions(my);
  }

  /* ── Speichern und Laden ── */
  function save() {
    if (!route || !an) return;
    route.id = route.id || 'u' + Date.now().toString(36);
    const entry = { ...route, line: round5(route.line), distM: an.time.distM, upM: an.time.upM, at: Date.now() };
    saved = [entry, ...saved.filter((x) => x.id !== route.id)].slice(0, MAX_SAVED);
    U.store.set('plan.saved', saved);
    persist(); renderSaved();
    toast('Tour gespeichert');
  }
  function renderSaved() {
    const box = q('saved');
    box.innerHTML = saved.length
      ? `<ul class="list">${saved.map((s) => `<li><div class="li-main"><button class="li-title" type="button" data-load="${U.esc(s.id)}">${U.esc(s.name)}</button>
          <div class="li-sub">${s.source === 'sac' ? 'SAC-Route' : s.source === 'gpx' ? 'GPX' : 'Eigene Tour'} · ${U.fmt.km(s.distM)} · ${U.fmt.m(s.upM)} Aufstieg · ${U.fmt.date(s.at)}</div></div>
          <button class="btn-icon btn-bare" type="button" data-del="${U.esc(s.id)}" aria-label="${U.esc(s.name)} löschen"><span class="ic">${Icons.icon('trash')}</span></button></li>`).join('')}</ul>`
      : '<div class="card-sub">Noch keine gespeicherten Touren.</div>';
  }
  function loadSaved(id) {
    const s = saved.find((x) => x.id === id);
    if (!s) return;
    setRoute({ id: s.id, name: s.name, note: s.note || '', source: s.source, url: s.url || null, diff: s.diff || null, line: s.line.map((p) => ({ lat: p.lat, lon: p.lon })) });
  }

  /* ── GPX ── */
  const fileName = (name) => (name.normalize('NFKD').replace(/[^\w\s-]/g, '').trim().replace(/\s+/g, '-').toLowerCase() || 'tour') + '.gpx';
  function exportGpx() {
    if (!route || !an) return;
    const segs = [];
    let cur = null;
    an.samples.forEach((s) => {
      if (s.gap) { cur = null; return; }
      if (!cur) segs.push((cur = []));
      cur.push(`<trkpt lat="${s.lat.toFixed(6)}" lon="${s.lon.toFixed(6)}">${s.elev != null ? `<ele>${s.elev.toFixed(1)}</ele>` : ''}</trkpt>`);
    });
    const gpx = `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Skitourenplaner" xmlns="http://www.topografix.com/GPX/1/1">\n<metadata><name>${U.esc(route.name)}</name></metadata>\n<trk><name>${U.esc(route.name)}</name>\n${segs.map((s) => `<trkseg>\n${s.join('\n')}\n</trkseg>`).join('\n')}\n</trk>\n</gpx>\n`;
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([gpx], { type: 'application/gpx+xml' })), download: fileName(route.name) });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
  // Punkte (trk, sonst rte); Punkte dichter als MIN_SPACING_M werden ausgelassen
  function parseGpx(text) {
    const doc = new DOMParser().parseFromString(text, 'application/xml');
    if (doc.querySelector('parsererror')) throw new Error('Die Datei ist keine gültige GPX-Datei');
    let els = U.$$('trkpt', doc);
    if (!els.length) els = U.$$('rtept', doc);
    const line = [];
    els.forEach((e) => {
      const p = { lat: parseFloat(e.getAttribute('lat')), lon: parseFloat(e.getAttribute('lon')) };
      if (Number.isFinite(p.lat) && Number.isFinite(p.lon) && (!line.length || U.geo.dist(line[line.length - 1], p) >= MIN_SPACING_M)) line.push(p);
    });
    if (line.length < 2) throw new Error('Die GPX-Datei enthält keinen Track mit mindestens zwei Punkten');
    const nm = doc.querySelector('trk > name, rte > name, metadata > name');
    return { name: (nm && nm.textContent.trim()) || NEW_NAME, line };
  }
  async function importGpx(file) {
    try {
      const { name, line } = parseGpx(await file.text());
      setRoute({ id: null, name, note: 'Aus GPX-Datei', source: 'gpx', url: null, diff: null, line });
    } catch (e) { toast(e.message, true); }
  }

  /* ── Aufbau ── */
  function mount(el) {
    root = el;
    root.innerHTML = `<h2 class="panel-title">Tour planen</h2>
      <div class="card stack-sm">
        <div class="row-wrap pl-tools" role="toolbar" aria-label="Route zeichnen">
          <button class="btn btn-secondary btn-sm" type="button" data-a="draw" aria-pressed="false">Zeichnen</button>
          <button class="btn btn-outlined btn-sm" type="button" data-a="undo">Rückgängig</button>
          <button class="btn btn-outlined btn-sm" type="button" data-a="reverse" title="Richtung umkehren">Umkehren</button>
          <button class="btn btn-outlined btn-sm" type="button" data-a="clear">Löschen</button>
        </div>
        <div class="card-sub" data-s="hint" hidden>Auf die Karte klicken oder tippen, um Punkte zu setzen. Punkte lassen sich verschieben.</div>
      </div>
      <div data-s="empty"></div>
      <div class="card stack-sm" data-s="head">
        <input class="input pl-name" data-s="name" type="text" aria-label="Name der Tour" maxlength="80" autocomplete="off">
        <div class="stack-sm" data-s="risk"></div>
      </div>
      <div data-s="profile"></div>
      <div data-s="cruxes" class="stack"></div>
      <div data-s="schedule">
        <h3 class="section-title">Zeitplan</h3>
        <div class="card stack">
          <div class="stack" data-s="prefs">
            <div class="row-wrap">
              <div class="field"><span class="field-label" id="pl-l-day">Tag</span><div class="seg" role="group" aria-labelledby="pl-l-day"><button type="button" data-day="0">Heute</button><button type="button" data-day="1">Morgen</button></div></div>
              <div class="field"><label for="pl-start">Startzeit</label><input class="input pl-time" id="pl-start" data-s="start" type="time"></div>
            </div>
            <div class="slider"><div class="slider-head"><label for="pl-up">Aufstieg</label><span class="v" data-v="upHmH"></span></div><input id="pl-up" data-p="upHmH" type="range" min="200" max="700" step="25"></div>
            <div class="slider"><div class="slider-head"><label for="pl-flat">Strecke</label><span class="v" data-v="flatKmH"></span></div><input id="pl-flat" data-p="flatKmH" type="range" min="2" max="6" step="0.5"></div>
            <label class="check"><input type="checkbox" data-s="round"><span>Abfahrt einrechnen</span></label>
          </div>
          <div class="pl-sep" data-s="times"></div>
          <div class="stack-sm" data-s="weather"></div>
        </div>
      </div>
      <div data-s="cond" class="stack"></div>
      <h3 class="section-title">Meine Touren</h3>
      <div class="card stack">
        <div class="row-wrap">
          <button class="btn btn-secondary btn-sm" type="button" data-a="save">Speichern</button>
          <button class="btn btn-outlined btn-sm" type="button" data-a="export"><span class="ic">${Icons.icon('download')}</span>GPX exportieren</button>
          <button class="btn btn-outlined btn-sm" type="button" data-a="import"><span class="ic">${Icons.icon('upload')}</span>GPX importieren</button>
        </div>
        <input type="file" data-s="file" accept=".gpx,application/gpx+xml,.xml" hidden>
        <div data-s="saved"></div>
      </div>`;

    root.addEventListener('click', (e) => {
      const t = e.target;
      const a = t.closest('[data-a]'), c = t.closest('[data-crux]'), b = t.closest('[data-bulletin]'), l = t.closest('[data-load]'), d = t.closest('[data-del]'), day = t.closest('[data-day]');
      if (a) onAction(a.dataset.a);
      else if (c) focusCrux(+c.dataset.crux);
      else if (b) { const [lat, lon] = b.dataset.bulletin.split(',').map(Number); U.bus.emit('point', { lat, lon }); U.bus.emit('tab', 'lage'); }
      else if (l) loadSaved(l.dataset.load);
      else if (d) { saved = saved.filter((x) => x.id !== d.dataset.del); U.store.set('plan.saved', saved); renderSaved(); }
      else if (day) { prefs.day = +day.dataset.day; U.store.set('plan.prefs', prefs); syncPrefs(); if (an) renderSchedule(); }
    });
    ['input', 'change'].forEach((evt) => q('prefs').addEventListener(evt, onPrefs));
    U.$('[data-s="name"]', root).addEventListener('input', (e) => { if (route) { route.name = e.target.value; persist(); } });
    U.$('[data-s="file"]', root).addEventListener('change', (e) => { const f = e.target.files[0]; e.target.value = ''; if (f) importGpx(f); });

    syncPrefs(); renderSaved();
    const cur = U.store.get('plan.current', null);
    if (cur && Array.isArray(cur.line) && cur.line.length) {
      route = { id: cur.id || null, name: cur.name || NEW_NAME, note: cur.note || '', source: cur.source || 'draw', url: cur.url || null, diff: cur.diff || null, line: cur.line.map((p) => ({ lat: p.lat, lon: p.lon })) };
      U.$('[data-s="name"]', root).value = route.name;
      pending = route.line.length > 1; needFit = true;
    }
    layout(); syncToolbar();
    U.bus.on('route:select', ({ route: r, analysis }) => setRoute({
      id: r.id, name: r.target, note: r.name && r.name !== r.target ? r.name : '', source: 'sac', url: r.url, diff: r.diff, line: r.line.map((p) => ({ lat: p.lat, lon: p.lon })),
    }, { analysis }));
  }
  function show() {
    visible = true;
    setDrawing(drawing);
    drawMap();
    if (pending && !timer && route) timer = setTimeout(analyze, 0);
  }
  function hide() {
    visible = false;
    MapView.setClickMode(null);
    clearMap();
  }

  return { mount, show, hide };
})();

/* ── 63-panel-vorort.js ── */
/* ══════════════════════════ 63 · Panel «Vor Ort» ══════════════════════════
   Beurteilung im Gelände: Einzelhang nach GRM (Merkblatt «Achtung Lawinen!»), Alarmzeichen,
   3×3-Filter (pro Tag gespeichert), Verhalten und Massnahmen. Inhalte: Merkblatt; Rechnen: Risk; Gelände: Terrain.
   Das Panel ist ein Hilfsmittel für die eigene Beurteilung, es ersetzt sie nicht. */
const PanelVorOrt = (() => {
  const M = Merkblatt, esc = U.esc;
  const SUB_D = { minus: -1 / 3, neutral: 0, plus: 1 / 3 };
  const LEVELS = [1, 2, 3, 4];           // GRM kennt Stufen 1–4; Stufe 5 (sehr gross): Verzicht
  const SLOPE_MIN = 20, SLOPE_MAX = 55;
  const ROWS = M.filter.rows, COLS = M.filter.cols, N_CELLS = ROWS.length * COLS.length;

  let root = null, visible = false, dirty = true, seq = 0, raf = 0;
  /* st.ov = Korrekturen von Hand (fehlt ein Schlüssel, gilt der Wert aus Karte/Bulletin):
     slope (°), aspect (° in 45er-Schritten), elev (m), lvl {level, sub} */
  const st = { pt: null, terrain: null, region: null, busy: false, terrErr: '', bulErr: '', ov: {} };

  /* ── Tagesprotokoll (Alarmzeichen, 3×3): pro Tag, nur auf diesem Gerät ── */
  const freshLog = () => ({ day: U.zurichDay(), alarm: [], cells: {} });
  const readLog = () => { const s = U.store.get('vorort', null); return s && s.day === U.zurichDay() && Array.isArray(s.alarm) ? s : freshLog(); };
  let log = freshLog();
  const saveLog = () => U.store.set('vorort', log);

  /* ── Hilfen ── */
  const q = (k) => U.$(`[data-s="${k}"]`, root);
  const fmtSlope = (v) => `${U.fmt.num(v, Number.isInteger(v) ? 0 : 1)}°`;
  const aspectName = (deg) => CFG.aspectDe[Risk.sector8(deg)];
  const aspectIdx = (deg) => CFG.aspects8.indexOf(Risk.sector8(deg));

  /* ── Rechnen: aus Karte/Bulletin und Korrekturen den Hang bewerten ── */
  function calc() {
    const t = st.terrain, ov = st.ov;
    const aspect = ov.aspect ?? t?.aspect ?? null;
    const elev = ov.elev ?? t?.elev ?? null;
    const lv = ov.lvl ? { g: ov.lvl.level + SUB_D[ov.lvl.sub], inCore: null, problem: null } : Risk.levelAt(st.region, aspect, elev);
    const g = lv.g;
    const autoSlope = t ? (g == null ? t.slope : Risk.steepFor(t, g)) : null;
    const slope = ov.slope ?? autoSlope;
    const veryHigh = g != null && g > 4.5;
    let zone = null, r = null;
    if (g != null && slope != null) { if (veryHigh) { zone = 2; r = 3; } else ({ zone, r } = Risk.grm(slope, g)); }
    const area = g == null || veryHigh ? null : CFG.grm.radiusM.findIndex((x) => x.m === Risk.radiusFor(g));
    return { aspect, elev, lv, g, lvl: g == null ? null : Risk.split(g), autoSlope, slope, veryHigh, zone, r, area, limits: g == null || veryHigh ? null : Risk.limits(g) };
  }

  /* ── Hinweis bei Alarmzeichen / Anzeichen steigender Gefahr ── */
  function warnHtml() {
    const a = M.alarm.filter((x) => log.alarm.includes(x.id)), r = M.rises.filter((x) => log.alarm.includes(x.id));
    if (!a.length && !r.length) return '';
    const seen = `<p>Festgestellt: ${[...a, ...r].map((x) => esc(x.text)).join('; ')}.</p>`;
    if (a.length) {
      return Blocks.callout('err', 'Alarmzeichen: Die Beurteilung nach GRM reicht nicht mehr aus',
        `${seen}<p>Die GRM ist nur eine grobe Beurteilung der Auslösewahrscheinlichkeit. «Tiefe Gefahr» gilt nach Merkblatt nur, wenn keine speziellen Gefahrenzeichen vorliegen. Lokale Lawinengefahr jetzt detailliert beurteilen und defensiv entscheiden. Bei Unsicherheit: Verzicht.</p>`);
    }
    return Blocks.callout('warn', 'Anzeichen für steigende Lawinengefahr',
      `${seen}<p>Diese Beobachtungen weisen auf einen Anstieg der Lawinengefahr hin. Die Stufe aus dem Bulletin und damit die GRM reichen dann nicht mehr aus: laufend neu beurteilen (Wetter, Schnee, Gelände, Mensch, Zeitplan).</p>`);
  }

  /* ── Darstellung: Hang (Gelände, Bulletin) ── */
  function bulletinHtml(c) {
    const reg = st.region;
    if (st.bulErr) return Blocks.callout('warn', 'Bulletin nicht verfügbar', `<p>${esc(st.bulErr)} Gefahrenstufe unten von Hand wählen.</p>`);
    if (!reg) return Blocks.callout('info', 'Kein Bulletin', '<p>Für diesen Ort gibt es kein Lawinenbulletin. Gefahrenstufe unten von Hand wählen.</p>');
    if (!reg.level) return Blocks.callout('info', 'Keine Gefahrenstufe', `<p>Für die Region ${esc(reg.name)} ist keine Gefahrenstufe angegeben. Stufe unten von Hand wählen.</p>`);
    const lv = (level, sub) => `<span class="vo-lv lv-${level}">${Icons.danger(level, sub)}</span>`;
    let h = `<div class="vo-line">${lv(reg.level, reg.sub)}<div class="grow"><div class="b">Bulletin: ${esc(Icons.levelLabel(reg.level, reg.sub))}</div><div class="card-sub">${esc(reg.name)}</div></div></div>`;
    if (c.lvl && c.lvl.level >= 1 && c.lvl.level <= 5) {
      const manual = !!st.ov.lvl, p = c.lv.problem;
      let why;
      if (manual) why = 'Von Hand gewählt (siehe unten).';
      else if (!p) why = 'Das Bulletin nennt kein Lawinenproblem mit Kernzone, das die GRM beurteilt (Gleitschnee gehört nicht dazu). Dieses Tool setzt dann eine Stufe tiefer an.';
      else {
        const one = { ...reg, problems: [p] };
        const name = `«${esc(p.label)}»`;
        if (c.lv.inCore) why = `Der Hang liegt in der Kernzone des Problems ${name}: Die Stufe des Problems gilt.`;
        else {
          const parts = [];
          if (!Risk.levelAt(one, c.aspect, null).inCore) parts.push(`Exposition ${esc(aspectName(c.aspect))} liegt nicht in ${esc(p.aspects.map((k) => CFG.aspectDe[k]).join(', '))}`);
          if (!Risk.levelAt(one, null, c.elev).inCore) parts.push(`Höhe ${esc(U.fmt.m(c.elev))} liegt nicht ${esc(U.fmt.elevRange(p.elevMin, p.elevMax))}`);
          why = `Ausserhalb der Kernzone des Problems ${name} (${parts.join(', ')}): nächst tiefere Stufe (günstige Hanglage, Merkblatt).`;
        }
        if (c.aspect == null && p.aspects.length) why += ' Exposition unbestimmt: Kernzone vorsichtig angenommen.';
      }
      h += `<div class="vo-line">${lv(Math.min(5, c.lvl.level), c.lvl.sub)}<div class="grow"><div class="b">Am Hang: ${esc(Icons.levelLabel(c.lvl.level, c.lvl.sub))}</div><div class="card-sub">${why}</div></div></div>`;
      const g = c.lv.problem && M.problems[c.lv.problem.type];
      if (g && !manual) h += `<div class="row-wrap"><span class="badge ${g.grm.tone}">GRM bei ${esc(c.lv.problem.label)}: ${esc(g.grm.text)}</span></div>`;
    }
    return h;
  }
  function hangHtml(c) {
    if (st.busy) return Blocks.skel(4);
    const p = st.pt;
    if (!p) return Blocks.empty('Noch kein Hang gewählt. «Mein Standort» wählen oder einen Punkt auf der Karte setzen. Die Werte lassen sich unten auch von Hand eingeben.');
    const t = st.terrain;
    const meta = Blocks.meta;
    let h = `<div class="coord">${U.fmt.num(p.lat, 4)}° N, ${U.fmt.num(p.lon, 4)}° O</div>`;
    if (st.terrErr) h += Blocks.callout('warn', 'Geländedaten nicht verfügbar', `<p>${esc(st.terrErr)} Neigung, Exposition und Höhe unten von Hand eingeben.</p>${Blocks.retryBtn}`);
    else if (t) {
      const rad = c.g == null ? null : Risk.radiusFor(c.g);
      h += `<div class="meta">${meta('Höhe', U.fmt.m(t.elev))}${meta('Exposition', t.aspect == null ? 'unbestimmt' : `${aspectName(t.aspect)} (${U.fmt.deg(t.aspect)})`)}${meta('Neigung am Punkt', U.fmt.deg(t.slope))}${c.autoSlope != null && rad ? meta(`Steilste Stelle (${rad} m)`, fmtSlope(c.autoSlope)) : ''}</div>`;
    }
    return h + bulletinHtml(c);
  }

  /* ── Darstellung: Ergebnis ── */
  function resultHtml(c) {
    const missing = [c.g == null && 'Gefahrenstufe', c.slope == null && 'Neigung'].filter(Boolean);
    if (missing.length) {
      return `<div class="card">${Blocks.empty(`Für das Ergebnis fehlt noch: ${missing.join(' und ')}. ${c.g == null ? 'Die Gefahrenstufe kommt aus dem Bulletin oder wird unten gewählt.' : 'Die Neigung kommt aus der Karte oder wird unten eingestellt.'}`)}</div>`;
    }
    const warned = log.alarm.length > 0, zn = M.zones[c.zone];
    let lead = zn.lead;
    if (c.veryHigh) lead = M.levels[5].rec;
    else if (warned && c.zone === 0) lead = 'Gilt nur, wenn keine speziellen Gefahrenzeichen vorliegen. Hier wurden welche angekreuzt.';
    const row = (l, v) => `<tr><td class="muted">${l}</td><td class="num b">${v}</td></tr>`;
    let rows = row('Gefahrenstufe am Hang', esc(Icons.levelLabel(c.lvl.level, c.lvl.sub)) + (st.ov.lvl ? ' (von Hand)' : ''));
    rows += row('Massgebende Neigung', fmtSlope(c.slope));
    if (c.limits) rows += row('Grenzen bei dieser Stufe', `grün bis ${U.fmt.num(c.limits.lo, 1)}°, rot ab ${U.fmt.num(c.limits.hi, 1)}°`);
    if (c.area != null) rows += row('Massgebender Hangbereich', esc(M.areas[c.area].text));
    if (!c.veryHigh) rows += row('Risikowert (0–3)', U.fmt.num(c.r, 1));
    return `<div class="vo-result z-${c.zone}" role="status" aria-live="polite">
      <div class="vo-head"><div class="vo-kicker">Ergebnis nach GRM</div><div class="vo-zone">${esc(c.veryHigh ? 'Sehr gross: Verzicht' : zn.name)}</div></div>
      <div class="vo-body">
        ${warnHtml()}
        <div class="vo-lead">${esc(lead)}</div>
        ${zn.points.length && !c.veryHigh ? Blocks.bullets(zn.points) : ''}
        <table class="tbl vo-facts"><tbody>${rows}</tbody></table>
        <div class="card-sub">Die GRM beurteilt die Gefahr (Auslösewahrscheinlichkeit), nicht das Risiko. Konsequenzen (Hang über und unter mir, Geländefalle, mehrere Personen) gesondert beurteilen, siehe <a href="#wissen">Wissen</a>. Grenzen aus der Merkblatt-Grafik abgelesen (±0.5°).</div>
      </div></div>`;
  }

  function areasHtml(c) {
    const rows = M.areas.map((a, i) => `<tr${c.area === i ? ' class="on" aria-current="true"' : ''}><td>${esc(a.levels)}</td><td>${esc(a.text)}</td></tr>`).join('');
    return `<table class="tbl vo-areas"><thead><tr><th>Gefahrenstufe</th><th>Massgebender Hangbereich</th></tr></thead><tbody>${rows}</tbody></table>
      <div class="card-sub">${esc(M.grm.rules[4])}</div>`;
  }
  function drawChart(c) {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => Charts.grm(q('chart'), c.g != null && c.slope != null ? [{ g: c.g, steep: c.slope, label: 'Hang' }] : []));
  }

  /* ── Eingabefelder (einmal gebaut, dann nur synchronisiert) ── */
  const setNote = (k, key, auto, edited) => { q(k).innerHTML = `${edited ? '<span class="badge info">korrigiert</span> ' : ''}${auto}${edited ? ` <button class="btn btn-link" type="button" data-reset="${key}">Zurücksetzen</button>` : ''}`; };
  function syncInputs(c) {
    const t = st.terrain, ov = st.ov;
    // Neigung
    const sl = U.$('#vo-slope', root);
    sl.value = c.slope == null ? 35 : U.clamp(Math.round(c.slope), SLOPE_MIN, SLOPE_MAX);
    q('slopeV').textContent = c.slope == null ? 'bitte einstellen' : fmtSlope(c.slope);
    const rad = c.g == null ? null : Risk.radiusFor(c.g);
    setNote('slopeNote', 'slope', c.autoSlope != null ? `Vorgabe aus Gelände: ${fmtSlope(c.autoSlope)} (steilste Stelle im Umkreis ${rad ?? '–'} m)` : 'Keine Geländedaten: von Hand einstellen.', ov.slope != null);
    // Exposition
    const idx = c.aspect == null ? -1 : aspectIdx(c.aspect);
    U.$$('.rose-sector', root).forEach((el, i) => { el.classList.toggle('on', i === idx); el.setAttribute('aria-checked', i === idx); el.tabIndex = i === (idx < 0 ? 0 : idx) ? 0 : -1; });
    U.$$('.rose-label', root).forEach((el, i) => el.classList.toggle('on', i * 2 === idx));
    q('aspV').textContent = idx < 0 ? 'unbestimmt' : `${aspectName(c.aspect)}`;
    setNote('aspNote', 'aspect', t?.aspect != null ? `Vorgabe aus Gelände: ${aspectName(t.aspect)}` : t ? 'Gelände flacher als 0.5°: Exposition unbestimmt, bitte wählen.' : 'Himmelsrichtung, in die der Hang abfällt.', ov.aspect != null);
    // Höhe
    const el = U.$('#vo-elev', root);
    if (document.activeElement !== el) el.value = c.elev == null ? '' : Math.round(c.elev);
    setNote('elevNote', 'elev', t?.elev != null ? `Vorgabe aus Höhenmodell: ${U.fmt.m(t.elev)}` : 'Höhe über Meer, für die Kernzone des Bulletins.', ov.elev != null);
    // Gefahrenstufe
    const l = c.lvl;
    U.$$('[data-lvl]', root).forEach((b) => b.setAttribute('aria-checked', !!l && +b.dataset.lvl === l.level));
    U.$$('[data-sub]', root).forEach((b) => { b.setAttribute('aria-checked', !!l && b.dataset.sub === l.sub); b.disabled = !l || l.level > 4; });
    const auto = !ov.lvl && c.g != null;
    setNote('lvlNote', 'lvl', ov.lvl ? 'Von Hand gewählt. Ausserhalb der im Bulletin genannten Expositionen und Höhenlagen gilt in der Regel die nächst tiefere Stufe (Merkblatt).' : auto ? 'Vorgabe aus Bulletin, Exposition und Höhe (Kernzone des Lawinenproblems).' : 'Ohne Bulletin: Stufe von Hand wählen.', !!ov.lvl);
  }

  /* ── Gesamtaktualisierung ── */
  function update() {
    const c = calc();
    q('hang').innerHTML = hangHtml(c);
    q('result').innerHTML = resultHtml(c);
    q('areas').innerHTML = areasHtml(c);
    q('alarmWarn').innerHTML = warnHtml();
    syncInputs(c);
    drawChart(c);
    Icons.hydrate(root);
  }

  async function load(keep = false) {
    dirty = false;
    const my = ++seq, p = st.pt;
    if (!keep) st.ov = {};
    st.terrain = null; st.region = null; st.terrErr = st.bulErr = '';
    if (!p) { st.busy = false; update(); return; }
    st.busy = true; update();
    const [t, b] = await Promise.allSettled([Terrain.at(p.lat, p.lon), Bulletin.load()]);
    if (my !== seq) return;
    st.busy = false;
    if (t.status === 'fulfilled' && t.value.elev != null) st.terrain = t.value;
    else st.terrErr = t.status === 'fulfilled' ? 'Für diesen Punkt liegen keine Höhendaten vor.' : t.reason?.message || 'Unbekannter Fehler.';
    if (b.status === 'fulfilled') st.region = Bulletin.regionAt(p.lat, p.lon); else st.bulErr = b.reason?.message || 'Unbekannter Fehler.';
    update();
  }

  /* ── 3×3-Filter ── */
  const cellKey = (r, c) => `${r}-${c}`;
  function filterHtml() {
    const row = (r, i) => {
      const cells = COLS.map((name, c) => `<div class="vo-cell">
        <label class="vo-opt"><input type="checkbox" data-cell="${cellKey(i, c)}"><span class="b">${esc(name)}</span></label>
        ${Blocks.bullets(r.cells[c], { cls: 'vo-q' })}
        <textarea class="input vo-note" rows="2" data-note="${cellKey(i, c)}" placeholder="Notiz" aria-label="Notiz: ${esc(name)}, ${esc(r.name)}"></textarea></div>`).join('');
      const ask = r.ask ? Blocks.bullets(r.ask, { cls: 'vo-q' }) : '';
      return Blocks.fold(`${i + 1} · ${r.name}`, `<div class="card-sub">${esc(r.goal)}</div>${ask}${cells}${Blocks.callout('info', 'Entscheid', `<p>${esc(r.decision)}</p>`, 'route')}`,
        { open: i === 1, sub: r.decision.replace(/ \(.*/, ''), aux: `<span class="badge" data-rowbadge="${i}">0/${COLS.length}</span>` });
    };
    return `<div class="card stack-sm">
        <div class="row"><b class="grow" data-s="prog" aria-live="polite">0 von ${N_CELLS} geklärt</b><button class="btn btn-link" type="button" data-act="reset-filter">Zurücksetzen</button></div>
        <div class="vo-bar" role="presentation"><i data-s="bar"></i></div>
        <div class="card-sub">Haken = Feld geklärt. Haken und Notizen bleiben für heute auf diesem Gerät gespeichert. ${esc(M.filter.merke)}</div>
      </div>${ROWS.map(row).join('')}<div class="card-sub">${esc(M.filter.reflection)}</div>`;
  }
  function syncLog() {
    U.$$('[data-cell]', root).forEach((i) => { i.checked = !!log.cells[i.dataset.cell]?.ok; });
    U.$$('[data-note]', root).forEach((i) => { if (document.activeElement !== i) i.value = log.cells[i.dataset.note]?.note || ''; });
    U.$$('[data-alarm]', root).forEach((i) => { i.checked = log.alarm.includes(i.dataset.alarm); });
    let n = 0;
    ROWS.forEach((r, ri) => {
      const k = COLS.filter((_, c) => log.cells[cellKey(ri, c)]?.ok).length;
      n += k;
      const b = U.$(`[data-rowbadge="${ri}"]`, root);
      b.textContent = `${k}/${COLS.length}`;
      b.className = 'badge' + (k === COLS.length ? ' ok' : '');
    });
    q('prog').textContent = `${n} von ${N_CELLS} geklärt`;
    q('bar').style.width = `${(n / N_CELLS) * 100}%`;
    const na = log.alarm.length;
    const ab = q('alarmCount');
    ab.textContent = na ? `${na} angekreuzt` : 'keines';
    ab.className = 'badge' + (log.alarm.some((id) => M.alarm.some((a) => a.id === id)) ? ' err' : na ? ' warn' : '');
  }
  const cell = (k) => (log.cells[k] = log.cells[k] || { ok: false, note: '' });

  /* ── Aufbau ── */
  const checks = (list, cls) => `<ul class="list">${list.map((a) => `<li><label class="vo-opt ${cls}"><input type="checkbox" data-alarm="${a.id}"><span>${esc(a.text)}</span></label></li>`).join('')}</ul>`;
  function layout() {
    const sub = (id, label, inner) => `<div class="field"><div class="field-label" id="${id}">${label}</div>${inner}</div>`;
    const lvlBtns = LEVELS.map((l) => `<button type="button" role="radio" aria-checked="false" data-lvl="${l}">${esc(CFG.levels[l].name)}</button>`).join('');
    const subBtns = Object.keys(SUB_D).map((k) => `<button type="button" role="radio" aria-checked="false" data-sub="${k}" aria-label="${{ minus: 'untere', neutral: 'mittlere', plus: 'obere' }[k]} Unterstufe">${CFG.subLabel[k]}</button>`).join('');
    const m = M.measures, ac = M.accident;
    return `
      <div class="stack-sm"><h2 class="panel-title">Vor Ort</h2><div class="coord">Beurteilung im Gelände nach dem Merkblatt «Achtung Lawinen!». Ersetzt die eigene Beurteilung nicht.</div></div>

      <h3 class="section-title">Einzelhang</h3>
      <div class="card stack">
        <div class="vo-pick"><button class="btn btn-primary btn-lg" type="button" data-act="locate"><span class="ic" data-icon="locate"></span>Mein Standort</button><div class="card-sub">oder Punkt auf der Karte antippen</div></div>
        <div class="stack-sm" data-s="hang"></div>
      </div>
      <div data-s="result"></div>

      <div class="card stack">
        <div><div class="card-title">Werte anpassen</div><div class="card-sub">Vorgaben stammen aus Karte und Bulletin. Korrigieren, wenn der Hang vor Ort anders aussieht.</div></div>
        <div class="field slider">
          <div class="slider-head"><label class="field-label" for="vo-slope">Neigung der steilsten Stelle (ca. 20 m × 20 m)</label><span class="v" data-s="slopeV"></span></div>
          <input type="range" id="vo-slope" min="${SLOPE_MIN}" max="${SLOPE_MAX}" step="1" value="35">
          <div class="vo-hint" data-s="slopeNote"></div>
        </div>
        ${sub('vo-asp', 'Exposition (Hang fällt ab nach …)', `<div class="vo-aspect"><div data-s="rose" class="vo-rose"></div><div class="grow"><div class="t-h3 b" data-s="aspV"></div><div class="vo-hint" data-s="aspNote"></div></div></div>`)}
        <div class="field"><label class="field-label" for="vo-elev">Höhe (m ü. M.)</label><input class="input" id="vo-elev" type="number" inputmode="numeric" min="0" max="5000" step="10"><div class="vo-hint" data-s="elevNote"></div></div>
        ${sub('vo-lvl', 'Gefahrenstufe am Hang', `<div class="seg vo-seg" role="radiogroup" aria-labelledby="vo-lvl">${lvlBtns}</div><div class="seg vo-seg" role="radiogroup" aria-label="Unterstufe">${subBtns}</div><div class="vo-hint" data-s="lvlNote"></div>`)}
      </div>

      <div class="card stack-sm">
        <div class="card-title">GRM-Grafik</div>
        <div class="card-sub">Der Hang als Punkt in der Grafischen Reduktionsmethode.</div>
        <div data-s="chart"></div>
        <div data-s="areas"></div>
      </div>

      <h3 class="section-title">Alarmzeichen</h3>
      <div class="card stack-sm">
        <div class="row"><div class="card-title grow">Alarmzeichen</div><span class="badge" data-s="alarmCount">keines</span></div>
        <div class="card-sub">Beobachtet? Ankreuzen. Sofort sichtbar in der Beurteilung.</div>
        ${checks(M.alarm, 'alarm')}
        <div class="card-title">Einfache Beobachtungen, die auf einen Anstieg der Lawinengefahr hinweisen</div>
        ${checks(M.rises, '')}
        <div data-s="alarmWarn"></div>
        ${Blocks.bullets(M.observe, { cls: 'vo-q' })}
        <button class="btn btn-outlined btn-sm" type="button" data-act="reset-alarm">Alle abwählen</button>
      </div>

      <h3 class="section-title">3×3-Filter</h3>
      ${filterHtml()}

      <h3 class="section-title">Verhalten und Massnahmen</h3>
      ${Blocks.fold('Generelle Massnahmen', Blocks.bullets(m.general) + Blocks.callout('info', '', `<p>${esc(m.danger)}</p>`), { open: true })}
      ${Blocks.fold('Wirkungsvolle Massnahmen', Blocks.bullets(m.effective) + `<div class="card-sub">${esc(m.effectiveNote)}</div>`)}
      ${Blocks.fold('Ausrüstung', Blocks.bullets(m.gear, { title: 'Notfallausrüstung' }) + `<div class="card-sub">${esc(m.gearNote)}</div>` + Blocks.bullets(m.gearMore, { title: 'Weitere wichtige Ausrüstung' }))}
      ${Blocks.fold('Lawinenunfall', Blocks.callout('err', 'Kameradenrettung hat höchste Priorität', `<p>${esc(ac.lead)}</p>`)
        + `<table class="tbl vo-facts"><tbody>${ac.alarm.map(([a, b]) => `<tr><td class="muted">${esc(a)}</td><td class="num b">${esc(b)}</td></tr>`).join('')}</tbody></table><div class="card-sub">${esc(ac.alarmNote)}</div>`
        + ac.groups.map((g) => Blocks.bullets(g.items, { title: g.name })).join('') + Blocks.bullets(ac.report, { title: 'Unfallmeldung (die 6 W)' }))}
      <div class="card-sub">Quelle: ${esc(M.source)}</div>`;
  }

  function wire() {
    // Expositionsrose: Sektoren des Icons anklickbar machen (Radiogruppe)
    const rose = q('rose');
    rose.innerHTML = Icons.rose([], 144);
    const svg = U.$('svg', rose), sectors = U.$$('.rose-sector', rose);
    svg.setAttribute('role', 'radiogroup'); svg.setAttribute('aria-labelledby', 'vo-asp'); svg.classList.add('rose-pick');
    sectors.forEach((s, i) => { s.setAttribute('role', 'radio'); s.setAttribute('aria-label', `Exposition ${CFG.aspectDe[CFG.aspects8[i]]}`); s.dataset.i = i; });
    const pick = (i) => { st.ov.aspect = ((i + 8) % 8) * 45; update(); const s = U.$$('.rose-sector', root)[(i + 8) % 8]; if (s) s.focus(); };
    rose.addEventListener('click', (e) => { const s = e.target.closest('.rose-sector'); if (s) pick(+s.dataset.i); });
    rose.addEventListener('keydown', (e) => {
      const s = e.target.closest('.rose-sector');
      if (!s) return;
      const i = +s.dataset.i, d = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
      if (d) { e.preventDefault(); pick(i + d); } else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(i); }
    });

    root.addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b || !root.contains(b)) return;
      const d = b.dataset;
      if (d.act === 'locate') MapView.locate();
      else if (d.act === 'retry') load(true);
      else if (d.reset) { delete st.ov[d.reset]; update(); }
      else if (d.lvl) { st.ov.lvl = { level: +d.lvl, sub: calc().lvl?.sub || 'neutral' }; update(); }
      else if (d.sub) { const l = calc().lvl; if (l) { st.ov.lvl = { level: l.level, sub: d.sub }; update(); } }
      else if (d.act === 'reset-alarm') { log.alarm = []; saveLog(); syncLog(); update(); }
      else if (d.act === 'reset-filter') { if (window.confirm('Alle Haken und Notizen des 3×3-Filters von heute löschen?')) { log.cells = {}; saveLog(); syncLog(); } }
    });
    root.addEventListener('input', (e) => {
      const t = e.target;
      if (t.id === 'vo-slope') { st.ov.slope = +t.value; update(); }
      else if (t.id === 'vo-elev') { if (t.value === '') delete st.ov.elev; else st.ov.elev = U.clamp(+t.value, 0, 5000); update(); }
      else if (t.dataset.note) { cell(t.dataset.note).note = t.value; saveLog(); }
    });
    root.addEventListener('change', (e) => {
      const t = e.target;
      if (t.dataset.cell) { cell(t.dataset.cell).ok = t.checked; saveLog(); syncLog(); }
      else if (t.dataset.alarm) { log.alarm = t.checked ? [...new Set([...log.alarm, t.dataset.alarm])] : log.alarm.filter((x) => x !== t.dataset.alarm); saveLog(); syncLog(); update(); }
    });
  }

  function mount(el) {
    root = el;
    const saved = U.store.get('point', null);
    if (saved && Number.isFinite(saved.lat)) st.pt = { lat: saved.lat, lon: saved.lon };
    log = readLog();
    root.innerHTML = layout();
    Icons.hydrate(root);
    wire();
    syncLog();
    U.bus.on('point', (p) => { st.pt = { lat: p.lat, lon: p.lon }; dirty = true; if (visible) load(); });
  }
  function show() {
    visible = true;
    if (log.day !== U.zurichDay()) { log = freshLog(); syncLog(); }
    if (dirty) load(); else update();
  }
  const hide = () => { visible = false; };

  return { mount, show, hide };
})();

/* ── 64-panel-wissen.js ── */
/* ══════════════════════════ 64 · Panel «Wissen» ══════════════════════════
   Kompaktes Lernmaterial: Inhalte aus dem Merkblatt «Achtung Lawinen!» (Merkblatt-Modul), Zahlen der Methode
   aus CFG/Risk (nie doppelt geschrieben). Abschnitte, die nicht aus dem Merkblatt stammen, sind als
   «Eigene Planungshilfe» gekennzeichnet. */
const PanelWissen = (() => {
  const M = Merkblatt, esc = U.esc, p = (t) => `<p>${esc(t)}</p>`;
  const G = CFG.grm;
  let root = null;

  /* ── Gefahrenstufen ── */
  function levelsHtml() {
    return [1, 2, 3, 4, 5].map((l) => {
      const d = M.levels[l];

        <div class="danger-head">${Icons.danger(l)}<div class="grow"><div class="danger-word">${esc(Icons.levelName(l))}</div><div class="vo-dsub">${esc(d.title)}</div></div></div>
        <div class="vo-dbody"><div class="prose">${p(d.desc)}</div>
          <div><div class="field-label">Empfehlung</div><div class="prose">${p(d.rec)}</div></div>
          <div class="card-sub">${esc(d.freq)}</div></div></div>`;
    }).join('') + `<div class="card-sub">Empfehlungen für Personen ausserhalb gesicherter Gebiete. ${esc(M.grm.gradient)}</div>`;
  }

  /* ── Lawinenprobleme ── */
  function problemHtml(type) {
    const d = M.problems[type];
    const how = [d.action && ['Vorgehen', d.action], d.duration && ['Dauer', d.duration]].filter(Boolean).map(([l, v]) => Blocks.meta(l, v)).join('');
    const more = [d.spread && Blocks.bullets(d.spread, { title: 'Typische Verbreitung' }), d.extra && Blocks.bullets(d.extra, { title: 'Wichtig zu wissen' }), d.merke && Blocks.callout('info', '', p(d.merke))].filter(Boolean).join('');
    return `<div class="problem-card">
      <div class="pc-body">${Icons.problem(type)}<div class="grow"><div class="pc-name">${esc(CFG.problems[type])}</div><div class="row-wrap vo-gap"><span class="badge ${d.grm.tone}">GRM: ${esc(d.grm.text)}</span></div></div></div>
      <div class="vo-pbody">
        ${how ? `<div class="meta">${how}</div>` : ''}
        <div class="prose">${p(d.what)}</div>
        ${Blocks.bullets(d.signs, { title: 'Typische Anzeichen' })}
        ${Blocks.bullets(d.hint, { title: 'Hinweis' })}
        <details class="more"><summary>Mehr</summary><div class="stack-sm">${more}</div></details>
      </div></div>`;
  }
  const problemsHtml = () => ['new_snow', 'wind_slab', 'persistent_weak_layers', 'wet_snow', 'gliding_snow'].map(problemHtml).join('')
    + `<div class="problem-card"><div class="pc-body">${Icons.problem('favourable_situation')}<div class="grow"><div class="pc-name">Günstige Situation</div></div></div>
      <div class="vo-pbody"><div class="prose">${p(M.favourable.ask)}</div>${Blocks.bullets(M.favourable.cases)}${Blocks.callout('info', '', p(M.favourable.merke))}</div></div>`
    + `<div class="card-sub">GRM-Spalte: ${esc(M.source)}. «Typische Lawinenprobleme».</div>`;

  /* ── Lawinenbildung und Gelände ── */
  const terrainHtml = () => {
    const t = M.terrain;
    return `<div class="prose">${p(M.slab.lead)}</div>${Blocks.bullets(M.slab.needs, { title: 'Notwendige Bedingungen für Schneebrettlawinen' })}${Blocks.bullets(M.slab.other, { title: 'Weitere Lawinenarten' })}
      ${Blocks.bullets(t.slope, { title: 'Hangneigung' })}${Blocks.bullets(t.classes, { title: 'Hangneigungsklassen' })}${Blocks.bullets(t.estimate, { title: 'Schätzhilfen zur Steilheit' })}
      ${Blocks.bullets(t.aspect, { title: 'Hanglage und Geländeform' })}${Blocks.bullets(t.size, { title: 'Hanggrösse, Geländefallen' })}${Blocks.callout('info', '', p(t.typical))}
      ${Blocks.bullets(M.snowpack, { title: 'Beurteilung des Schneedeckenaufbaus' })}${Blocks.bullets(M.rules, { title: 'Einfache Faustregeln' })}`;
  };

  /* ── GRM erklärt ── */
  function grmHtml() {
    const zone = (z, i) => `<div class="vo-zoneitem"><span class="dot" style="--c:${CFG.risk[i].color}"></span><div class="grow"><div class="b">${esc(z.name)}: ${esc(z.lead)}</div>${z.points.length ? Blocks.bullets(z.points) : ''}</div></div>`;
    const lim = [1, 2, 3, 4].map((l) => { const x = Risk.limits(l); return `<tr><td>${esc(Icons.levelName(l))}</td><td class="num">${U.fmt.num(x.lo, 1)}°</td><td class="num">${U.fmt.num(x.hi, 1)}°</td></tr>`; }).join('');
    const areas = M.areas.map((a) => `<tr><td>${esc(a.levels)}</td><td>${esc(a.text)}</td></tr>`).join('');
    return `<div class="prose">${p(M.grm.intro)}</div>
      <div data-s="chart"></div>
      <div class="stack-sm">${M.zones.map(zone).join('')}</div>
      ${Blocks.bullets(M.grm.rules, { title: 'Regeln' })}
      <table class="tbl"><thead><tr><th>Gefahrenstufe</th><th>Massgebender Hangbereich</th></tr></thead><tbody>${areas}</tbody></table>
      <div><div class="field-label">Grenzen in der Grafik (Neigung der steilsten Stelle)</div>

  /* ── Entscheiden: Planung, RiskCheck, Faktor Mensch ── */
  function decideHtml() {
    const r = M.riskCheck, h = M.human, pl = M.planning;

      'Die GRM ist eine grobe Beurteilung der Auslösewahrscheinlichkeit (Gefahr). Konsequenzen und Faktor Mensch kommen hinzu (Merkblatt).',
      'Das Bulletin beschreibt eine Region, nicht den Einzelhang; die Übergänge sind fliessend (Merkblatt). Es erscheint um 17 und 8 Uhr (Merkblatt) und kann bei Wetteränderungen überholt sein.',
      `Kartendaten: Die Hangneigungskarte von swisstopo unterscheidet Klassen von 5° (verwendet wird die Klassenmitte, Abweichung bis ±2.5°), Pixel ca. ${m(CFG.slopeZoom)} m. Das Höhenmodell ist grob (ca. ${m(CFG.demZoom)} m pro Pixel): Höhe und Exposition am Punkt können abweichen.`,
      `Linien: SAC-Routen sind als Linie gezeichnet und ungenau. Das Tool toleriert ±${G.radiusM[0].m} m im Bereich der Spur. Eigene Spur und Hang vor Ort können abweichen.`,
      'Wald wird nicht berücksichtigt. Lichter Wald schützt nicht vor Lawinen (Merkblatt).',
      'Zeitlicher Verlauf wird nicht berücksichtigt, z. B. der Tagesgang im Frühling (Merkblatt). Schlechte Sicht erschwert die Beurteilung stark (Merkblatt).',
      'Nicht bewertet: Absturzgefahr, Gletscher, Wechten und andere Gefahren; Gleitschnee.',
    ]);
  }

  /* ── Datenquellen und Haftung ── */
  const sourcesHtml = () => Blocks.bullets([...CFG.attribution.split(' · '), `Skirouten: SAC/swisstopo (Kartenebene)`, `Methode: ${CFG.grm.source}`, `Lerninhalte: ${M.source}, Herausgeber Kern-Ausbildungsteam «Lawinenprävention Schneesport» (www.slf.ch/kat)`])
    + `<div class="card-sub">Amtliche Lawinenbulletins: <a href="${esc(CFG.url.slfBulletinPage)}" target="_blank" rel="noopener">whiterisk.ch</a>.</div>`;

  function build() {
    root.innerHTML = `<div class="stack-sm"><h2 class="panel-title">Wissen</h2><div class="coord">Kompaktes Lernmaterial nach dem Merkblatt «Achtung Lawinen!» (SLF/KAT 2022).</div></div>
      ${Blocks.callout('err', 'Planungshilfe, keine Beurteilung', `<p>Der Skitourenplaner ist eine Planungshilfe. Er ersetzt weder Ausbildung noch die eigene Beurteilung vor Ort. Karten, Bulletin und Höhenmodell können Fehler enthalten oder veraltet sein. Für Richtigkeit und Vollständigkeit gibt es keine Gewähr; die Verantwortung für jeden Entscheid liegt bei den Tourengängerinnen und Tourengängern. Das Merkblatt dient der Lawinenausbildung und ist nicht vollständig selbsterklärend.</p>`)}
      ${Blocks.fold('Gefahrenstufen', levelsHtml(), { open: true, sub: 'Lawinengefahrenskala (Kurzfassung)' })}
      ${Blocks.fold('Lawinenprobleme', problemsHtml(), { sub: 'Anzeichen, Verhalten, GRM-Nützlichkeit' })}
      ${Blocks.fold('Lawinenbildung und Gelände', terrainHtml(), { sub: 'Schneebrett, Hangneigung, Hanglage' })}
      ${Blocks.fold('Grafische Reduktionsmethode (GRM)', grmHtml(), { sub: 'Gefahrenstufe, Neigung, Hanglage' })}
      ${Blocks.fold('Planen und Entscheiden', decideHtml(), { sub: 'Tourenplanung, RiskCheck, Faktor Mensch' })}
      ${Blocks.fold('So rechnet dieses Tool', methodHtml(), { sub: 'Risikowert, Routenwert, Gehzeit' })}
      ${Blocks.fold('Grenzen der Methode', limitsHtml(), { sub: 'Was das Tool nicht weiss' })}
      ${Blocks.fold('Datenquellen und Lizenzen', sourcesHtml())}`;
    Icons.hydrate(root);
    Charts.grm(U.$('[data-s="chart"]', root), []);
  }

  const mount = (el) => { root = el; build(); };
  const show = () => {};
  return { mount, show };
})();

/* ── 90-main.js ── */
/* ══════════════════════════ 90 · Start ══════════════════════════ */
(() => {
  // Farben aus CFG als CSS-Variablen (Gefahrenstufen, Risikozonen): styles.css enthält sie nicht doppelt
  const rootStyle = document.documentElement.style;
  Object.keys(CFG.levels).forEach((l) => rootStyle.setProperty(l === '0' ? '--nolevel' : `--lv${l}`, CFG.levels[l].color));
  CFG.risk.forEach((r, i) => rootStyle.setProperty(`--risk${i}`, r.color));

  Icons.hydrate();
  MapView.init(U.$('#map'));

  // Panels: nur mounten, wenn das Modul existiert
  const PANELS = {
    lage: PanelLage,
    touren: typeof PanelTouren !== 'undefined' ? PanelTouren : null,
    planen: typeof PanelPlan !== 'undefined' ? PanelPlan : null,
    vorort: typeof PanelVorOrt !== 'undefined' ? PanelVorOrt : null,
    wissen: typeof PanelWissen !== 'undefined' ? PanelWissen : null,
  };
  const TITLES = { lage: 'Lage', touren: 'Touren', planen: 'Planen', vorort: 'Vor Ort', wissen: 'Wissen' };
  const pages = {};
  U.$$('.panel-page').forEach((el) => {
    const name = el.dataset.panel;
    pages[name] = el;
    const mod = PANELS[name];
    if (mod) mod.mount(el);
    else el.innerHTML = `<div class="card"><div class="card-title">${TITLES[name]}</div><div class="card-sub">Dieser Bereich folgt.</div></div>`;
  });

  // Zuletzt gewählter Punkt wieder markieren (die Panels laden ihn selbst aus dem Speicher)
  const lastPoint = U.store.get('point', null);
  if (lastPoint && Number.isFinite(lastPoint.lat)) U.bus.emit('point', lastPoint);

  let current = null;
  function setTab(name) {
    if (!pages[name]) name = 'lage';
    if (name === current) return;
    if (current && PANELS[current] && PANELS[current].hide) PANELS[current].hide();
    current = name;
    U.store.set('tab', name);
    U.$$('.tab').forEach((a) => (a.dataset.tab === name ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current')));
    Object.entries(pages).forEach(([n, el]) => { el.hidden = n !== name; });
    U.$('#panel').scrollTop = 0;
    const active = U.$(`.tab[data-tab="${name}"]`);
    if (active && active.scrollIntoView) active.scrollIntoView({ inline: 'center', block: 'nearest' });
    if (PANELS[name]) PANELS[name].show();
    document.title = `${TITLES[name]} – Skitourenplaner`;
  }
  U.bus.on('tab', setTab);
  window.addEventListener('hashchange', () => { const n = location.hash.slice(1); if (pages[n]) U.bus.emit('tab', n); });
  const first = location.hash.slice(1);
  setTab(pages[first] ? first : U.store.get('tab', 'lage'));

  // Hintergrund: Messstationen vorladen (Panel und Ebene nutzen den Cache)
  Stations.load().catch((e) => MapView.toast(e.message, { error: true }));
})();
</script>
</body>
</html>
