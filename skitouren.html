<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skitourenplaner</title>
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
/* ══════════ Design-Tokens (gemessen an White Risk, siehe design/TOKENS.md) ══════════
   Gefahrenstufen (--lv1…5) und Risikofarben (--risk0…2) setzt 90-main aus CFG; hier stehen sie nicht. */
:root {
  --font: "Inter", "Helvetica Neue", Helvetica, sans-serif;
  --text: #262626; --text-muted: #737373; --text-subtle: #525252;
  --bg: #f5f5f5; --surface: #ffffff; --surface-active: #e5e5e5; --border: #e5e5e5;
  --primary: #1b5c85; --primary-hover: #1b5071; --primary-soft: #c4e1f3; --primary-soft-hover: #91c9e8; --primary-tint: #e5f0f9;
  --on-primary: #ffffff;
  --error: #b91c1c; --success: #15803d; --warning: #b45309; --inverted: #404040;
  --nolevel: #b4b4b4;
  --icon-gray: #8a8a8a; --icon-gray-soft: #e5e5e5;
  --chart-area: #e5e5e5; --chart-line: #262626; --chart-grid: #e5e5e5; --chart-none: #ededed;
  --r-card: 16px; --r-ctl: 8px; --r-pill: 48px; --r-nav: 9px;
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 40px; --sp-7: 80px;
  --shadow-float: 0 -2px 0 rgba(0, 0, 0, .02), 0 2px 4px rgba(0, 0, 0, .2);
  --head-h: 64px; --panel-w: 464px;
}

/* ══════════ Basis ══════════ */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 400 16px/24px var(--font); -webkit-font-smoothing: antialiased; text-size-adjust: 100%;
  overflow: hidden;
}
h1, h2, h3, h4, p, ul, ol { margin: 0; padding: 0; }
ul, ol { list-style: none; }
a { color: var(--primary); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.ic, .ic svg { display: inline-flex; width: 16px; height: 16px; flex: none; }
.ic svg, .icon { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Typo-Skala */
.t-xs { font-size: 12px; line-height: 16px; }
.t-sm { font-size: 14px; line-height: 20px; }
.t-md { font-size: 16px; line-height: 24px; }
.t-lg { font-size: 18px; line-height: 26px; }
.t-h3 { font-size: 22px; line-height: 28px; }
.t-xl { font-size: 26px; line-height: 32px; }
.b { font-weight: 600; }
.muted { color: var(--text-muted); }
.subtle { color: var(--text-subtle); }

/* ══════════ Layout ══════════ */
.app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; background: var(--bg); }
.topbar {
  flex: none; display: flex; align-items: stretch; justify-content: space-between;
  min-height: var(--head-h); background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 16px; position: relative; z-index: 1100;
}
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--text); border-radius: var(--r-ctl); }
.brand-mark { width: 32px; height: 32px; }
.bm-back { fill: var(--primary-soft); }
.bm-front { fill: var(--primary); }
.bm-snow { fill: var(--surface); }
.brand-name { font-size: 20px; line-height: 28px; font-weight: 600; letter-spacing: -.01em; }
.tabs { display: flex; align-items: stretch; gap: 4px; }
.tab {
  position: relative; display: inline-flex; align-items: center; gap: 8px; padding: 0 16px; text-decoration: none; white-space: nowrap;
  font-size: 14px; line-height: 20px; font-weight: 600; color: var(--text-muted);
}
.tab:hover { color: var(--text); }
.tab[aria-current="page"] { color: var(--primary); }
.tab[aria-current="page"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--primary); }
.tab:focus-visible { outline-offset: -2px; border-radius: var(--r-nav); }
.tab .ic, .tab .ic svg { width: 20px; height: 20px; }

.main { flex: 1; min-height: 0; display: flex; }
.map-wrap { position: relative; flex: 1; min-width: 0; background: #e9ecef; }
.map { position: absolute; inset: 0; background: #e9ecef; font-family: var(--font); }
.panel { flex: none; width: var(--panel-w); background: var(--bg); border-left: 1px solid var(--border); overflow-y: auto; padding: 0 24px; scrollbar-width: thin; }
.panel-page { padding: 24px 0 40px; display: flex; flex-direction: column; gap: 16px; }

/* ══════════ Karten (Cards) ══════════ */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-card); padding: 16px; }
.card.flat-pad { padding: 0; }
.card.float, .float { box-shadow: var(--shadow-float); }
.card-title { font-size: 16px; line-height: 24px; font-weight: 600; }
.card-sub { font-size: 14px; line-height: 20px; color: var(--text-muted); }
.section-title { font-size: 18px; line-height: 26px; font-weight: 600; margin-top: 8px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.stack-sm { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; align-items: center; gap: 8px; }
.row-wrap { display: flex; flex-wrap: wrap; gap: 8px; }
.grow { flex: 1; min-width: 0; }

/* Schwebende Elemente über der Karte */
.float-tl { position: absolute; z-index: 1000; top: 16px; left: 16px; width: min(420px, calc(100% - 32px - 56px)); display: flex; flex-direction: column; gap: 8px; }
.float-tr { position: absolute; z-index: 1000; top: 16px; right: 16px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.float-br { position: absolute; z-index: 1000; right: 16px; bottom: 32px; display: flex; flex-direction: column; gap: 8px; }
.zoom-group { display: flex; flex-direction: column; background: var(--surface); border-radius: var(--r-ctl); box-shadow: var(--shadow-float); }
.zoom-group .btn-float { box-shadow: none; }
.zoom-group .btn-float + .btn-float { border-top: 1px solid var(--border); border-radius: 0 0 var(--r-ctl) var(--r-ctl); }
.zoom-group .btn-float:first-child { border-radius: var(--r-ctl) var(--r-ctl) 0 0; }

.search { position: relative; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 16px; height: 48px; }
.search-ic, .search-ic svg { color: var(--text-muted); }
.search-input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; font-size: 16px; }
.search-input::placeholder { color: var(--text-muted); }
.search:focus-within { border-color: var(--primary); }
.search-input::-webkit-search-cancel-button { display: none; }
.search-results {
  position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-card); box-shadow: var(--shadow-float); padding: 8px; max-height: 320px; overflow-y: auto; z-index: 2;
}
.search-results li { padding: 8px 12px; border-radius: var(--r-ctl); cursor: pointer; font-size: 14px; line-height: 20px; }
.search-results li:hover, .search-results li[aria-selected="true"] { background: var(--primary-tint); color: var(--primary); }
.search-results li.empty { color: var(--text-muted); cursor: default; }
.search-results li.empty:hover { background: transparent; color: var(--text-muted); }

.legend { padding: 14px 16px 12px; }
.legend-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.legend-title { font-size: 16px; line-height: 24px; font-weight: 600; }
.legend-sub { font-size: 14px; line-height: 20px; color: var(--text-muted); }
.legend-bar { display: flex; margin-top: 12px; }
.legend-seg { flex: 1; text-align: center; font-size: 12px; line-height: 16px; color: var(--text-muted); }
.legend-seg::before { content: ""; display: block; height: 8px; background: var(--lc); margin-bottom: 4px; }
.legend.collapsed .legend-bar { display: none; }
.legend.collapsed #legend-toggle .ic { transform: rotate(180deg); }
.legend-note { margin-top: 8px; font-size: 12px; line-height: 16px; color: var(--text-muted); }

.layers-card { width: 272px; padding: 8px 0; max-height: calc(100% - 140px); overflow-y: auto; }
.layers-title { padding: 8px 16px 4px; font-size: 12px; line-height: 16px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; }
.layers-group { display: flex; flex-direction: column; padding: 0 8px 8px; }
.layers-opt { display: flex; align-items: center; gap: 12px; min-height: 36px; padding: 0 8px; border-radius: var(--r-ctl); font-size: 14px; line-height: 20px; cursor: pointer; }
.layers-opt:hover { background: var(--bg); }
.layers-opt input { width: 16px; height: 16px; margin: 0; accent-color: var(--primary); flex: none; }
.layers-opt small { display: block; font-size: 12px; line-height: 16px; color: var(--text-muted); }

/* ══════════ Buttons ══════════ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 12px; border-radius: var(--r-ctl);
  border: 1px solid transparent; background: transparent; font-size: 14px; line-height: 20px; font-weight: 600; text-decoration: none; white-space: nowrap;
  transition: background-color .12s, color .12s;
}
.btn-sm { height: 32px; } .btn-lg { height: 48px; padding: 0 16px; }
.btn-primary { background: var(--primary); color: var(--on-primary); }
.btn-primary:hover { background: var(--primary-hover); }
.btn-secondary { background: var(--primary-soft); color: var(--primary-hover); }
.btn-secondary:hover { background: var(--primary-soft-hover); }
.btn-outlined { background: var(--surface); color: var(--text-muted); border-color: var(--border); }
.btn-outlined:hover { background: var(--surface-active); color: var(--text); }
.btn-link { color: var(--primary); padding: 0 4px; height: auto; background: none; }
.btn-link:hover { text-decoration: underline; }
.btn:disabled, .btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
.btn-icon { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; padding: 0; border: 0; border-radius: var(--r-ctl); background: transparent; color: var(--text); flex: none; }
.btn-icon .ic, .btn-icon .ic svg, .btn-icon > span { width: 20px; height: 20px; display: inline-flex; }
.btn-icon svg { width: 20px; height: 20px; }
.btn-bare { color: var(--text-muted); }
.btn-bare:hover { background: var(--bg); color: var(--text); }
.btn-float { background: var(--surface); box-shadow: var(--shadow-float); color: var(--text); }
.btn-float:hover { background: var(--bg); }
.legend .btn-icon { width: 32px; height: 32px; border: 1px solid var(--border); background: var(--surface); }
.legend .btn-icon svg { width: 16px; height: 16px; }

/* ══════════ Chips, Badges, Meta ══════════ */
.chip { display: inline-flex; align-items: center; gap: 4px; height: 32px; padding: 0 12px; border-radius: var(--r-pill); border: 1px solid var(--border); background: var(--surface); color: var(--text-muted); font-size: 14px; line-height: 20px; }
button.chip:hover { background: var(--surface-active); color: var(--text); }
.chip[aria-pressed="true"], .chip.active { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.badge { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: var(--r-pill); font-size: 12px; line-height: 16px; font-weight: 600; background: var(--surface-active); color: var(--text-subtle); }
.badge.ok { background: color-mix(in srgb, var(--success) 14%, #fff); color: var(--success); }
.badge.warn { background: color-mix(in srgb, var(--warning) 14%, #fff); color: var(--warning); }
.badge.err { background: color-mix(in srgb, var(--error) 14%, #fff); color: var(--error); }
.badge.info { background: var(--primary-tint); color: var(--primary); }
.meta { display: flex; flex-wrap: wrap; gap: 4px 16px; }
.meta-item .l { font-size: 12px; line-height: 16px; color: var(--text-muted); }
.meta-item .v { font-size: 14px; line-height: 20px; font-weight: 600; }
.panel-title { font-size: 22px; line-height: 28px; font-weight: 600; }
.coord { font-size: 14px; line-height: 20px; color: var(--text-muted); }

/* ══════════ Gefahrenstufen-Karte, Problem-Karte ══════════ */
.lv-1 { --lc: var(--lv1); --lt: #000; --lb: rgba(0, 0, 0, .1); }
.lv-2 { --lc: var(--lv2); --lt: #000; --lb: rgba(0, 0, 0, .1); }
.lv-3 { --lc: var(--lv3); --lt: #000; --lb: rgba(0, 0, 0, .1); }
.lv-4 { --lc: var(--lv4); --lt: #fff; --lb: rgba(255, 255, 255, .2); }
.lv-5 { --lc: var(--lv5); --lt: #fff; --lb: rgba(255, 255, 255, .2); }
.lv-0 { --lc: var(--nolevel); --lt: #000; --lb: rgba(0, 0, 0, .1); }
.danger-card { border: 2px solid var(--lc); border-radius: var(--r-card); overflow: hidden; background: var(--surface); }
.danger-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px; background: var(--lc); color: var(--lt); }
.danger-word { font-size: 26px; line-height: 32px; font-weight: 600; }
.ic-danger { width: 40px; height: 40px; flex: none; }
.ic-danger rect { fill: var(--lb); }
.ic-danger text { fill: var(--lt); font: 600 18px/26px var(--font); }
.ic-danger.small { width: 24px; height: 24px; }
.ic-danger.small text { font-size: 18px; }
.problem-card { border: 1px solid var(--border); border-radius: var(--r-card); background: var(--surface); overflow: hidden; }
.problem-card.lv-1, .problem-card.lv-2, .problem-card.lv-3, .problem-card.lv-4, .problem-card.lv-5 { border: 2px solid var(--lc); }
.pc-head { padding: 9px 16px; background: var(--lc); color: var(--lt); font-size: 14px; line-height: 20px; font-weight: 600; }
.pc-where { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
.pc-where .val { flex: 1; font-size: 14px; line-height: 20px; font-weight: 600; }
.pc-body { display: flex; gap: 16px; padding: 16px; align-items: flex-start; }
.pc-icons { display: flex; flex-direction: column; gap: 8px; flex: none; }
.pc-text + .pc-text { margin-top: 8px; }
.pc-name { font-size: 16px; line-height: 24px; font-weight: 600; }
.pc-text { font-size: 16px; line-height: 24px; }
.pc-text p + p { margin-top: 8px; }
.pc-body + .pc-body { border-top: 1px solid var(--border); }
.ic-rose, .ic-elev { width: 64px; height: 64px; flex: none; }
.rose-sector { fill: transparent; stroke: #000; stroke-width: 1.25; stroke-linejoin: round; }
.rose-sector.on { fill: var(--primary); }
.rose-label { font: 400 17px/1 var(--font); fill: #000; text-anchor: middle; dominant-baseline: central; }
.rose-label.on { fill: #fff; }
.elev-shape { fill: transparent; stroke: #000; stroke-width: 1.25; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.elev-fill { fill: var(--primary); }
.elev-line { stroke: #000; stroke-width: 1.25; vector-effect: non-scaling-stroke; }
.ic-problem { width: 48px; height: 48px; flex: none; }
.ic-problem .pb { fill: var(--surface); stroke: var(--border); }
.ic-problem .g { stroke: var(--icon-gray); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.ic-problem .gf { fill: var(--icon-gray-soft); stroke: var(--icon-gray); stroke-width: 1.4; stroke-linejoin: round; }
.ic-problem .b { stroke: var(--primary); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ic-problem .bf { fill: var(--primary); stroke: var(--primary); stroke-width: 1; stroke-linejoin: round; }
.ic-problem .bs { fill: var(--primary-soft); stroke: var(--primary); stroke-width: 1.4; stroke-linejoin: round; }
.ic-risk .rk-ring { fill: none; stroke-width: 3; }
.ic-risk text { font: 600 10px var(--font); fill: #fff; text-anchor: middle; dominant-baseline: central; }
.ic-crux .cx { fill: none; stroke: var(--icon-gray); stroke-width: 1.5; }

/* Fliesstext aus dem Bulletin */
.prose { font-size: 16px; line-height: 24px; }
.prose p + p, .prose ul + p, .prose p + ul { margin-top: 8px; }
.prose ul { list-style: disc; padding-left: 20px; }
.prose h4 { font-size: 16px; line-height: 24px; font-weight: 600; margin: 12px 0 4px; }
.prose h4:first-child { margin-top: 0; }
.prose { hyphens: auto; overflow-wrap: anywhere; }

/* ══════════ Listen, Tabellen ══════════ */
.list > li { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--border); }
.list > li:first-child { border-top: 0; padding-top: 0; }
.list > li:last-child { padding-bottom: 0; }
.list .li-main { flex: 1; min-width: 0; }
.list .li-title { font-size: 14px; line-height: 20px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.list .li-sub { font-size: 12px; line-height: 16px; color: var(--text-muted); }
.list a.li-title { text-decoration: none; color: var(--text); }
.list a.li-title:hover { color: var(--primary); text-decoration: underline; }
.nav-list > li > a, .nav-list > li > button { display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: var(--r-nav); color: var(--text-muted); text-decoration: none; font-size: 16px; border: 0; background: none; width: 100%; text-align: left; }
.nav-list > li > a:hover { background: var(--surface-active); color: var(--text); }
.nav-list > li > [aria-current="page"] { background: var(--primary); color: var(--on-primary); }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; line-height: 20px; font-variant-numeric: tabular-nums; }
.tbl th { text-align: left; font-size: 12px; line-height: 16px; font-weight: 600; color: var(--text-muted); padding: 0 8px 8px 0; white-space: nowrap; }
.tbl td { padding: 8px 8px 8px 0; border-top: 1px solid var(--border); vertical-align: middle; }
.tbl th:last-child, .tbl td:last-child { padding-right: 0; }
.tbl .num { text-align: right; }
.tbl th.num { text-align: right; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--nolevel)); margin-right: 6px; vertical-align: -1px; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .15); }

/* Station / Messwerte */
.st-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.st-grid { display: grid; grid-template-columns: repeat(4, auto); justify-content: space-between; gap: 8px; margin-top: 12px; }
.st-val .l { font-size: 12px; line-height: 16px; color: var(--text-muted); }
.st-val .v { font-size: 14px; line-height: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.st-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; }
.spark { display: block; overflow: visible; }
.spark path { fill: none; stroke: var(--primary); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.spark .spark-fill { fill: var(--primary-tint); stroke: none; }

/* ══════════ Formulare ══════════ */
.field { display: flex; flex-direction: column; gap: 4px; }
.field > label, .field-label { font-size: 12px; line-height: 16px; font-weight: 600; color: var(--text-muted); }
.input, .select {
  height: 40px; padding: 0 12px; border: 1px solid var(--border); border-radius: var(--r-ctl); background: var(--surface); font-size: 14px; line-height: 20px; width: 100%;
}
.input:hover, .select:hover { border-color: var(--text-muted); }
.input:focus-visible, .select:focus-visible { outline: 2px solid var(--primary); outline-offset: 0; border-color: var(--primary); }
.seg { display: inline-flex; padding: 2px; gap: 2px; background: var(--surface-active); border-radius: var(--r-ctl); }
.seg button { height: 32px; padding: 0 12px; border: 0; border-radius: 6px; background: transparent; color: var(--text-subtle); font-size: 14px; line-height: 20px; font-weight: 600; }
.seg button[aria-checked="true"], .seg button[aria-pressed="true"] { background: var(--surface); color: var(--primary); box-shadow: 0 1px 2px rgba(0, 0, 0, .15); }
.slider { display: flex; flex-direction: column; gap: 4px; }
.slider-head { display: flex; justify-content: space-between; font-size: 14px; line-height: 20px; }
.slider-head .v { font-weight: 600; }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 24px; background: transparent; margin: 0; }
input[type="range"]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: var(--surface-active); }
input[type="range"]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--surface-active); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; margin-top: -8px; border-radius: 50%; background: var(--primary); border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--primary); }
input[type="range"]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--primary); border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--primary); }

/* ══════════ Zustände ══════════ */
.skel { position: relative; overflow: hidden; background: var(--surface-active); border-radius: var(--r-ctl); min-height: 16px; }
.skel::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .6), transparent); transform: translateX(-100%); animation: shimmer 1.4s infinite; }
@keyframes shimmer { to { transform: translateX(100%); } }
@media (prefers-reduced-motion: reduce) { .skel::after { animation: none; } * { scroll-behavior: auto !important; } }
.state { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 24px 16px; text-align: center; color: var(--text-muted); font-size: 14px; line-height: 20px; }
.state .ic, .state .ic svg { width: 24px; height: 24px; }
.state .state-title { color: var(--text); font-weight: 600; }
.state.err .ic { color: var(--error); }
.inline-note { font-size: 14px; line-height: 20px; color: var(--text-muted); }
.inline-note.err { color: var(--error); }
.toast {
  position: fixed; z-index: 3000; left: 50%; bottom: 24px; transform: translateX(-50%); max-width: min(480px, calc(100% - 32px));
  background: var(--inverted); color: #fff; padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 20px; box-shadow: var(--shadow-float);
}
.toast.err { background: var(--error); }

/* ══════════ Diagramme ══════════ */
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { font: 400 12px var(--font); fill: var(--text-muted); }
.ch-area { fill: var(--chart-area); }
.ch-line { fill: none; stroke: var(--chart-line); stroke-width: 1.5; stroke-linejoin: round; }
.ch-grid { stroke: var(--chart-grid); stroke-width: 1; }
.ch-dash { stroke: var(--text-muted); stroke-width: 1; stroke-dasharray: 3 3; opacity: .6; }
.ch-cursor { stroke: var(--text); stroke-width: 1; }
.ch-dot { fill: var(--text); stroke: var(--surface); stroke-width: 2; }
.ch-mark { fill: var(--primary); opacity: .1; }
.ch-pt { fill: var(--text); stroke: var(--surface); stroke-width: 2; }
.ch-pt-label { fill: var(--text); font-weight: 600; }
.ch-tip {
  position: absolute; z-index: 2; pointer-events: none; min-width: 120px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-ctl);
  box-shadow: var(--shadow-float); padding: 8px 12px; font-size: 12px; line-height: 16px; color: var(--text-muted); white-space: nowrap;
}
.ch-tip b { display: block; font-size: 14px; line-height: 20px; color: var(--text); font-weight: 600; }
.ch-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; font-size: 12px; line-height: 16px; color: var(--text-muted); }
.ch-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--c); margin-right: 4px; vertical-align: -1px; }

/* ══════════ Karten-Marker ══════════ */
.leaflet-container { font-family: var(--font); background: #e9ecef; }
.leaflet-control-attribution { font-size: 10px; line-height: 14px; background: rgba(255, 255, 255, .8); max-width: min(520px, 70vw); }
.leaflet-bottom.leaflet-left { margin-bottom: 0; }
.leaflet-pane.routes-pane { z-index: 450; }
.leaflet-div-icon { background: none; border: 0; }
.mk { display: flex; align-items: center; justify-content: center; }
.mk-badge {
  min-width: 28px; height: 28px; padding: 0 4px; display: flex; align-items: center; justify-content: center; border-radius: 8px; border: 2px solid #000;
  background: var(--lc); color: var(--lt); font: 600 14px/1 var(--font); box-shadow: 0 1px 2px rgba(0, 0, 0, .25); transform: translate(-50%, -50%);
}
.mk-station { display: flex; flex-direction: column; align-items: center; width: 0; overflow: visible; }
.mk-circle {
  width: 24px; height: 24px; margin-left: -12px; border-radius: 50%; background: var(--c); border: 1px solid rgba(0, 0, 0, .35); color: #000; display: flex; align-items: center; justify-content: center;
  font: 600 11px/1 var(--font); box-shadow: 0 1px 2px rgba(0, 0, 0, .2);
}
.mk-circle.dark { color: #fff; }
.mk-circle.none { border-radius: 3px; width: 12px; height: 12px; margin-left: -6px; background: var(--c); }
.mk-label { margin-top: 2px; transform: translateX(0); background: var(--surface); border: 1px solid #000; border-radius: 6px; padding: 1px 6px; font: 600 11px/14px var(--font); white-space: nowrap; text-align: center; }
.mk-label small { display: block; font: 400 10px/12px var(--font); color: var(--text-subtle); }
.mk-icon { width: 28px; height: 28px; border-radius: 50%; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-float); color: var(--primary); }
.mk-icon.danger { color: var(--error); }
.mk-icon.danger.dead { background: var(--error); color: #fff; border-color: var(--error); }
.mk-pin { width: 20px; height: 20px; border-radius: 50%; background: var(--primary); border: 3px solid #fff; box-shadow: 0 0 0 1px var(--primary), 0 2px 6px rgba(0, 0, 0, .35); }
.mk-gps { width: 16px; height: 16px; border-radius: 50%; background: #2563eb; border: 3px solid #fff; box-shadow: 0 0 0 6px rgba(37, 99, 235, .2); }
.leaflet-popup-content-wrapper { border-radius: var(--r-ctl); box-shadow: var(--shadow-float); }
.leaflet-popup-content { margin: 12px 16px; font-size: 14px; line-height: 20px; }
.leaflet-popup-content b { font-weight: 600; }

/* ══════════ Mobil ══════════ */
@media (max-width: 760px) {
  .topbar { flex-wrap: wrap; padding: 0; }
  .brand { height: 56px; padding: 0 16px; }
  .tabs { order: 2; width: 100%; overflow-x: auto; height: 48px; padding: 0 8px; gap: 0; scrollbar-width: none; border-top: 1px solid var(--border); }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: none; padding: 0 12px; }
  .tab[aria-current="page"] { color: var(--primary); background: var(--primary-tint); border-radius: var(--r-nav); margin: 6px 0; }
  .tab[aria-current="page"]::after { display: none; }
  .main { flex-direction: column; }
  .map-wrap { flex: 0 0 45%; min-height: 220px; }
  .panel { flex: 1; width: 100%; border-left: 0; border-top: 1px solid var(--border); padding: 0 16px; }
  .float-tl { top: 8px; left: 8px; width: calc(100% - 16px - 48px); }
  .float-tr { top: 8px; right: 8px; }
  .float-br { right: 8px; bottom: 28px; }
  .search { height: 44px; }
  .legend { padding: 10px 12px; }
  .layers-card { width: 248px; }
  .panel-page { padding: 16px 0 32px; }
  .st-grid { grid-template-columns: repeat(2, 1fr); }
  .danger-word { font-size: 22px; line-height: 28px; }
}

/* Messstation im Panel */
.st + .st { border-top: 1px solid var(--border); margin-top: 12px; padding-top: 12px; }
.st .li-title { font-size: 14px; line-height: 20px; font-weight: 600; text-decoration: none; color: var(--text); }
.st .li-title:hover { color: var(--primary); text-decoration: underline; }
.tbl .num { white-space: nowrap; }
.tbl-spaced { margin-top: 12px; }

/* ══════════ Panels «Touren» und «Planen» ══════════
   Tokens und Komponenten stammen aus styles.css; hier stehen nur Bausteine, die es dort nicht gibt. */

/* Auswahlliste: jede Zeile ist eine Schaltfläche (Tourenauswahl, Schlüsselstellen) */
.pick-card { overflow: hidden; }
.pick-list > li + li { border-top: 1px solid var(--border); }
.pick-row { display: flex; align-items: flex-start; gap: 12px; width: 100%; padding: 12px 16px; border: 0; background: transparent; color: var(--text); text-align: left; }
.pick-row:hover { background: var(--bg); }
.pick-row[aria-current="true"], .pick-row[aria-pressed="true"] { background: var(--primary-tint); }
.pick-row:focus-visible { outline-offset: -2px; }
.pick-title { display: block; font-size: 14px; line-height: 20px; font-weight: 600; }
.pick-sub { display: block; font-size: 12px; line-height: 16px; color: var(--text-muted); }

/* Touren */
.tl-row { display: grid; grid-template-columns: 88px 1fr; align-items: center; gap: 8px; }
.tl-row .seg { display: flex; }
.tl-row .seg button { flex: 1; padding: 0 8px; }
.tl-risk-col, .tl-risk { flex: none; width: 32px; height: 32px; }
.tl-risk { display: block; border-radius: 50%; }
.tl-alt { font-weight: 400; color: var(--text-muted); }
.tl-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin-top: 8px; font-size: 12px; line-height: 16px; color: var(--text-subtle); }
.tl-meta > span { display: inline-flex; align-items: center; gap: 4px; }
.tl-meta .icon { width: 14px; height: 14px; }
.tl-meta .badge { height: 18px; }
.tl-crux .ic-crux { width: 16px; height: 16px; }
.tl-crux b { font-weight: 600; }
.tl-skel { width: 96px; height: 12px; min-height: 0; }

@media (max-width: 760px) { .tl-row { grid-template-columns: 1fr; gap: 4px; } }

/* Planen */
.pl-tools .btn { flex: 1; padding: 0 6px; }
.pl-name { width: calc(100% + 18px); height: 36px; margin: -4px -9px 0; padding: 0 8px; border-color: transparent; background: transparent; font-size: 18px; line-height: 26px; font-weight: 600; }
.pl-name:hover { border-color: var(--border); }
.pl-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; }
.pl-risk { display: flex; align-items: center; gap: 12px; margin-top: 4px; }
.pl-stats { display: grid; grid-template-columns: repeat(4, auto); justify-content: space-between; gap: 12px 8px; margin-top: 8px; }
.pl-stats .meta-item { white-space: nowrap; }
.pl-stats .meta-item .v { font-variant-numeric: tabular-nums; }
.pl-sep { padding-top: 16px; border-top: 1px solid var(--border); }
.pl-sep .pl-stats { margin-top: 0; }
.pl-time { width: 128px; }
.pl-crux-ic { flex: none; display: inline-flex; padding-top: 1px; }
.pl-lv { flex: none; display: inline-flex; border-radius: var(--r-ctl); background: var(--lc); color: var(--lt); }
.pl-lv .ic-danger { width: 32px; height: 32px; }
.pl-note { display: flex; gap: 8px; padding: 8px 12px; border-radius: var(--r-ctl); font-size: 14px; line-height: 20px; background: var(--primary-tint); color: var(--primary-hover); }
.pl-note .ic { margin-top: 2px; }
.pl-note.warn { background: color-mix(in srgb, var(--warning) 14%, #fff); color: var(--warning); }
.pl-note.err { background: color-mix(in srgb, var(--error) 14%, #fff); color: var(--error); }
.pl-note + .pl-note { margin-top: -4px; }
.busy [data-s="risk"], .busy [data-s="profile"], .busy [data-s="cruxes"], .busy [data-s="times"], .busy [data-s="weather"], .busy [data-s="cond"] { opacity: .5; transition: opacity .15s; }
.pl-grm { margin-top: 12px; }
.check { display: flex; align-items: center; gap: 8px; font-size: 14px; line-height: 20px; cursor: pointer; }
.check input { width: 16px; height: 16px; margin: 0; accent-color: var(--primary); }
.tbl-link { color: var(--text); font-weight: 600; text-decoration: none; }
.tbl-link:hover { color: var(--primary); text-decoration: underline; }
.list button.li-title { padding: 0; border: 0; background: none; color: var(--text); text-align: left; }
.list button.li-title:hover { color: var(--primary); text-decoration: underline; }

/* Karte: Zeichenmodus, Routenpunkte, Hover-Punkt */
.map.click-mode, .map.click-mode.leaflet-grab, .map.click-mode.leaflet-dragging.leaflet-grab { cursor: crosshair; }
.mk-wp { width: 24px; height: 24px; border-radius: 50%; background: var(--primary); color: var(--on-primary); border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--primary), 0 2px 4px rgba(0, 0, 0, .3); font: 600 12px/1 var(--font); display: flex; align-items: center; justify-content: center; }
.mk-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--text); border: 2px solid var(--surface); box-shadow: 0 1px 3px rgba(0, 0, 0, .4); }

/* ══════════ Panels «Vor Ort» und «Wissen» (nur Ergänzungen; Tokens und Komponenten aus styles.css) ══════════ */

/* Aufklappbare Karte (details/summary im Stil der Cards) */
.fold { overflow: hidden; padding: 0; }
.fold > summary { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 14px 16px; cursor: pointer; list-style: none; }
.fold > summary::-webkit-details-marker { display: none; }
.fold > summary:focus-visible { outline-offset: -2px; border-radius: var(--r-card); }
.fold-title { display: block; font-size: 16px; line-height: 24px; font-weight: 600; }
.fold-sub { display: block; font-size: 14px; line-height: 20px; color: var(--text-muted); }
.fold > summary > .ic { color: var(--text-muted); transform: rotate(180deg); transition: transform .15s; }
.fold[open] > summary > .ic { transform: none; }
.fold[open] > summary { border-bottom: 1px solid var(--border); }
.fold-body { display: flex; flex-direction: column; gap: 16px; padding: 16px; }
.more > summary { display: inline-flex; align-items: center; min-height: 32px; color: var(--primary); font-size: 14px; line-height: 20px; font-weight: 600; cursor: pointer; }
.more[open] > summary { margin-bottom: 8px; }
@media (prefers-reduced-motion: reduce) { .fold > summary > .ic { transition: none; } }

/* Hinweisfeld */
.callout { display: flex; gap: 12px; padding: 12px 16px; border: 1px solid var(--border); border-radius: var(--r-ctl); background: var(--surface); font-size: 14px; line-height: 20px; }
.callout .ic { margin-top: 2px; color: var(--text-muted); }
.callout p + p { margin-top: 8px; }
.callout-title { font-weight: 600; }
.callout.info { background: var(--primary-tint); border-color: var(--primary-soft); }
.callout.info .ic { color: var(--primary); }
.callout.warn { background: color-mix(in srgb, var(--warning) 8%, #fff); border-color: var(--warning); }
.callout.warn .ic { color: var(--warning); }
.callout.err { background: color-mix(in srgb, var(--error) 8%, #fff); border-color: var(--error); }
.callout.err .ic { color: var(--error); }
.callout.err .callout-title { color: var(--error); }

/* Gefahrenstufen- und Problem-Karten im Wissen */
.fold .danger-word { font-size: 22px; line-height: 28px; }
.vo-dsub { font-size: 14px; line-height: 20px; font-weight: 600; }
.vo-dbody, .vo-pbody { display: flex; flex-direction: column; gap: 12px; padding: 16px; }
.vo-pbody { padding-top: 0; }
.vo-gap { margin-top: 4px; }
.vo-zoneitem { display: flex; gap: 8px; align-items: flex-start; }
.vo-zoneitem .dot { margin-top: 7px; flex: none; }
.vo-zoneitem .prose { font-size: 14px; line-height: 20px; }
.fold .prose { hyphens: manual; }
.vo-q { color: var(--text-subtle); }
.vo-q ul { font-size: 14px; line-height: 20px; }

/* Standort / Hang */
.vo-pick { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.vo-pick .btn { flex: 1 1 200px; }
.vo-pick .card-sub { flex: 1 1 140px; }
.vo-line { display: flex; gap: 12px; align-items: flex-start; }
.vo-lv { display: inline-flex; flex: none; border-radius: var(--r-ctl); background: var(--lc); }
.vo-hint { font-size: 12px; line-height: 16px; color: var(--text-muted); }
.vo-hint .btn-link { min-height: 32px; font-size: 12px; line-height: 16px; vertical-align: baseline; }
.vo-hint .badge { margin-right: 4px; }

/* Ergebnis: Karte mit Zonenfarbe wie die Gefahrenstufen-Karte */
.z-0 { --zc: var(--risk0); --zt: #000; }
.z-1 { --zc: var(--risk1); --zt: #000; }
.z-2 { --zc: var(--risk2); --zt: #fff; }
.vo-result { border: 2px solid var(--zc); border-radius: var(--r-card); overflow: hidden; background: var(--surface); }
.vo-head { padding: 12px 16px; background: var(--zc); color: var(--zt); }
.vo-kicker { font-size: 12px; line-height: 16px; font-weight: 600; }
.vo-zone { font-size: 26px; line-height: 32px; font-weight: 600; }
.vo-body { display: flex; flex-direction: column; gap: 12px; padding: 16px; }
.vo-lead { font-size: 18px; line-height: 26px; font-weight: 600; }
.vo-facts td:last-child { white-space: normal; }
.vo-areas tr.on td { font-weight: 600; background: var(--primary-tint); }
.vo-areas tr.on td:first-child { border-radius: var(--r-ctl) 0 0 var(--r-ctl); padding-left: 8px; }

/* Eingaben */
.vo-aspect { display: flex; align-items: center; gap: 16px; }
.vo-rose .ic-rose { width: 144px; height: 144px; }
.rose-pick .rose-sector { cursor: pointer; }
.rose-pick .rose-sector:hover:not(.on) { fill: var(--primary-tint); }
.rose-pick .rose-sector:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.rose-pick .rose-label { pointer-events: none; }
.vo-seg { display: flex; }
.vo-seg + .vo-seg { margin-top: 8px; }
.vo-seg button { flex: 1; height: 44px; padding: 0 4px; }
.vo-seg button:disabled { opacity: .45; cursor: not-allowed; }
.vo-note { font: inherit; font-size: 14px; height: auto; padding: 8px 12px; resize: vertical; line-height: 20px; }

/* Checklisten */
.vo-opt { display: flex; align-items: center; gap: 12px; flex: 1; min-height: 24px; cursor: pointer; font-size: 16px; line-height: 24px; }
.vo-opt input { flex: none; width: 24px; height: 24px; margin: 0; accent-color: var(--primary); cursor: pointer; }
.vo-opt.alarm input { accent-color: var(--error); }
.vo-opt input:checked + span { font-weight: 600; }
.vo-cell { display: flex; flex-direction: column; gap: 8px; }
.vo-cell + .vo-cell { padding-top: 16px; border-top: 1px solid var(--border); }
.vo-cell .vo-opt { min-height: 40px; }
.vo-bar { height: 8px; border-radius: 4px; background: var(--surface-active); overflow: hidden; }
.vo-bar i { display: block; height: 100%; width: 0; background: var(--primary); transition: width .2s; }

@media (max-width: 760px) {
  .vo-zone { font-size: 22px; line-height: 28px; }
  .vo-rose .ic-rose { width: 120px; height: 120px; }
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="brand" href="#lage" aria-label="Skitourenplaner, zur Lage">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <path class="bm-back" d="M3 26 12.5 9.5c.6-1 2-1 2.6 0L26 26z"/>
        <path class="bm-front" d="M11 26 19.2 12.4c.6-1 2-1 2.6 0L30 26z"/>
        <path class="bm-snow" d="M13.9 11.4 12.5 9.5c-.6-1-2-1-2.6 0L8.1 12.6l2.4 1.7 1.7-1.5 1.7 1.6z"/>
      </svg>
      <span class="brand-name">Skitourenplaner</span>
    </a>
    <nav class="tabs" aria-label="Hauptnavigation">
      <a class="tab" href="#lage" data-tab="lage"><span class="ic" data-icon="mountain"></span>Lage</a>
      <a class="tab" href="#touren" data-tab="touren"><span class="ic" data-icon="route"></span>Touren</a>
      <a class="tab" href="#planen" data-tab="planen"><span class="ic" data-icon="edit"></span>Planen</a>
      <a class="tab" href="#vorort" data-tab="vorort"><span class="ic" data-icon="gps"></span>Vor Ort</a>
      <a class="tab" href="#wissen" data-tab="wissen"><span class="ic" data-icon="info"></span>Wissen</a>
    </nav>
  </header>

  <main class="main">
    <section class="map-wrap" aria-label="Karte">
      <div id="map" class="map"></div>

      <div class="float-tl">
        <div class="card float search" role="search">
          <span class="ic search-ic" data-icon="search"></span>
          <input id="search-input" class="search-input" type="search" placeholder="Ort suchen" autocomplete="off" aria-label="Ort suchen" aria-controls="search-results">
          <button id="search-clear" class="btn-icon btn-bare" type="button" aria-label="Suche leeren" hidden><span data-icon="close"></span></button>
          <ul id="search-results" class="search-results" role="listbox" hidden></ul>
        </div>
        <div id="legend" class="card float legend" hidden>
          <div class="legend-head">
            <div class="legend-text">
              <div class="legend-title">Lawinenbulletin</div>
              <div id="legend-valid" class="legend-sub">Wird geladen …</div>
            </div>
            <button id="legend-toggle" class="btn-icon btn-bare" type="button" aria-label="Legende ein- oder ausblenden" aria-expanded="true"><span data-icon="chevron"></span></button>
          </div>
          <div id="legend-bar" class="legend-bar" aria-hidden="false"></div>
        </div>
      </div>

      <div class="float-tr">
        <button id="layers-btn" class="btn-icon btn-float" type="button" aria-label="Ebenen" aria-expanded="false" aria-controls="layers-card"><span data-icon="layers"></span></button>
        <div id="layers-card" class="card float layers-card" hidden>
          <div class="layers-title">Grundkarte</div>
          <div id="layers-base" class="layers-group" role="radiogroup" aria-label="Grundkarte"></div>
          <div class="layers-title">Ebenen</div>
          <div id="layers-over" class="layers-group"></div>
        </div>
      </div>

      <div class="float-br">
        <button id="btn-locate" class="btn-icon btn-float" type="button" aria-label="Mein Standort"><span data-icon="locate"></span></button>
        <div class="zoom-group">
          <button id="btn-zoom-in" class="btn-icon btn-float" type="button" aria-label="Hineinzoomen"><span data-icon="plus"></span></button>
          <button id="btn-zoom-out" class="btn-icon btn-float" type="button" aria-label="Herauszoomen"><span data-icon="minus"></span></button>
        </div>
      </div>
    </section>

    <aside class="panel" id="panel" aria-label="Details">
      <section class="panel-page" data-panel="lage" hidden></section>
      <section class="panel-page" data-panel="touren" hidden></section>
      <section class="panel-page" data-panel="planen" hidden></section>
      <section class="panel-page" data-panel="vorort" hidden></section>
      <section class="panel-page" data-panel="wissen" hidden></section>
    </aside>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</div>
<script type="module">
/* ── 00-config.js ── */
/* ══════════════════════════ 00 · Konfiguration ══════════════════════════

/* ── 10-util.js ── */
/* ══════════════════════════ 10 · Hilfsfunktionen ══════════════════════════ */
const U = (() => {
  const TZ = 'Europe/Zurich';
  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
  const h = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const cap = (s) => (s ? s[0].toUpperCase() + s.slice(1) : '');

  /* ── Netz ── */
  async function fetchRaw(url, timeout) {
    const ctl = new AbortController();
    const to = setTimeout(() => ctl.abort(), timeout);
    try {
      const r = await fetch(url, { signal: ctl.signal });
      if (!r.ok) { const e = new Error(`Abruf fehlgeschlagen (HTTP ${r.status})`); e.status = r.status; throw e; }
      return r;
    } catch (e) {
      if (e.name === 'AbortError') throw new Error('Zeitüberschreitung beim Abruf');
      if (e instanceof TypeError) throw new Error('Keine Verbindung zur Datenquelle');
      throw e;
    } finally { clearTimeout(to); }
  }
  const fetchJSON = async (url, { timeout = 20000 } = {}) => (await fetchRaw(url, timeout)).json();
  // Bildkachel → ImageData (256×256). Fehlende Kachel (404) → null.
  async function fetchBitmap(url, { timeout = 15000 } = {}) {
    let r;
    try { r = await fetchRaw(url, timeout); } catch (e) { if (e.status === 404 || e.status === 400) return null; throw e; }
    const bmp = await createImageBitmap(await r.blob());
    const c = new OffscreenCanvas(bmp.width, bmp.height);
    const ctx = c.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(bmp, 0, 0);
    return ctx.getImageData(0, 0, bmp.width, bmp.height);
  }

  // Eine Wiederholung nach delayMs (Netz kann wackeln). fn: () => Promise. Ein Fehler der zweiten Runde wird weitergereicht.
  async function retry(fn, delayMs = 1500) {
    try { return await fn(); } catch { await new Promise((r) => setTimeout(r, delayMs)); return fn(); }
  }

  /* ── Speicher (nur Bequemlichkeit, darf fehlen) ── */
  const store = {
    get(k, d) { try { const v = localStorage.getItem('skt.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('skt.' + k, JSON.stringify(v)); } catch { /* voll oder gesperrt */ } },
  };

  /* ── Formatierung ── */
  const nf = (d) => new Intl.NumberFormat('de-CH', { minimumFractionDigits: d, maximumFractionDigits: d });
  const fTime = new Intl.DateTimeFormat('de-CH', { timeZone: TZ, hour: '2-digit', minute: '2-digit' });
  const fDate = new Intl.DateTimeFormat('de-CH', { timeZone: TZ, weekday: 'short', day: 'numeric', month: 'numeric' });
  const DIR16 = ['N', 'NNO', 'NO', 'ONO', 'O', 'OSO', 'SO', 'SSO', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
  const ok = (v) => v != null && Number.isFinite(+v);
  const fmt = {
    num: (v, d = 0) => (ok(v) ? nf(d).format(v) : '–'),
    m: (v) => (ok(v) ? nf(0).format(Math.round(v)) + ' m' : '–'),
    km: (m) => (ok(m) ? nf(m < 10000 ? 1 : 0).format(m / 1000) + ' km' : '–'),
    dur: (min) => { if (!ok(min)) return '–'; const t = Math.round(min / 5) * 5; return `${Math.floor(t / 60)} h ${String(t % 60).padStart(2, '0')}`; },
    time: (ms) => (ok(ms) ? fTime.format(ms) : '–'),
    date: (ms) => (ok(ms) ? fDate.format(ms) : '–'),
    dt: (ms) => `${fmt.date(ms)}, ${fmt.time(ms)}`,   // «Sa., 28.11., 17:00»
    ago: (ms) => {
      if (!ok(ms)) return '';
      const m = Math.round((Date.now() - ms) / 60e3);
      if (m < 1) return 'gerade eben';
      if (m < 60) return `vor ${m} min`;
      if (m < 48 * 60) return `vor ${Math.round(m / 60)} h`;
      return `vor ${Math.round(m / 1440)} Tagen`;
    },
    aspect: (deg) => (ok(deg) ? DIR16[Math.round((((deg % 360) + 360) % 360) / 22.5) % 16] : '–'),
    deg: (v) => (ok(v) ? Math.round(v) + '°' : '–'),
    // Höhenbereich: «2 400–2 800 m», «ab 2 400 m», «bis 2 800 m», «alle Höhenlagen» (null = offen)
    elevRange: (min, max) => (min != null && max != null ? `${fmt.num(min)}–${fmt.m(max)}` : min != null ? `ab ${fmt.m(min)}` : max != null ? `bis ${fmt.m(max)}` : 'alle Höhenlagen'),
  };

  /* ── Zürcher Ortszeit ── */
  const zoned = (ms) => Object.fromEntries(new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric', hourCycle: 'h23' })
    .formatToParts(ms).filter((p) => p.type !== 'literal').map((p) => [p.type, +p.value]));
  // Datum 'YYYY-MM-DD' in Zürcher Zeit, dayOffset Tage nach heute
  const zurichDay = (dayOffset = 0) => { const n = zoned(Date.now()); return new Date(Date.UTC(n.year, n.month - 1, n.day + dayOffset)).toISOString().slice(0, 10); };
  // 'YYYY-MM-DD' + 'HH:MM' in Zürcher Ortszeit → ms seit Epoch
  function zurichMs(ymd, hhmm) {
    const [y, mo, d] = ymd.split('-').map(Number), [h, mi] = hhmm.split(':').map(Number);
    const guess = Date.UTC(y, mo - 1, d, h, mi), z = zoned(guess);
    return guess - (Date.UTC(z.year, z.month - 1, z.day, z.hour, z.minute) - guess); // Unterschied UTC ↔ Zürich abziehen
  }

  /* ── Geometrie ── */
  const R = 6371008.8, rad = Math.PI / 180;
  const geo = {
    rad,
    round5: (v) => Math.round(v * 1e5) / 1e5,   // ca. 1 m
    dist(a, b) {
      const dLat = (b.lat - a.lat) * rad, dLon = (b.lon - a.lon) * rad;
      const s = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLon / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(s));
    },
    bearing(a, b) {
      const y = Math.sin((b.lon - a.lon) * rad) * Math.cos(b.lat * rad);
      const x = Math.cos(a.lat * rad) * Math.sin(b.lat * rad) - Math.sin(a.lat * rad) * Math.cos(b.lat * rad) * Math.cos((b.lon - a.lon) * rad);
      return (Math.atan2(y, x) / rad + 360) % 360;
    },
    // Linie in gleichmässige Schritte teilen; jedes Ergebnis trägt d = kumulierte Distanz (m)
    densify(pts, stepM) {
      const out = [];
      if (!pts.length) return out;
      let d = 0;
      out.push({ lat: pts[0].lat, lon: pts[0].lon, d: 0 });
      for (let i = 1; i < pts.length; i++) {
        const a = pts[i - 1], b = pts[i], seg = geo.dist(a, b);
        const n = Math.max(1, Math.ceil(seg / stepM));
        for (let k = 1; k <= n; k++) {
          const f = k / n;
          out.push({ lat: a.lat + (b.lat - a.lat) * f, lon: a.lon + (b.lon - a.lon) * f, d: d + seg * f });
        }
        d += seg;
      }
      return out;
    },
    // Punkt in Polygon (GeoJSON-Ringe [[lon,lat],…]; erster Ring aussen, weitere Löcher)
    pointInRings(lat, lon, rings) {
      let inside = false;
      for (const ring of rings) {
        for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
          const [xi, yi] = ring[i], [xj, yj] = ring[j];
          if ((yi > lat) !== (yj > lat) && lon < ((xj - xi) * (lat - yi)) / (yj - yi) + xi) inside = !inside;
        }
      }
      return inside;
    },
    bbox(pts) {
      const b = { s: Infinity, w: Infinity, n: -Infinity, e: -Infinity };
      for (const p of pts) { b.s = Math.min(b.s, p.lat); b.n = Math.max(b.n, p.lat); b.w = Math.min(b.w, p.lon); b.e = Math.max(b.e, p.lon); }
      return b;
    },
    inBBox: (b, lat, lon) => lat >= b.s && lat <= b.n && lon >= b.w && lon <= b.e,
    // Web-Mercator: Kachel und Pixel (0–255) eines Punkts
    tileXY(lat, lon, z) {
      const n = 2 ** z, s = Math.sin(lat * rad);
      const fx = ((lon + 180) / 360) * n;
      const fy = (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * n;
      const x = Math.floor(fx), y = Math.floor(fy);
      return { x, y, px: Math.floor((fx - x) * 256), py: Math.floor((fy - y) * 256) };
    },
    // Meter pro Pixel einer Kachel auf Breite lat
    mPerPx: (lat, z) => (Math.cos(lat * rad) * 2 * Math.PI * 6378137) / (256 * 2 ** z),
  };

  /* ── Ereignisse ── */
  const handlers = new Map();
  const bus = {
    on(evt, fn) { (handlers.get(evt) || handlers.set(evt, []).get(evt)).push(fn); return () => bus.off(evt, fn); },
    off(evt, fn) { const a = handlers.get(evt); if (a) a.splice(a.indexOf(fn) >>> 0, 1); },
    emit(evt, data) { for (const fn of handlers.get(evt) || []) { try { fn(data); } catch (e) { console.error(evt, e); } } },
  };

  // Einmal-Promise mit Ablauf: Wiederholte Aufrufe teilen sich den laufenden Abruf
  function cached(fn, ttlMs) {
    let p = null, at = 0;
    return (force = false) => {
      if (!force && p && Date.now() - at < ttlMs) return p;
      at = Date.now();
      p = fn().catch((e) => { p = null; throw e; });
      return p;
    };
  }

  return { TZ, $, $$, h, esc, clamp, cap, fetchJSON, fetchBitmap, retry, store, fmt, zurichDay, zurichMs, geo, bus, cached };
})();

/* ── 20-data-bulletin.js ── */
/* ══════════════════════════ 20 · Datenquelle: Lawinenbulletin (SLF, CAAML-GeoJSON) ══════════════════════════ */
const Bulletin = (() => {
  const LEVEL = { low: 1, moderate: 2, considerable: 3, high: 4, very_high: 5 };
  const SUBS = ['minus', 'neutral', 'plus'];
  const ASPECTS = new Set(CFG.aspects8);

  const sub = (o) => { const s = o && o.customData && o.customData.CH && o.customData.CH.subdivision; return SUBS.includes(s) ? s : null; };
  const grade = (level, s) => (level ? level + (s === 'minus' ? -1 / 3 : s === 'plus' ? 1 / 3 : 0) : 0);
  const ms = (iso) => { const t = Date.parse(iso); return Number.isFinite(t) ? t : null; };
  // Höhengrenze: Zahl als String, «treeline» → CFG.treeline, sonst null
  const bound = (v) => (v === 'treeline' ? CFG.treeline : v != null && Number.isFinite(+v) ? +v : null);
  const text = (o) => (o && typeof o.comment === 'string' && o.comment.trim() ? o.comment : '');
  const joinTexts = (arr) => (Array.isArray(arr) ? arr.map(text).filter(Boolean).join('\n') : '');

  // Gefahr einer Region: bei mehreren Zeiträumen die höchste (nach g), alle in periods
  function danger(ratings) {
    const periods = (ratings || [])
      .map((r) => { const level = LEVEL[r.mainValue] || 0, s = level ? sub(r) : null; return { period: r.validTimePeriod || 'all_day', level, sub: s, g: grade(level, s) }; })
      .filter((p) => p.level);
    if (!periods.length) return { level: 0, sub: null, g: 0, periods: [] };
    const top = periods.reduce((a, b) => (b.g > a.g ? b : a));
    return { level: top.level, sub: top.sub, g: top.g, periods };
  }

  function problem(a) {
    const level = LEVEL[a.dangerRatingValue] || 0, s = level ? sub(a) : null;
    const el = a.elevation || {};
    const ch = (a.customData && a.customData.CH) || {};
    return {
      type: a.problemType,
      label: CFG.problems[a.problemType] || a.problemType || '',
      level, sub: s, g: grade(level, s),
      aspects: (a.aspects || []).filter((x) => ASPECTS.has(x)),
      elevMin: bound(el.lowerBound), elevMax: bound(el.upperBound),
      coreText: ch.coreZoneText || '',
      comment: text(a),
    };
  }

  const polys = (geom) => (!geom ? [] : geom.type === 'Polygon' ? [geom.coordinates] : geom.type === 'MultiPolygon' ? geom.coordinates : []);
  function bboxOf(polygons) {
    const b = { s: Infinity, w: Infinity, n: -Infinity, e: -Infinity };
    for (const poly of polygons) for (const [lon, lat] of poly[0] || []) {
      if (lat < b.s) b.s = lat; if (lat > b.n) b.n = lat; if (lon < b.w) b.w = lon; if (lon > b.e) b.e = lon;
    }
    return b;
  }

  function region(f) {
    const p = f.properties || {};
    const reg = (p.regions && p.regions[0]) || {};
    const d = danger(p.dangerRatings);
    const rings = polys(f.geometry);
    return {
      id: reg.regionID || p.bulletinID || '', name: reg.name || '',
      rings, bbox: bboxOf(rings),
      level: d.level, sub: d.sub, g: d.g, periods: d.periods,
      problems: (p.avalancheProblems || []).map(problem),
      texts: {
        snowpack: text(p.snowpackStructure),
        tendency: joinTexts(p.tendency),
        weather: text(p.weatherForecast),
        review: text(p.weatherReview),
      },
    };
  }

  let data = null;

  const load = U.cached(async () => {
    const j = await U.retry(() => U.fetchJSON(CFG.url.bulletin, { timeout: 30000 }));
    const feats = (j && j.features) || [];
    if (!feats.length) throw new Error('Das Lawinenbulletin ist leer oder nicht lesbar');
    const regions = feats.map(region).filter((r) => r.rings.length);
    // Zeiten stammen vom ersten Feature mit Bulletin (alle teilen dieselbe Ausgabe)
    const p = (feats.find((f) => f.properties && f.properties.dangerRatings) || feats[0]).properties || {};
    const vt = p.validTime || {};
    data = { issued: ms(p.publicationTime), validFrom: ms(vt.startTime), validTo: ms(vt.endTime), nextUpdate: ms(p.nextUpdate), regions };
    return data;
  }, 10 * 60e3);

  // Region am Ort (nach load); Punkte in mehreren Polygonen: erste mit Bulletin bevorzugt
  function regionAt(lat, lon) {
    if (!data) return null;
    let hit = null;
    for (const r of data.regions) {
      const b = r.bbox;
      if (lat < b.s || lat > b.n || lon < b.w || lon > b.e) continue;
      if (r.rings.some((poly) => U.geo.pointInRings(lat, lon, poly))) { if (r.level) return r; hit = hit || r; }
    }
    return hit;
  }

  return { load, regionAt };
})();

/* ── 21-data-stations.js ── */
/* ══════════════════════════ 21 · Datenquelle: SLF-Stationen (IMIS + Beobachter) über den Datenspiegel ══════════════════════════ */
const Stations = (() => {
  const DEF_F = ['t', 'HS', 'TA', 'RH', 'TSS', 'VW', 'VWX', 'DW', 'RSWR'];
  const nn = (v) => (v == null || v === '' || !Number.isFinite(+v) ? null : +v);
  const ms = (t) => (nn(t) == null ? null : t > 1e12 ? +t : t * 1000); // Sekunden oder ms
  const pair = (a) => (Array.isArray(a) ? { t: ms(a[0]), HN: nn(a[1]) } : null);

  let list = null, info = { at: null, serAt: null };

  const loadAll = U.cached(async () => {
    const [j, ser] = await Promise.all([
      U.retry(() => U.fetchJSON(CFG.url.mirror('slf.json'), { timeout: 30000 })),
      // Zeitreihen sind eine Beigabe: ohne sie bleibt ser = null
      U.retry(() => U.fetchJSON(CFG.url.mirror('slf-ser.json'), { timeout: 30000 })).catch(() => null),
    ]);
    if (!j || !Array.isArray(j.st)) throw new Error('Stationsdaten nicht lesbar');
    const f = Array.isArray(j.f) ? j.f : DEF_F;
    const out = [];
    const seen = new Set();
    const add = (r, kind) => {
      const [code, name, lat, lon, ele, canton, type] = r;
      if (!code || seen.has(code) || !Number.isFinite(lat) || !Number.isFinite(lon)) return;
      seen.add(code);
      const o = {};
      const arr = j.last && j.last[code];
      if (Array.isArray(arr)) f.forEach((k, i) => { o[k] = k === 't' ? ms(arr[i]) : nn(arr[i]); });
      const spm = j.spm && j.spm[code];
      // Beobachterstationen: Tagesmessung (HS, HN) als «letzter Wert»
      if (Array.isArray(spm) && !Array.isArray(arr)) Object.assign(o, { t: ms(spm[0]), HS: nn(spm[1]) });
      const hn24 = pair(j.hn24 && j.hn24[code]), hnDay = pair(j.hn && j.hn[code]);
      const hn1 = hn24 && hn24.HN != null ? hn24 : hnDay && hnDay.HN != null ? hnDay : Array.isArray(spm) ? { t: ms(spm[0]), HN: nn(spm[2]) } : null;
      const s = ser && ser.s && ser.s[code];
      let serObj = null;
      if (Array.isArray(s) && ser.f) {
        serObj = { t0: ser.t0 * 1000, dt: ser.dt * 1000 };
        ser.f.forEach((k, i) => { serObj[k] = s[i] || []; });
      }
      out.push({
        code, name: name || code, lat, lon, ele: nn(ele), canton: canton || '', type: type || (kind === 'sp' ? 'OBSERVER' : ''),
        last: { t: o.t ?? null, HS: o.HS ?? null, TA: o.TA ?? null, VW: o.VW ?? null, VWX: o.VWX ?? null, DW: o.DW ?? null },
        hn1,
        daily: ((j.daily && j.daily[code]) || []).map((x) => [ms(x[0]), nn(x[1]), nn(x[2])]),
        ser: serObj,
        url: CFG.url.stationPage(code),
      });
    };
    for (const r of j.st) add(r, 'imis');
    for (const r of j.sp || []) add(r, 'sp');
    info = { at: Date.parse(j.at) || null, serAt: ser && ser.t0 ? ser.t0 * 1000 : null };
    list = out;
    return out;
  }, 5 * 60e3);

  // ser = {t0, dt (beide ms), HS:[], TA:[], VW:[], VWX:[], DW:[]}: Wert i gehört zu t0 + i·dt
  const load = () => loadAll();

  // Synchron, nach load(); vorher []. Ergebnis: Kopien der Station mit dist (m)
  // Nächste Stationen. IMIS- und Beobachterstation am selben Ort mit gleichem Namen erscheinen nur einmal:
  // behalten wird die mit Temperatur bzw. Zeitreihe.
  function near(lat, lon, { n = 6, km = 25 } = {}) {
    const p = { lat, lon }, score = (s) => (s.last && s.last.TA != null ? 1 : 0) + (s.ser ? 1 : 0), byName = new Map();
    for (const s of list || []) {
      const d = U.geo.dist(p, s);
      if (d > km * 1000) continue;
      const old = byName.get(s.name);
      if (!old || score(s) > score(old.s)) byName.set(s.name, { s, d });
    }
    return [...byName.values()].sort((a, b) => a.d - b.d).slice(0, n).map((x) => Object.assign({}, x.s, { dist: x.d }));
  }

  // Windgeschwindigkeit in km/h (Messwert VW in m/s), null ohne Messung
  const windKmh = (s) => (s.last.VW == null ? null : s.last.VW * CFG.msToKmh);

  return { load, near, windKmh, get info() { return info; } };
})();

/* ══════════════════════════ 22 · Datenquelle: Skirouten (swisstopo/SAC, identify) ══════════════════════════ */
const Routes = (() => {
  const LAYER = 'ch.swisstopo-karto.skitouren';
  const LIMIT = 200;      // Treffer je Abfrage (Obergrenze der Schnittstelle)
  const MAX_DEPTH = 2;    // Teilungsebenen
  const PARALLEL = 4;
  const NO_INFO = 'Keine Routeninfo verfügbar';

  const cache = new Map(); // Abfragebox → Promise<Feature[]>
  const key = (b) => [b.w, b.s, b.e, b.n].map(U.geo.round5).join(',');

  // Gleichzeitige Abfragen begrenzen
  let active = 0; const waiting = [];
  const slot = () => (active < PARALLEL ? (active++, Promise.resolve()) : new Promise((res) => waiting.push(res)));
  const release = () => { const n = waiting.shift(); if (n) n(); else active--; };

  async function query(b) {
    await slot();
    try {
      const q = new URLSearchParams({
        geometryType: 'esriGeometryEnvelope', geometry: [b.w, b.s, b.e, b.n].join(','), sr: '4326',
        layers: 'all:' + LAYER, tolerance: '0', geometryFormat: 'geojson', returnGeometry: 'true', limit: String(LIMIT), lang: 'de',
      });
      const j = await U.retry(() => U.fetchJSON(`${CFG.url.identify}?${q}`, { timeout: 30000 }));
      return (j && j.results) || [];
    } finally { release(); }
  }

  // Box abfragen; bei ≥ LIMIT Treffern in 4 Teilboxen zerlegen (max. MAX_DEPTH Ebenen)
  function fetchBox(b, depth = 0) {
    const k = key(b);
    if (cache.has(k)) return cache.get(k);
    const p = (async () => {
      const res = await query(b);
      if (res.length < LIMIT || depth >= MAX_DEPTH) return res;
      const mx = (b.w + b.e) / 2, my = (b.s + b.n) / 2;
      const parts = await Promise.all([
        { w: b.w, s: b.s, e: mx, n: my }, { w: mx, s: b.s, e: b.e, n: my },
        { w: b.w, s: my, e: mx, n: b.n }, { w: mx, s: my, e: b.e, n: b.n },
      ].map((q) => fetchBox(q, depth + 1)));
      return res.concat(...parts);
    })();
    cache.set(k, p);
    p.catch(() => cache.delete(k));
    return p;
  }

  /* ── Linien zusammenfügen ── */
  const toPts = (c) => c.map(([lon, lat]) => ({ lat, lon }));
  const lineLen = (pts) => { let d = 0; for (let i = 1; i < pts.length; i++) d += U.geo.dist(pts[i - 1], pts[i]); return d; };
  const parts = (geom) => (!geom ? [] : geom.type === 'LineString' ? [geom.coordinates] : geom.type === 'MultiLineString' ? geom.coordinates : []).filter((c) => c.length > 1).map(toPts);

  /* Teilstücke verketten: mit dem längsten beginnen, dann immer das Stück anhängen, dessen Ende am
     nächsten an einem Kettenende liegt (bei Bedarf umdrehen; vorn anhängen, wenn das Kettenanfang näher ist).
     Annahme zur Richtung (ohne Höhen): Der Start ist das Kettenende, das dem längsten Teilstück am nächsten
     liegt (dort beginnt meist der Aufstieg ab Parkplatz/Hütte, Seitenstücke sind Varianten/Abfahrten); der Gipfel
     ist das gegenüberliegende Ende. Bei einem einzelnen Stück bleibt die Digitalisierungsrichtung. Ein späterer
     Schritt (mit Höhen) richtet die Linie endgültig aus: Start = tiefster Punkt. */
  function chain(list) {
    if (!list.length) return [];
    const rest = list.slice().sort((a, b) => lineLen(b) - lineLen(a));
    const longest = rest[0];
    let line = rest.shift().slice();
    while (rest.length) {
      let best = null;
      for (let i = 0; i < rest.length; i++) {
        const p = rest[i], h = line[0], t = line[line.length - 1];
        for (const [end, atTail, rev] of [[p[0], true, false], [p[p.length - 1], true, true], [p[p.length - 1], false, false], [p[0], false, true]]) {
          const d = U.geo.dist(atTail ? t : h, end);
          if (!best || d < best.d) best = { d, i, atTail, rev };
        }
      }
      let p = rest.splice(best.i, 1)[0];
      if (best.rev) p = p.slice().reverse();
      line = best.atTail ? line.concat(p.slice(U.geo.dist(line[line.length - 1], p[0]) < 1 ? 1 : 0)) : p.concat(line.slice(U.geo.dist(p[p.length - 1], line[0]) < 1 ? 1 : 0));
    }
    // Start = Kettenende, das dem längsten Teilstück näher liegt (ausser bei einem Stück: unverändert)
    if (list.length > 1) {
      const mid = longest[Math.floor(longest.length / 2)];
      if (U.geo.dist(line[line.length - 1], mid) < U.geo.dist(line[0], mid)) line.reverse();
    }
    return line;
  }

  const hm = (v) => (v != null && Number.isFinite(+v) ? Math.round(+v) : null);
  const minutes = (s) => { const m = /^(\d+):(\d{2})/.exec(s || ''); return m ? +m[1] * 60 + +m[2] : null; };

  function build(results) {
    const groups = new Map();
    for (const r of results) {
      const p = r.properties || {};
      if (!p.label || p.name === NO_INFO) continue;
      const k = p.url_sac_de || `${p.name}|${p.target_name}`;
      const g = groups.get(k) || groups.set(k, { p, ids: new Set(), lines: [] }).get(k);
      if (g.ids.has(r.featureId || r.id)) continue; // dasselbe Feature aus mehreren Teilboxen
      g.ids.add(r.featureId || r.id);
      g.lines.push(...parts(r.geometry));
      // Felder aus dem vollständigsten Eintrag
      if (p.ascent_time_label && !g.p.ascent_time_label) g.p = p;
    }
    const out = [];
    for (const [k, g] of groups) {
      const p = g.p, line = chain(g.lines);
      if (line.length < 2) continue;
      out.push({
        id: p.url_sac_de || [...g.ids][0], name: p.name, target: p.target_name || p.label, targetAlt: hm(p.target_altitude),
        diff: p.difficulty_de || null, ascentMin: minutes(p.ascent_time_label), ascentHm: hm(p.ascent_altitude), descentHm: hm(p.descent_altitude),
        url: p.url_sac_de || null, line,
      });
    }
    return out;
  }

  // b = {s, w, n, e} (WGS84)
  async function inBBox(b) {
    if (![b.s, b.w, b.n, b.e].every(Number.isFinite) || b.s >= b.n || b.w >= b.e) throw new Error('Ungültiger Kartenausschnitt');
    return build(await fetchBox(b));
  }

  return { inBBox };
})();

/* ══════════════════════════ 23 · Datenquelle: Wetterprognose (Open-Meteo, MeteoSchweiz ICON) ══════════════════════════ */
const Weather = (() => {
  const MODEL = 'meteoswiss_icon_seamless';
  const FALLBACK = 'Open-Meteo best match';
  const TTL = 30 * 60e3;
  const HOURLY = ['temperature_2m', 'freezing_level_height', 'wind_speed_10m', 'wind_gusts_10m', 'wind_direction_10m', 'snowfall', 'precipitation', 'cloud_cover'];
  const cache = new Map();

  const utc = (s) => Date.parse(s.length === 16 ? s + ':00Z' : s.endsWith('Z') ? s : s + 'Z'); // «2026-11-28T10:00» (timezone=UTC)
  // Bei einem einzelnen Modell heissen die Felder wie angefragt; sonst mit Modellsuffix
  const col = (o, name) => o[name] || o[Object.keys(o).find((k) => k.startsWith(name + '_'))] || [];

  async function fetchOnce(lat, lon, ele, model) {
    const q = new URLSearchParams({
      latitude: lat.toFixed(4), longitude: lon.toFixed(4), hourly: HOURLY.join(','), daily: 'sunrise,sunset',
      timezone: 'UTC', forecast_days: '3',
    });
    if (Number.isFinite(ele)) q.set('elevation', String(Math.round(ele)));
    if (model) q.set('models', model);
    const j = await U.fetchJSON(`${CFG.url.forecast}?${q}`, { timeout: 20000 });
    if (!j || !j.hourly || !j.hourly.time) throw new Error('Wetterdaten nicht lesbar');
    return j;
  }

  async function get(lat, lon, ele) {
    let j, model = MODEL;
    try { j = await U.retry(() => fetchOnce(lat, lon, ele, MODEL)); }
    catch (e1) {
      try { j = await fetchOnce(lat, lon, ele, null); model = FALLBACK; }
      catch (e2) { throw new Error('Wetterprognose nicht verfügbar (' + (e2.message || e1.message) + ')'); }
    }
    const h = j.hourly, v = {};
    HOURLY.forEach((n) => { v[n] = col(h, n); });
    const hours = h.time.map((t, i) => ({
      t: utc(t), temp: v.temperature_2m[i] ?? null, fzl: v.freezing_level_height[i] ?? null,
      wind: v.wind_speed_10m[i] ?? null, gust: v.wind_gusts_10m[i] ?? null, dir: v.wind_direction_10m[i] ?? null,
      snow: v.snowfall[i] ?? null, precip: v.precipitation[i] ?? null, cloud: v.cloud_cover[i] ?? null,
    }));
    const d = j.daily || {};
    const days = (d.time || []).map((date, i) => ({
      date, sunrise: d.sunrise && d.sunrise[i] ? utc(d.sunrise[i]) : null, sunset: d.sunset && d.sunset[i] ? utc(d.sunset[i]) : null,
    }));
    return { model, hours, days };
  }

  // Einheiten: Temperatur °C (auf Höhe ele), Wind/Böen km/h, Richtung °, Nullgradgrenze m, snow cm/h, precip mm/h, cloud %
  function forecast(lat, lon, ele) {
    const k = `${lat.toFixed(2)},${lon.toFixed(2)},${Math.round(ele / 50)}`;
    const c = cache.get(k);
    if (c && Date.now() - c.at < TTL) return c.p;
    const p = get(lat, lon, ele);
    cache.set(k, { at: Date.now(), p });
    p.catch(() => cache.delete(k));
    return p;
  }

  // Anzeigename des Modells (w.model) für die Oberfläche
  const modelName = (model) => (/meteoswiss/i.test(model) ? 'MeteoSchweiz ICON' : model);

  return { forecast, modelName };
})();

/* ══════════════════════════ 24 · Datenquellen: Webcams, Lawinenunfälle, Ortssuche ══════════════════════════ */
const Webcams = (() => {
  const load = U.cached(async () => {
    const j = await U.retry(() => U.fetchJSON(CFG.url.mirror('roundshot.json'), { timeout: 30000 }));
    if (!j || !Array.isArray(j.cams)) throw new Error('Webcam-Liste nicht lesbar');
    return j.cams.filter((c) => Number.isFinite(c[1]) && Number.isFinite(c[2]))
      .map(([name, lat, lon, url, id]) => ({ name, lat, lon, url, id }));
  }, 6 * 3600e3);

  // → Promise<[{name, lat, lon, url, dist (m)}]> nach Distanz
  async function near(lat, lon, { km = 25, n = 8 } = {}) {
    const p = { lat, lon };
    return (await load())
      .map((c) => ({ name: c.name, lat: c.lat, lon: c.lon, url: c.url, dist: U.geo.dist(p, c) }))
      .filter((c) => c.dist <= km * 1000)
      .sort((a, b) => a.dist - b.dist)
      .slice(0, n);
  }
  return { near };
})();

const Accidents = (() => {
  const nn = (v) => (v == null || !Number.isFinite(+v) ? null : +v);
  // → Promise<[{date (ms), lat, lon, ele, caught, buried, dead, activity}]>; Saison der Liste in info.season
  let season = null;
  const load = U.cached(async () => {
    const j = await U.retry(() => U.fetchJSON(CFG.url.mirror('lawinen.json'), { timeout: 30000 }));

      caught: nn(x.caught) ?? 0, buried: nn(x.buried) ?? 0, dead: nn(x.dead) ?? 0, activity: x.act || '',

const Places = (() => {

  // → Promise<[{label, lat, lon}]>; leere Eingabe → []
  async function search(q) {

  let active = 0;
  const queue = [];

    const run = () => { active++; fn().then(resolve, reject).finally(() => { active--; const n = queue.shift(); if (n) n(); }); };
    active < MAX_PARALLEL ? run() : queue.push(run);
  });
  const key = (k, z, x, y) => `${k}/${z}/${x}/${y}`;
  function load(k, z, x, y) {
    const n = 2 ** z;
    if (y < 0 || y >= n) return Promise.resolve(null);
    x = ((x % n) + n) % n;
    const id = key(k, z, x, y);
    let p = cache.get(id);
    if (p) { cache.delete(id); cache.set(id, p); return p; }       // LRU: nach hinten
    const url = (k === 'd' ? CFG.url.demTile : CFG.url.slopeTile)(z, x, y);
    p = slot(() => U.fetchBitmap(url)).then((img) => (img && img.width === TILE && img.height === TILE ? img : null));
    p.catch(() => cache.delete(id));                                  // Fehler nicht merken
    cache.set(id, p);
    while (cache.size > MAX_TILES) cache.delete(cache.keys().next().value);
    return p;
  }
  const demTileFor = (z, x, y) => load('d', z, x, y);
  const slopeTileFor = (z, x, y) => load('s', z, x, y);

  // Kacheln (z, Bereich in Weltpixeln) laden → Map id → ImageData|null (lokal gehalten, unabhängig vom Verdrängen)
  async function gather(wanted) {
    const out = new Map();
    await Promise.all([...wanted.values()].map(async ([k, z, x, y]) => {
      const n = 2 ** z;
      out.set(key(k, z, ((x % n) + n) % n, y), await load(k, z, x, y));
    }));
    return out;
  }
  function want(set, k, z, x0, y0, x1, y1) {   // Weltpixel-Rechteck → Kacheln
    for (let ty = y0 >> 8; ty <= y1 >> 8; ty++) for (let tx = x0 >> 8; tx <= x1 >> 8; tx++) set.set(key(k, z, tx, ty), [k, z, tx, ty]);
  }

  /* ── Hangneigungskarte: Farbe → Klasse ── */
  const colorMemo = new Map();
  function slopeClassColor(rgba) {
    const [r, g, b, a = 255] = rgba;
    if (a < MIN_ALPHA) return 0;
    const k = (r << 16) | (g << 8) | b;
    let c = colorMemo.get(k);
    if (c === undefined) {
      let best = MAX_CLASS_DIST * MAX_CLASS_DIST;
      c = 0;
      for (const s of CFG.slopeClasses) {
        const d = (r - s.rgb[0]) ** 2 + (g - s.rgb[1]) ** 2 + (b - s.rgb[2]) ** 2;
        if (d < best) { best = d; c = s.cls; }
      }
      colorMemo.set(k, c);
    }
    return c;
  }
  const classCache = new WeakMap();   // ImageData → Uint8Array (Klasse je Pixel)
  function classesOf(img) {
    let a = classCache.get(img);
    if (a) return a;
    const d = img.data, n = img.width * img.height;
    a = new Uint8Array(n);
    for (let i = 0; i < n; i++) {
      const o = i * 4;
      if (d[o + 3] >= MIN_ALPHA) a[i] = slopeClassColor([d[o], d[o + 1], d[o + 2], d[o + 3]]);
    }
    classCache.set(img, a);
    return a;
  }
  // Klasse 0–5 am Pixel (px, py) einer Neigungskachel (0 ausserhalb / ohne Daten)
  function slopeClassAt(img, px, py) {
    if (!img || px < 0 || py < 0 || px >= img.width || py >= img.height) return 0;
    return classesOf(img)[py * img.width + px];
  }
  const midOfClass = [0]; for (const s of CFG.slopeClasses) midOfClass[s.cls] = s.mid;

  /* ── Fenstermittelpunkte je Umkreis (einmal je Pixelgrösse) ──
     Fenster ≈ CFG.grm.windowM (W Pixel), Mittelpunkte im Raster von ≈ 5 m, nach Abstand sortiert. */
  const radii = [...new Set(CFG.grm.radiusM.map((r) => r.m))].sort((a, b) => a - b);
  const offCache = new Map();
  function offsets(mpp) {
    const k = Math.round(mpp * 20);
    let o = offCache.get(k);
    if (o) return o;
    const W = Math.max(1, Math.round(CFG.grm.windowM / mpp)), step = Math.max(1, Math.round(5 / mpp));
    const R = radii[radii.length - 1] / mpp, ri = Math.floor(R / step), list = [];
    for (let j = -ri; j <= ri; j++) for (let i = -ri; i <= ri; i++) {
      const dx = i * step, dy = j * step, d2 = dx * dx + dy * dy;
      if (d2 <= R * R) list.push([d2, dx, dy]);
    }
    list.sort((a, b) => a[0] - b[0]);
    const n = list.length, dx = new Int16Array(n), dy = new Int16Array(n);
    list.forEach((e, i) => { dx[i] = e[1]; dy[i] = e[2]; });
    const cnt = radii.map((m) => { const r2 = (m / mpp) ** 2; let c = 0; while (c < n && list[c][0] <= r2) c++; return c; });
    const half = ri * step + (W >> 1) + 1;   // Halbbreite des Pixelbereichs um den Punkt
    o = { n, dx, dy, cnt, W, half };
    offCache.set(k, o);
    return o;
  }

  let I0 = new Int32Array(0), I1 = new Float64Array(0);   // Integralbilder (Anzahl / Summe der Klassenmitten)
  /* Steilste Stelle je Umkreis: Maximum der Fenstermittel. Pixelwert = Klassenmitte (Klasse ≥ 1), sonst DEM-Neigung
     (am Fenstermittelpunkt, höchstens 29.9; ohne DEM 0). demAtPx(cx, cy) liefert diese für ein Fenster (Weltpixel Neigungszoom). */
  function steepestInCircle(tiles, z, gx, gy, o, demAtPx) {
    const half = o.half, E = 2 * half + 1, S = E + 1, W = o.W, h2 = W >> 1;
    const tx0 = (gx - half) >> 8, tx1 = (gx + half) >> 8, ty0 = (gy - half) >> 8, ty1 = (gy + half) >> 8, gw = tx1 - tx0 + 1;
    const n2 = 2 ** z, grid = [];
    let any = false;
    for (let ty = ty0; ty <= ty1; ty++) for (let tx = tx0; tx <= tx1; tx++) {
      const img = tiles.get(key('s', z, ((tx % n2) + n2) % n2, ty));
      const a = img ? classesOf(img) : null;
      grid.push(a); if (a) any = true;
    }
    const res = new Array(radii.length).fill(null);
    if (!any) return res;
    if (I0.length < S * S) { I0 = new Int32Array(S * S); I1 = new Float64Array(S * S); }
    for (let i = 0; i < S; i++) { I0[i] = 0; I1[i] = 0; }
    for (let j = 0; j < E; j++) {
      const iy = gy - half + j, row = ((iy >> 8) - ty0) * gw, ro = (iy & 255) << 8;
      let c0 = 0, c1 = 0;
      const base = (j + 1) * S, prev = j * S;
      I0[base] = 0; I1[base] = 0;
      for (let i = 0; i < E; i++) {
        const ix = gx - half + i, a = grid[row + ((ix >> 8) - tx0)];
        const c = a ? a[ro | (ix & 255)] : 0;
        if (c) { c0++; c1 += midOfClass[c]; }
        I0[base + i + 1] = I0[prev + i + 1] + c0;
        I1[base + i + 1] = I1[prev + i + 1] + c1;
      }
    }
    const W2 = W * W, { n, dx, dy, cnt } = o;
    let best = 0, k = 0;
    for (let i = 0; i < n; i++) {
      while (k < radii.length && cnt[k] <= i) res[k++] = best;
      const x = half + dx[i] - h2, y = half + dy[i] - h2;
      const a = (y + W) * S + x + W, b = y * S + x + W, c = (y + W) * S + x, d = y * S + x;
      const s0 = I0[a] - I0[b] - I0[c] + I0[d];
      if (s0 === 0) continue;                       // reines «unter 30°»-Fenster: nicht steiler als DEM-Rückfall
      const s1 = I1[a] - I1[b] - I1[c] + I1[d];
      const dem = demAtPx(gx + dx[i], gy + dy[i]);
      const m = (s1 + (W2 - s0) * dem) / W2;
      if (m > best) best = m;
    }
    while (k < radii.length) res[k++] = best;
    return res;
  }

  /* ── DEM ── */
  const elevCache = new WeakMap();   // ImageData → Float32Array (m)
  function elevOf(img) {
    let a = elevCache.get(img);
    if (a) return a;
    const d = img.data, n = img.width * img.height;
    a = new Float32Array(n);
    for (let i = 0; i < n; i++) { const o = i * 4; a[i] = d[o] * 256 + d[o + 1] + d[o + 2] / 256 - 32768; }
    elevCache.set(img, a);
    return a;
  }
  // Neigung und Exposition (Horn) an einem Pixel eines Höhenrasters einer Kachel; Ränder geklemmt.
  // Für Nutzer ganzer Kacheln (Kartenebene). → {slope, aspect|null}
  function hornAt(el, ix, iy, mpp) {
    const g = (x, y) => el[U.clamp(y, 0, TILE - 1) * TILE + U.clamp(x, 0, TILE - 1)];
    const e = (g(ix + 1, iy - 1) + 2 * g(ix + 1, iy) + g(ix + 1, iy + 1) - g(ix - 1, iy - 1) - 2 * g(ix - 1, iy) - g(ix - 1, iy + 1)) / (8 * mpp);
    const s = (g(ix - 1, iy + 1) + 2 * g(ix, iy + 1) + g(ix + 1, iy + 1) - g(ix - 1, iy - 1) - 2 * g(ix, iy - 1) - g(ix + 1, iy - 1)) / (8 * mpp);
    const slope = Math.atan(Math.hypot(e, s)) / rad;
    return { slope, aspect: slope < FLAT_DEG ? null : (Math.atan2(-e, s) / rad + 360) % 360 };
  }
  function elevPx(tiles, z, ix, iy) {
    const n = 2 ** z;
    if (iy < 0 || iy >= n * TILE) return NaN;
    const img = tiles.get(key('d', z, ((ix >> 8) % n + n) % n, iy >> 8));
    return img ? elevOf(img)[((iy & 255) << 8) | (ix & 255)] : NaN;
  }
  // Höhe (bilinear), Neigung und Exposition (Horn, an den 4 Nachbarpixeln, bilinear interpoliert)
  function demAt(tiles, z, lat, wx, wy) {   // wx, wy: Weltpixel (Bruchteil)
    const gx = wx - 0.5, gy = wy - 0.5, ix = Math.floor(gx), iy = Math.floor(gy), fx = gx - ix, fy = gy - iy;
    const h = [];
    for (let j = -1; j <= 2; j++) for (let i = -1; i <= 2; i++) {
      const v = elevPx(tiles, z, ix + i, iy + j);
      if (v !== v) return { elev: null, slope: null, aspect: null };
      h.push(v);
    }
    const H = (i, j) => h[(j + 1) * 4 + i + 1];
    const elev = (H(0, 0) * (1 - fx) + H(1, 0) * fx) * (1 - fy) + (H(0, 1) * (1 - fx) + H(1, 1) * fx) * fy;
    const mpp = U.geo.mPerPx(lat, z);
    const gE = [], gS = [];   // Horn an (0,0) (1,0) (0,1) (1,1)
    for (const [i, j] of [[0, 0], [1, 0], [0, 1], [1, 1]]) {
      gE.push((H(i + 1, j - 1) + 2 * H(i + 1, j) + H(i + 1, j + 1) - H(i - 1, j - 1) - 2 * H(i - 1, j) - H(i - 1, j + 1)) / (8 * mpp));
      gS.push((H(i - 1, j + 1) + 2 * H(i, j + 1) + H(i + 1, j + 1) - H(i - 1, j - 1) - 2 * H(i, j - 1) - H(i + 1, j - 1)) / (8 * mpp));
    }
    const bil = (g) => (g[0] * (1 - fx) + g[1] * fx) * (1 - fy) + (g[2] * (1 - fx) + g[3] * fx) * fy;
    const e = bil(gE), s = bil(gS);               // Anstieg nach Osten bzw. nach Süden (y wächst nach Süden)
    const slope = Math.atan(Math.hypot(e, s)) / rad;
    // Abfallrichtung = −Gradient; Nordkomponente = +s
    const aspect = slope < FLAT_DEG ? null : (Math.atan2(-e, s) / rad + 360) % 360;
